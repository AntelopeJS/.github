name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: npm distribution channel (latest from the default branch, next from the next branch)
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next
      package-directory:
        description: Relative path to the package directory to release
        required: true
        default: .
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    uses: AntelopeJS/.github/.github/workflows/release-npm-public.yml@v1
    with:
      channel: ${{ inputs.channel }}
      install-core: true
      package-directory: ${{ inputs.package-directory }}
      # Uncomment when the release tests need service containers (databases,
      # storage emulators, ...) described in a docker compose file.
      # services-compose-file: docker-compose.release.yml
    secrets:
      RELEASE_GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
