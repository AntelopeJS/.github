name: CI tier
description: Pick the CI tier and the diff base from the event, the ci:full label and the files a pull request changes

inputs:
  selection:
    description: full forces the full tier on a pull request; the caller passes its CI_SELECTION variable
    default: ""

outputs:
  tier:
    description: none, fast, full, queue or nightly; none on a Renovate pull request whose head only commits the module locks of a run whose checks passed; in a merge group the queue dropped, the action fails and sets none
    value: ${{ steps.tier.outputs.tier }}
  base:
    description: The commit the change is compared with, present in the checkout when there is one; the pull request base on a pull request, the merge group base in the merge queue, empty otherwise
    value: ${{ steps.tier.outputs.base }}

runs:
  using: composite
  steps:
    - name: Pick the tier and the diff base from the event, the label and the changed files
      id: tier
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        REF_NAME: ${{ github.ref_name }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
        MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        MERGE_GROUP_BASE_REF: ${{ github.event.merge_group.base_ref }}
        MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
        MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        REPOSITORY: ${{ github.repository }}
        HEAD_REF: ${{ github.head_ref }}
        HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        SELECTION: ${{ inputs.selection }}
        TOKEN: ${{ github.token }}
      run: |
        base=""
        case "$EVENT" in
          pull_request)
            base="$PULL_REQUEST_BASE"
            if [[ "$FULL_LABEL" == true || "$SELECTION" == full ]]; then tier=full; else tier=fast; fi
            ;;
          merge_group)
            base="$MERGE_GROUP_BASE"
            tier=queue
            # A merge queue that rebuilds or drops a group deletes the group's branch, or points it at the new
            # group when it rebuilds on the same parent, but leaves the old group's runs queued, and nothing in an
            # expression can name the pull request to cancel them by. Such a run stops here, failed, before its
            # tests take a runner. A group that merged also loses its branch, but its head is then on the base
            # branch, so a job of it that starts late runs as before, and so does any job whose API call fails.
            # contents: read is enough for both calls.
            if [[ -n "$MERGE_GROUP_HEAD_REF" && -n "$MERGE_GROUP_HEAD_SHA" ]] \
              && refs=$(GH_TOKEN="$TOKEN" gh api "repos/${REPOSITORY}/git/matching-refs/${MERGE_GROUP_HEAD_REF#refs/}" --jq '.[] | "\(.ref) \(.object.sha)"' 2> /dev/null) \
              && ! grep -Fxq -- "${MERGE_GROUP_HEAD_REF} ${MERGE_GROUP_HEAD_SHA}" <<< "$refs" \
              && against_base=$(GH_TOKEN="$TOKEN" gh api "repos/${REPOSITORY}/compare/${MERGE_GROUP_BASE_REF#refs/heads/}...${MERGE_GROUP_HEAD_SHA}" --jq .status 2> /dev/null) \
              && [[ "$against_base" == ahead || "$against_base" == diverged ]]; then
              message="The merge queue dropped this group: ${MERGE_GROUP_HEAD_REF#refs/heads/} no longer points at its head ${MERGE_GROUP_HEAD_SHA}, which is not on ${MERGE_GROUP_BASE_REF#refs/heads/}. The queue tests the pull request in a newer group, so this run tests nothing."
              echo "::error title=Superseded merge group::${message}"
              echo "Superseded merge group: ${message}" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            ;;
          push)
            if [[ "$REF_NAME" == "$DEFAULT_BRANCH" ]]; then tier=none; else tier=full; fi
            ;;
          schedule) tier=nightly ;;
          *) tier=full ;;
        esac

        fetch() {
          credentials=$(printf 'x-access-token:%s' "$TOKEN" | base64 --wrap=0)
          echo "::add-mask::${credentials}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${credentials}" \
            fetch --quiet --no-tags "--depth=$1" origin "$2"
        }

        if [[ "$EVENT" == pull_request && "$HEAD_REF" == renovate/* && "$HEAD_REPOSITORY" == "$REPOSITORY" && -n "$HEAD_SHA" ]] \
          && git rev-parse --is-inside-work-tree > /dev/null 2>&1 \
          && { git cat-file -e "${HEAD_SHA}^^{commit}" 2> /dev/null || fetch 2 "$HEAD_SHA" 2> /dev/null; } \
          && [[ "$(git log -1 --format='%ae%x09%s' "$HEAD_SHA")" == $'41898282+github-actions[bot]@users.noreply.github.com\tbuild(deps): record the module locks of the bumped modules' ]] \
          && [[ "$(git rev-list --parents -n 1 "$HEAD_SHA" | wc -w)" -eq 2 ]] \
          && checks=$(git log -1 --format='%(trailers:key=Checks-Passed,valueonly,separator=%x20)' "$HEAD_SHA") && [[ -n "$checks" ]] \
          && files=$(git -c core.quotepath=off diff --name-only --no-renames "${HEAD_SHA}^" "$HEAD_SHA") && [[ -n "$files" ]] \
          && ! grep -qvE '^([^/]+/)*antelope-lock/' <<< "$files"; then
          tier=none
          echo "Tier \`none\`: the head commit only records the module locks of ${checks}, whose checks passed." >> "$GITHUB_STEP_SUMMARY"
        fi

        if [[ -n "$base" ]] && git rev-parse --is-inside-work-tree > /dev/null 2>&1; then
          if ! git cat-file -e "${base}^{commit}" 2> /dev/null; then
            fetch 1 "$base"
          fi
          if [[ "$tier" == fast ]]; then
            changed=$(git -c core.quotepath=off diff --name-only --no-renames "$base" HEAD)
            while IFS= read -r file; do
              case "$file" in
                pnpm-lock.yaml | */pnpm-lock.yaml | .github/workflows/* | .github/actions/*) tier=full ;;
                "" | */* | *.md) ;;
                *) tier=full ;;
              esac
            done <<< "$changed"
          fi
        fi

        {
          echo "tier=${tier}"
          echo "base=${base}"
        } >> "$GITHUB_OUTPUT"
