name: Module locks checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ${{ vars.RUNNER_CI || 'blacksmith-4vcpu-ubuntu-2404' }}
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Install the type checker and Renovate
        run: npm install --no-save --no-audit --no-fund --silent --prefix "$RUNNER_TEMP/tools" typescript@5.9.3 @types/node@24.10.1 renovate@44.247.1

      - name: Typecheck
        run: |
          "$RUNNER_TEMP/tools/node_modules/.bin/tsc" -p scripts/module-locks/tsconfig.json --typeRoots "$RUNNER_TEMP/tools/node_modules/@types"

      - name: Test
        env:
          LOG_LEVEL: warn
          RENOVATE_MODULES: ${{ runner.temp }}/tools/node_modules
        run: node --test 'scripts/module-locks/*.test.ts'

      - name: Validate the Renovate preset
        env:
          LOG_LEVEL: warn
        run: |
          "$RUNNER_TEMP/tools/node_modules/.bin/renovate-config-validator" --strict --no-global renovate.json5

      - name: Lint the module locks, Renovate sync, Renovate sweep and bot branch cleanup workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --quiet
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/bot-branch-cleanup.yml .github/workflows/ci-renovate-sync.yml .github/workflows/module-locks-checks.yml .github/workflows/module-locks-refresh.yml .github/workflows/module-locks-renovate.yml .github/workflows/renovate-sweep.yml .github/workflows/template-demo-sync.yml
