name: Docs captures

on:
  workflow_call:
    inputs:
      base:
        description: Branch the run checks out and the docs captures pull request targets
        default: next
        type: string
      demo-ref:
        description: Ref of AntelopeJS/template-dms-demo the captures run against
        default: main
        type: string
      auto-merge:
        description: Arm auto-merge on the docs captures pull request, so it lands when `checks` passes
        default: false
        type: boolean
    secrets:
      token:
        description: Token that pushes the branch and opens the pull request; pushes made with the default token start no `checks` run, so auto-merge needs one that does
        required: false

jobs:
  captures:
    name: Docs captures
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: docs-captures-${{ github.repository }}-${{ inputs.base }}
      cancel-in-progress: false
    env:
      BASE: ${{ inputs.base }}
      DEMO_REF: ${{ inputs.demo-ref }}
      AUTO_MERGE: ${{ inputs.auto-merge }}
      GH_TOKEN: ${{ secrets.token || github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base }}
          token: ${{ secrets.token || github.token }}
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent

      - name: Install Chromium
        run: pnpm exec playwright-core install --with-deps chromium

      - name: Capture every scene
        run: |
          failures="${RUNNER_TEMP}/capture-failures.txt"
          status=0
          pnpm exec antelopejs-capture --demo-ref "$DEMO_REF" 2> "$failures" || status=$?
          if [ "$status" -ne 0 ]; then
            cat "$failures" >&2
            {
              echo "### Docs captures failed"
              echo
              sed 's/^/- /' "$failures"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Open or update the docs captures pull request
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No screenshot changed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch=docs/captures
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --force-create "$branch"
          git add --all
          git commit --message "docs(captures): regenerate the screenshots"
          git push --force origin "$branch"
          number=$(gh pr list --head "$branch" --base "$BASE" --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            number=$(gh pr create --base "$BASE" --head "$branch" \
              --title "docs(captures): regenerate the screenshots" \
              --body "Regenerated by \`antelopejs-capture\` against template-dms-demo at \`${DEMO_REF}\`. A scene that differs by more than 0.1% of its pixels is rewritten; nothing else changes." \
              | sed 's#.*/##')
          fi
          echo "Docs captures pull request: #${number}" >> "$GITHUB_STEP_SUMMARY"
          if [ "$AUTO_MERGE" = "true" ]; then
            gh pr merge "$number" --auto --squash
          fi
