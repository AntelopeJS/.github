name: Mutation testing

on:
  workflow_call:
    inputs:
      stryker-command:
        description: Command that runs Stryker in the calling repository
        default: pnpm exec stryker run
        type: string
      report-file:
        description: Path of the Stryker JSON report
        default: reports/mutation/mutation.json
        type: string
      incremental-file:
        description: Path of the Stryker incremental file kept in the actions cache
        default: reports/stryker-incremental.json
        type: string
      timeout-minutes:
        description: Time limit of the Stryker job
        default: 180
        type: number

permissions: {}

jobs:
  tier:
    name: Tier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      eligible: ${{ steps.tier.outputs.eligible }}
    steps:
      - id: tier
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tier=$(gh api "repos/${GH_REPO}/properties/values" --jq '.[] | select(.property_name == "tier") | .value')
          if [ "$tier" = "N1" ] || [ "$tier" = "N2" ]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          fi

  mutation:
    name: Stryker
    needs: [tier]
    if: needs.tier.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent

      - name: Restore the incremental file
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.incremental-file }}
          key: stryker-incremental-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            stryker-incremental-${{ runner.os }}-

      - name: Run Stryker
        env:
          STRYKER_COMMAND: ${{ inputs.stryker-command }}
          INCREMENTAL_FILE: ${{ inputs.incremental-file }}
        run: |
          $STRYKER_COMMAND --incremental --incrementalFile "$INCREMENTAL_FILE" --reporters json --logLevel error

      - name: Save the incremental file
        if: always() && hashFiles(inputs.incremental-file) != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.incremental-file }}
          key: stryker-incremental-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: ${{ inputs.report-file }}
          if-no-files-found: error
          retention-days: 30
