name: Release npm package

on:
  workflow_call:
    inputs:
      registry:
        description: public publishes to npmjs with provenance, private to https://npm.antelopejs.cloud/ with NPM_ANTELOPE_TOKEN
        required: true
        type: string
      release-version:
        required: true
        type: string
      release-commit:
        required: true
        type: string
      dependency-ranges:
        required: true
        type: string
      install-core:
        required: true
        type: boolean
      package-directory:
        required: true
        type: string
      integration-branch:
        required: true
        type: string
    secrets:
      RELEASE_GITHUB_TOKEN:
        required: false
      NPM_ANTELOPE_TOKEN:
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm-publish
    concurrency:
      group: npm-release-${{ github.repository }}-${{ github.event_name }}-${{ inputs.package-directory }}
      cancel-in-progress: false
    steps:
      - name: Resolve release mode
        id: mode
        env:
          RELEASE_VERSION: ${{ inputs.release-version }}
          RELEASE_COMMIT: ${{ inputs.release-commit }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] && [[ "$GITHUB_REF" == refs/heads/* ]] && [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "mode=preview" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
            [ -z "$RELEASE_VERSION" ] || [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
              echo "A stable release needs release-version as M.m.p, got '$RELEASE_VERSION'." >&2
              exit 1
            }
            [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
              echo "A dispatch of $DEFAULT_BRANCH needs release-commit as the 40-character SHA of the planned commit, got '$RELEASE_COMMIT'." >&2
              exit 1
            }
            if [ -z "$RELEASE_VERSION" ]; then
              echo "mode=repin" >> "$GITHUB_OUTPUT"
            else
              echo "mode=stable" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "A push to a branch other than $DEFAULT_BRANCH publishes a preview, and a workflow_dispatch of $DEFAULT_BRANCH publishes a stable release. A $GITHUB_EVENT_NAME of $GITHUB_REF publishes nothing." >&2
            exit 1
          fi

      - name: Validate release credentials
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          REGISTRY: ${{ inputs.registry }}
          RELEASE_GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          NPM_ANTELOPE_TOKEN: ${{ secrets.NPM_ANTELOPE_TOKEN }}
        run: |
          case "$REGISTRY" in
            public) ;;
            private)
              test -n "$NPM_ANTELOPE_TOKEN" || {
                echo "NPM_ANTELOPE_TOKEN is not configured." >&2
                exit 1
              }
              ;;
            *)
              echo "registry must be public or private, got '$REGISTRY'." >&2
              exit 1
              ;;
          esac
          if [ "$MODE" != preview ] && [ -z "$RELEASE_GITHUB_TOKEN" ]; then
            echo "RELEASE_GITHUB_TOKEN is not configured." >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the planned commit
        if: steps.mode.outputs.mode != 'preview'
        env:
          RELEASE_COMMIT: ${{ inputs.release-commit }}
        run: |
          head=$(git rev-parse HEAD)
          if [ "$head" != "$RELEASE_COMMIT" ]; then
            echo "$GITHUB_REF_NAME moved since the plan: HEAD is $head, the plan released $RELEASE_COMMIT. Run the release train again." >&2
            exit 1
          fi

      - name: Validate package directory
        env:
          PACKAGE_DIRECTORY: ${{ inputs.package-directory }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')

          const workspace = fs.realpathSync(process.env.GITHUB_WORKSPACE)
          const input = process.env.PACKAGE_DIRECTORY
          if (!input || path.isAbsolute(input)) {
            console.error('package-directory must be a relative directory inside the repository')
            process.exit(1)
          }

          const directory = path.resolve(workspace, input)
          const relativeDirectory = path.relative(workspace, directory)
          if (relativeDirectory === '..' || relativeDirectory.startsWith(`..${path.sep}`) || path.isAbsolute(relativeDirectory)) {
            console.error('package-directory must stay inside the repository')
            process.exit(1)
          }

          let realDirectory
          try {
            realDirectory = fs.realpathSync(directory)
          } catch {
            console.error(`package-directory does not exist: ${input}`)
            process.exit(1)
          }
          const realRelativeDirectory = path.relative(workspace, realDirectory)
          if (realRelativeDirectory === '..' || realRelativeDirectory.startsWith(`..${path.sep}`) || path.isAbsolute(realRelativeDirectory)) {
            console.error('package-directory must resolve inside the repository')
            process.exit(1)
          }
          if (!fs.statSync(realDirectory).isDirectory()) {
            console.error(`package-directory is not a directory: ${input}`)
            process.exit(1)
          }

          const packageJson = path.join(realDirectory, 'package.json')
          if (!fs.statSync(packageJson, { throwIfNoEntry: false })?.isFile()) {
            console.error(`package.json was not found in package-directory: ${input}`)
            process.exit(1)
          }
          NODE

      - name: Resolve pnpm lockfile
        id: lockfile
        env:
          PACKAGE_DIRECTORY: ${{ inputs.package-directory }}
        run: |
          set -euo pipefail
          root=$(pwd -P)
          directory=$(cd "$PACKAGE_DIRECTORY" && pwd -P)
          lockfile=""
          current="$directory"
          while [ "$current" = "$root" ] || [ "${current#"$root"/}" != "$current" ]; do
            if [ -f "$current/pnpm-lock.yaml" ]; then
              if [ "$current" = "$root" ]; then
                lockfile=pnpm-lock.yaml
              else
                lockfile="${current#"$root"/}/pnpm-lock.yaml"
              fi
              break
            fi
            if [ "$current" = "$root" ]; then
              break
            fi
            current=$(dirname "$current")
          done
          if [ -z "$lockfile" ]; then
            echo "No pnpm-lock.yaml found in $PACKAGE_DIRECTORY or any parent directory up to the repository root." >&2
            exit 1
          fi
          echo "Using lockfile $lockfile"
          echo "path=$lockfile" >> "$GITHUB_OUTPUT"

      - name: Resolve pnpm workspace root
        id: workspace
        env:
          PACKAGE_DIRECTORY: ${{ inputs.package-directory }}
        run: |
          set -euo pipefail
          root=$(pwd -P)
          current=$(cd "$PACKAGE_DIRECTORY" && pwd -P)
          directory=$PACKAGE_DIRECTORY
          while :; do
            if [ -f "$current/pnpm-workspace.yaml" ]; then
              if [ "$current" = "$root" ]; then
                directory=.
              else
                directory=${current#"$root"/}
              fi
              break
            fi
            if [ "$current" = "$root" ]; then
              break
            fi
            current=$(dirname "$current")
          done
          echo "install-directory=$directory" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          registry-url: ${{ inputs.registry == 'private' && 'https://npm.antelopejs.cloud/' || 'https://registry.npmjs.org' }}
          scope: ${{ inputs.registry == 'private' && '@antelopejs-private' || '' }}

      - name: Validate package publication metadata
        working-directory: ${{ inputs.package-directory }}
        env:
          REGISTRY: ${{ inputs.registry }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ANTELOPE_TOKEN }}
        run: |
          node <<'NODE'
          const { spawnSync } = require('node:child_process')
          const pkg = require('./package.json')
          const { scope, publishConfig } = {
            public: { scope: '@antelopejs', publishConfig: { access: 'public', provenance: true } },
            private: { scope: '@antelopejs-private', publishConfig: { registry: 'https://npm.antelopejs.cloud/' } },
          }[process.env.REGISTRY]
          const errors = []
          const repository = process.env.GITHUB_REPOSITORY
          const slugOf = (url) => /github\.com[:/]([^/]+\/[^/]+?)(?:\.git)?\/?$/i.exec(url ?? '')?.[1]?.toLowerCase()
          const url = typeof pkg.repository === 'string' ? pkg.repository : pkg.repository?.url
          if (slugOf(url) !== repository.toLowerCase()) errors.push(`repository.url must name ${repository}, got ${url ?? 'nothing'}`)
          const view = spawnSync('npm', ['view', pkg.name, 'repository.url'], { encoding: 'utf8' })
          const published = view.stdout?.trim()
          if (view.status === 0 && published && slugOf(published) !== repository.toLowerCase()) {
            errors.push(`${pkg.name} on npm comes from ${published}, not from ${repository}`)
          } else if (view.status !== 0 && !/\bE404\b/.test(view.stderr ?? '')) {
            errors.push(`npm view ${pkg.name} repository.url failed: ${(view.stderr ?? '').trim()}`)
          }
          if (!pkg.name?.startsWith(`${scope}/`)) errors.push(`name must use the ${scope} scope`)
          if (pkg.private === true) errors.push('private must not be true')
          if (pkg.license !== 'Apache-2.0') errors.push('license must be Apache-2.0')
          for (const [key, value] of Object.entries(publishConfig)) {
            if (pkg.publishConfig?.[key] !== value) errors.push(`publishConfig.${key} must be ${value}`)
          }
          if (errors.length) {
            console.error(errors.join('\n'))
            process.exit(1)
          }
          NODE

      - name: Resolve release version
        id: version
        if: steps.mode.outputs.mode != 'repin'
        working-directory: ${{ inputs.package-directory }}
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          RELEASE_VERSION: ${{ inputs.release-version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ANTELOPE_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s inherit_errexit
          latest_of() {
            if ! npm view "$1" version 2>"$RUNNER_TEMP/npm-view.log" && ! grep -q E404 "$RUNNER_TEMP/npm-view.log"; then
              cat "$RUNNER_TEMP/npm-view.log" >&2
              return 1
            fi
          }
          preview_of() {
            local name previous latest major minor patch base
            name=$(node -p "require('./package.json').name")
            previous=$(npm view "$name@next" gitHead 2>/dev/null || true)
            if [ -n "$previous" ] && git cat-file -e "$previous^{commit}" 2>/dev/null && PREVIOUS=$previous node <<'NODE'
          const { execFileSync } = require('node:child_process')
          const fs = require('node:fs')
          const { isDeepStrictEqual } = require('node:util')
          const { PREVIOUS, GITHUB_SHA } = process.env
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' })
          const { output } = fs.existsSync('changelogen.config.json') ? require('./changelogen.config.json') : {}
          const changelog = (typeof output === 'string' ? output : 'CHANGELOG.md').replace(/^\.\//, '')
          const shipped = (revision) => ({ ...JSON.parse(git('show', `${revision}:./package.json`)), version: null })
          const ships = (file) => file !== changelog && (file !== 'package.json' || !isDeepStrictEqual(shipped(PREVIOUS), shipped(GITHUB_SHA)))
          const released = git('ls-files', '-z', '--', '*/.release-it.json').split('\0').filter(Boolean).map((file) => file.slice(0, -'.release-it.json'.length))
          const own = (file) => !released.some((directory) => file.startsWith(directory)) && !/(^|\/)pnpm-lock\.yaml$/.test(file)
          const changed = git('diff', '--name-only', '--no-renames', '--relative', '-z', PREVIOUS, GITHUB_SHA, '--', '.').split('\0').filter(Boolean)
          process.exit(changed.filter(own).some(ships) ? 1 : 0)
          NODE
            then
              return 0
            fi
            latest=$(latest_of "$name")
            if [ -n "$latest" ]; then
              IFS=. read -r major minor patch <<< "$latest"
              base="$major.$minor.$((patch + 1))"
            else
              base=$(node -p "require('./package.json').version.split('-')[0]")
            fi
            echo "$base-next.$(git rev-list --count HEAD).g$(git rev-parse --short=7 HEAD)"
          }
          name=$(node -p "require('./package.json').name")
          if [ "$MODE" = preview ]; then
            version=$(preview_of)
            if [ -z "$version" ]; then
              echo "::notice::$name ships nothing new since its last preview, so it gets no new one."
              exit 0
            fi
            if [ -n "$(npm view "$name@$version" version 2>/dev/null || true)" ]; then
              echo "::notice::$name@$version is already published."
              exit 0
            fi
            node > "$RUNNER_TEMP/siblings.tsv" <<'NODE'
          const { execFileSync } = require('node:child_process')
          const fs = require('node:fs')
          const path = require('node:path')
          const pkg = require('./package.json')
          const top = execFileSync('git', ['rev-parse', '--show-toplevel'], { encoding: 'utf8' }).trim()
          const nameOf = (file) => {
            try {
              return JSON.parse(fs.readFileSync(path.join(top, file), 'utf8')).name
            } catch {
              return undefined
            }
          }
          const files = execFileSync('git', ['ls-files', '-z', '--', ':(glob)**/package.json'], { cwd: top, encoding: 'utf8' }).split('\0').filter(Boolean)
          const directories = new Map(files.filter((file) => fs.existsSync(path.join(top, path.dirname(file), '.release-it.json'))).map((file) => [nameOf(file), path.dirname(file)]))
          const siblings = new Set(['dependencies', 'peerDependencies', 'optionalDependencies'].flatMap((field) =>
            Object.entries(pkg[field] ?? {}).filter(([, spec]) => spec.startsWith('workspace:')).map(([name]) => name),
          ))
          for (const name of siblings) {
            const directory = directories.get(name)
            if (directory !== undefined) console.log(`${name}\t${directory}`)
          }
          NODE
            pins='{}'
            while IFS=$'\t' read -r sibling directory; do
              pin=$(cd "$(git rev-parse --show-toplevel)/$directory" && preview_of)
              if [ -z "$pin" ]; then
                current=$(npm view "$sibling@next" version 2>/dev/null || true)
                latest=$(latest_of "$sibling")
                if [ -n "$current" ] && { [ -z "$latest" ] || node -e 'const [a, b] = process.argv.slice(1).map((v) => v.split("-")[0].split(".").map(Number)); process.exit((a[0] - b[0] || a[1] - b[1] || a[2] - b[2]) > 0 ? 0 : 1)' "$current" "$latest"; }; then
                  pin=$current
                fi
              fi
              if [ -n "$pin" ]; then
                pins=$(jq -c --arg name "$sibling" --arg pin "$pin" '. + {($name): $pin}' <<< "$pins")
              fi
            done < "$RUNNER_TEMP/siblings.tsv"
            if [ "$pins" != '{}' ]; then
              echo "pins=$pins" >> "$GITHUB_OUTPUT"
            fi
          else
            latest=$(latest_of "$name")
            IFS=. read -r major minor patch <<< "${latest:-0.0.0}"
            version=$RELEASE_VERSION
            IFS=. read -r new_major new_minor new_patch <<< "$version"
            if [ -n "$latest" ] && [ "$new_major" != "$major" ]; then
              echo "$version changes the major version of $name $latest, which a release never does." >&2
              exit 1
            fi
            if [ "$latest" = "$version" ]; then
              tag=$(node -p "const fs = require('node:fs'); const config = fs.existsSync('.release-it.json') ? JSON.parse(fs.readFileSync('.release-it.json', 'utf8')) : {}; (config.git?.tagName || 'v\${version}').replace('\${version}', process.env.RELEASE_VERSION)")
              if git rev-parse --verify --quiet "refs/tags/$tag" > /dev/null; then
                echo "$name $version is released: npm holds it and the tag $tag exists." >&2
                exit 1
              fi
              published=$(npm view "$name@$version" gitHead 2>/dev/null || true)
              if [ "$published" != "$(git rev-parse HEAD)" ]; then
                echo "npm holds $name $version from commit ${published:-unknown}, not from $GITHUB_REF_NAME at the planned commit $(git rev-parse HEAD), so this run cannot finish its release." >&2
                exit 1
              fi
              echo "::notice::npm holds $name $version but the tag $tag is missing, so this run writes the release commit, the tag and the GitHub release without publishing again."
              echo "resume=true" >> "$GITHUB_OUTPUT"
            elif [ -n "$latest" ] && (( new_minor < minor || (new_minor == minor && new_patch <= patch) )); then
              echo "$version is not greater than $name $latest on npm." >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Apply dependency ranges
        id: ranges
        if: steps.mode.outputs.mode != 'preview'
        working-directory: ${{ inputs.package-directory }}
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          DEPENDENCY_RANGES: ${{ inputs.dependency-ranges }}
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const fields = ['dependencies', 'peerDependencies', 'optionalDependencies', 'devDependencies']
          const part = '(?:0|[1-9]\\d*|[xX*])'
          const identifiers = '[0-9A-Za-z-]+(?:\\.[0-9A-Za-z-]+)*'
          const partial = `v?${part}(?:\\.${part}(?:\\.${part}(?:-${identifiers})?(?:\\+${identifiers})?)?)?`
          const partialPattern = new RegExp(`^${partial}$`)
          const comparatorPattern = new RegExp(`^(?:[<>]=?|=|~>?|\\^)?${partial}$`)
          const alias = /^npm:(?:@[a-z0-9][\w.-]*\/)?[a-z0-9][\w.-]*@(.+)$/
          const isRegistrySpec = (spec) =>
            (alias.exec(spec)?.[1] ?? spec).split('||').every((set) => {
              const words = set.trim().replace(/([<>=~^])\s+/g, '$1').split(/\s+/)
              if (words.length === 3 && words[1] === '-') return words.every((word, index) => index === 1 || partialPattern.test(word))
              return words.every((word) => comparatorPattern.test(word))
            })
          const isPreview = (spec) => /\d+\.\d+\.\d+-/.test(spec)
          let ranges = null
          try {
            ranges = JSON.parse(process.env.DEPENDENCY_RANGES || '{}')
          } catch {}
          if (ranges === null || typeof ranges !== 'object' || Array.isArray(ranges) || !Object.values(ranges).every((range) => typeof range === 'string')) {
            console.error('dependency-ranges must be a JSON object mapping each dependency name to a range')
            process.exit(1)
          }
          const unstable = Object.entries(ranges).filter(([, range]) => !isRegistrySpec(range) || isPreview(range))
          if (unstable.length) {
            console.error(`dependency-ranges must map each name to a stable version range:\n${unstable.map((pair) => pair.join(' ')).join('\n')}`)
            process.exit(1)
          }
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          const previewFields = (name) => fields.filter((field) => Object.hasOwn(pkg[field] ?? {}, name) && isPreview(pkg[field][name]))
          const names = Object.keys(ranges)
          const missing = names.filter((name) => previewFields(name).length === 0)
          if (missing.length) {
            console.error(`dependency-ranges names packages that package.json does not pin to a preview: ${missing.join(', ')}`)
            process.exit(1)
          }
          const runtime = names.filter((name) => previewFields(name).some((field) => field !== 'devDependencies'))
          if (process.env.MODE === 'repin' && (names.length === 0 || runtime.length)) {
            console.error(`A dispatch without release-version publishes nothing, so it only moves devDependency preview pins to the ranges of dependency-ranges${runtime.length ? `, and a runtime pin needs a release: ${runtime.join(', ')}` : ''}`)
            process.exit(1)
          }
          if (names.length) {
            for (const name of names) {
              for (const field of previewFields(name)) pkg[field][name] = ranges[name]
            }
            fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`)
            const list = names.length === 1 ? names[0] : `${names.slice(0, -1).join(', ')} and ${names.at(-1)}`
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `message=fix(deps): depend on the stable ${list}\n`)
          }
          const specsOf = (field) => Object.entries(pkg[field] ?? {})
          for (const [name, spec] of specsOf('devDependencies').filter(([, spec]) => isPreview(spec))) {
            console.log(`::warning::This run keeps the devDependency preview ${name} ${spec}.`)
          }
          const refused = fields.slice(0, 3).flatMap((field) =>
            specsOf(field).filter(([, spec]) => isPreview(spec) || (!isRegistrySpec(spec) && !spec.startsWith('workspace:'))).map(([name, spec]) => `${field} ${name} ${spec}`),
          )
          if (refused.length) {
            console.error(`A stable release depends only on stable registry version ranges. Give each preview a stable range in dependency-ranges, and replace each other spec:\n${refused.join('\n')}`)
            process.exit(1)
          }
          NODE

      - name: Restore the pnpm store
        if: steps.version.outputs.version != '' || steps.mode.outputs.mode == 'repin'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ${{ steps.lockfile.outputs.path }}

      - name: Install dependencies
        if: steps.version.outputs.version != '' || steps.mode.outputs.mode == 'repin'
        working-directory: ${{ steps.workspace.outputs.install-directory }}
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          RANGES_APPLIED: ${{ steps.ranges.outputs.message != '' }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ANTELOPE_TOKEN }}
        run: |
          if [ "$MODE" = repin ]; then
            pnpm install --lockfile-only
          elif [ "$RANGES_APPLIED" = true ]; then
            pnpm install --no-frozen-lockfile
          else
            pnpm install --frozen-lockfile
          fi

      - name: Install AntelopeJS CLI
        if: inputs.install-core && steps.version.outputs.version != ''
        run: pnpm add --global @antelopejs/core

      - name: Configure release identity
        if: steps.mode.outputs.mode != 'preview'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Stage stable dependencies
        if: steps.ranges.outputs.message != ''
        env:
          PACKAGE_DIRECTORY: ${{ inputs.package-directory }}
          LOCKFILE: ${{ steps.lockfile.outputs.path }}
        run: |
          git add -- "$PACKAGE_DIRECTORY/package.json" "$LOCKFILE"

      - name: Bring the stable ranges to the integration branch
        if: steps.ranges.outputs.message != ''
        env:
          BRANCH: ${{ inputs.integration-branch }}
          MESSAGE: ${{ steps.ranges.outputs.message }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet "refs/remotes/origin/$BRANCH" > /dev/null; then
            exit 0
          fi
          commit=$(git commit-tree "$(git write-tree)" -p HEAD -m "$MESSAGE")
          worktree="$RUNNER_TEMP/integration-branch"
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
          trap 'git config --local --unset-all http.https://github.com/.extraheader || true; git worktree remove --force "$worktree" 2> /dev/null || true' EXIT
          git worktree add --quiet --detach "$worktree" "origin/$BRANCH"
          if ! git -C "$worktree" cherry-pick "$commit" > /dev/null 2>&1; then
            if [ -n "$(git -C "$worktree" diff --name-only --diff-filter=U)" ]; then
              echo "::warning::$BRANCH changed the same dependency lines since the plan, so it keeps them and the Next sync of this release will conflict."
            fi
            git -C "$worktree" cherry-pick --abort
            exit 0
          fi
          if ! git -C "$worktree" push --quiet origin "HEAD:refs/heads/$BRANCH"; then
            echo "::warning::The stable ranges were not pushed to $BRANCH, so the Next sync of this release will conflict."
          fi

      - name: Push the stable ranges
        if: steps.mode.outputs.mode == 'repin'
        env:
          MESSAGE: ${{ steps.ranges.outputs.message }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git commit --quiet -m "$MESSAGE"
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
          trap 'git config --local --unset-all http.https://github.com/.extraheader || true' EXIT
          git push --quiet origin "HEAD:refs/heads/$GITHUB_REF_NAME"

      - name: Write release notes
        if: steps.mode.outputs.mode == 'stable'
        working-directory: ${{ inputs.package-directory }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DEPENDENCY_RANGES: ${{ inputs.dependency-ranges }}
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RESUME: ${{ steps.version.outputs.resume }}
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const { execFileSync } = require('node:child_process')
          const run = (command, args) => execFileSync(command, args, { encoding: 'utf8', maxBuffer: 1 << 26 })
          const git = (...args) => run('git', args)
          const holds = (...args) => {
            try {
              execFileSync('git', args, { stdio: 'ignore' })
              return true
            } catch {
              return false
            }
          }
          const readJson = (file) => (fs.existsSync(file) ? JSON.parse(fs.readFileSync(file, 'utf8')) : {})
          const { GITHUB_REPOSITORY: slug, DEFAULT_BRANCH, RELEASE_VERSION, RESUME, RUNNER_TEMP } = process.env
          const config = readJson('.release-it.json')
          const [prefix = 'v', suffix = ''] = (config.git?.tagName || 'v${version}').split('${version}')
          const tag = (version) => `${prefix}${version}${suffix}`
          const order = (left, right) => {
            const [a, b] = [left, right].map((version) => version.split('.').map(Number))
            return a[0] - b[0] || a[1] - b[1] || a[2] - b[2]
          }
          const from = git('tag', '--merged', 'HEAD').split('\n')
            .filter((name) => name.length > prefix.length + suffix.length && name.startsWith(prefix) && name.endsWith(suffix))
            .map((name) => name.slice(prefix.length, name.length - suffix.length))
            .filter((version) => /^\d+\.\d+\.\d+$/.test(version) && order(version, RELEASE_VERSION) < 0)
            .sort(order)
            .at(-1)
          const nested = git('ls-files', '-z', '--', '*/.release-it.json').split('\0').filter(Boolean)
            .map((file) => `:(exclude)${file.slice(0, -'/.release-it.json'.length)}`)
          const pulls = JSON.parse(run('gh', ['pr', 'list', '--repo', slug, '--base', DEFAULT_BRANCH, '--state', 'merged', '--limit', '100', '--json', 'number,mergeCommit,headRefOid']))
            .filter((pull) => pull.mergeCommit?.oid && holds('merge-base', '--is-ancestor', pull.mergeCommit.oid, 'HEAD') && holds('cat-file', '-e', `${pull.headRefOid}^{commit}`))
          const shipped = (pull) => from !== undefined && holds('merge-base', '--is-ancestor', pull.mergeCommit.oid, `refs/tags/${tag(from)}`)
          const current = pulls.filter((pull) => !shipped(pull))
          const exclude = [...(from === undefined ? [] : [`refs/tags/${tag(from)}`]), ...pulls.filter(shipped).map((pull) => pull.headRefOid)]
          const squashes = new Set(current.map((pull) => pull.mergeCommit.oid))
          const machinery = /^(?:(?:chore\(release\)|release): |fix\(deps\): depend on the stable )/
          const header = /^([a-z]+)(?:\(([^()]*)\))?(!)?: (\S.*)$/
          const log = (...revisions) => git('log', '--no-merges', '--format=%H%x1f%s%x1f%b%x1f%an%x1e', ...revisions, '--not', ...exclude, '--', '.', ...nested)
            .split('\x1e')
            .map((record) => record.replace(/^\n/, ''))
            .filter(Boolean)
            .map((record) => {
              const [sha, subject, body, author] = record.split('\x1f')
              return { sha, subject, body, author }
            })
            .filter((commit) => !machinery.test(commit.subject))
          const reverts = (commit, older) =>
            [...commit.body.matchAll(/^This reverts commit ([0-9a-f]{7,40})\b/gm)].some((match) => older.sha.startsWith(match[1])) ||
            [...commit.body.matchAll(/^Reverts ([\w.-]+\/[\w.-]+)#(\d+)\s*$/gm)].some((match) => match[1].toLowerCase() === slug.toLowerCase() && older.subject.endsWith(` (#${match[2]})`))
          const withoutReverts = (newestFirst) => {
            const cancelled = new Set()
            newestFirst.forEach((commit, index) => {
              if (cancelled.has(commit.sha)) return
              const targets = newestFirst.slice(index + 1).filter((older) => !cancelled.has(older.sha) && reverts(commit, older))
              if (targets.length > 0) [commit, ...targets].forEach((reverting) => cancelled.add(reverting.sha))
            })
            return newestFirst.filter((commit) => !cancelled.has(commit.sha))
          }
          const own = log('HEAD')
          const kept = withoutReverts(own)
          const cancelled = new Set(own.filter((commit) => !kept.includes(commit)).map((commit) => commit.sha))
          const tasks = new Set(current.filter((pull) => cancelled.has(pull.mergeCommit.oid)).flatMap((pull) => {
            const earlier = current
              .filter((other) => other !== pull && holds('merge-base', '--is-ancestor', other.mergeCommit.oid, pull.mergeCommit.oid))
              .map((other) => other.headRefOid)
            return git('rev-list', pull.headRefOid, '--not', 'HEAD', ...exclude, ...earlier).split('\n')
          }))
          const commits = withoutReverts(
            log('HEAD', ...current.map((pull) => pull.headRefOid)).filter((commit) => !squashes.has(commit.sha) && !cancelled.has(commit.sha) && !tasks.has(commit.sha)),
          )
          const sections = [
            ['feat', '🚀 Enhancements'], ['perf', '🔥 Performance'], ['fix', '🩹 Fixes'], ['refactor', '💅 Refactors'],
            ['docs', '📖 Documentation'], ['build', '📦 Build'], ['types', '🌊 Types'], ['revert', '⏪ Reverts'],
            ['chore', '🏡 Chore'], ['examples', '🏀 Examples'], ['test', '✅ Tests'], ['style', '🎨 Styles'], ['ci', '🤖 CI'],
          ]
          const listed = commits.toReversed().flatMap(({ sha, subject, body, author }) => {
            const match = header.exec(subject)
            if (match === null || !sections.some(([type]) => type === match[1])) return []
            let description = match[4]
            const links = []
            for (let pull = /\s*\(#(\d+)\)$/.exec(description); pull !== null; pull = /\s*\(#(\d+)\)$/.exec(description)) {
              links.unshift(`[#${pull[1]}](https://github.com/${slug}/pull/${pull[1]})`)
              description = description.slice(0, pull.index)
            }
            if (links.length === 0) links.push(`[${sha.slice(0, 7)}](https://github.com/${slug}/commit/${sha})`)
            const scope = match[2] ? `**${match[2]}:** ` : ''
            const line = `- ${scope}${description.charAt(0).toUpperCase()}${description.slice(1)} (${links.join(', ')})`
            return [{ type: match[1], breaking: match[3] === '!' || /^BREAKING[ -]CHANGE:/m.test(body), author, line }]
          })
          const names = Object.keys(JSON.parse(process.env.DEPENDENCY_RANGES || '{}'))
          const deps = names.length === 0 ? [] : [`- **deps:** Depend on the stable ${names.length === 1 ? names[0] : `${names.slice(0, -1).join(', ')} and ${names.at(-1)}`}`]
          const block = (title, lines) => (lines.length === 0 ? [] : [`${title}\n\n${lines.join('\n')}`])
          const contributors = [...new Set(listed.map((note) => note.author))].filter((author) => !author.endsWith('[bot]'))
          const releaseNotes = [
            ...(from === undefined ? [] : [`[compare changes](https://github.com/${slug}/compare/${tag(from)}...${tag(RELEASE_VERSION)})`]),
            ...sections.flatMap(([type, title]) =>
              block(`### ${title}`, [...listed.filter((note) => note.type === type).map((note) => note.line), ...(type === 'fix' ? deps : [])]),
            ),
            ...block('#### ⚠️ Breaking Changes', listed.filter((note) => note.breaking).map((note) => note.line)),
            ...block('### ❤️ Contributors', contributors.map((author) => `- ${author}`)),
          ].join('\n\n')
          const notes = `${RUNNER_TEMP}/release-notes.md`
          fs.writeFileSync(notes, releaseNotes)
          const { output } = readJson('changelogen.config.json')
          const changelog = typeof output === 'string' ? output : 'CHANGELOG.md'
          const text = fs.existsSync(changelog) ? fs.readFileSync(changelog, 'utf8') : '# Changelog\n'
          const section = `## v${RELEASE_VERSION}\n\n${releaseNotes}\n\n`
          const entry = /^###?\s/m.exec(text)
          fs.writeFileSync(changelog, entry ? text.slice(0, entry.index) + section + text.slice(entry.index) : `${text.trimEnd()}\n\n${section}`)
          git('add', '--', changelog)
          delete config.plugins?.['release-it-changelogen']
          if (config.plugins && Object.keys(config.plugins).length === 0) delete config.plugins
          config.github = { ...config.github, releaseNotes: `cat '${notes}'` }
          config.git = { ...config.git, requireCleanWorkingDir: false }
          if (config.npm !== false) {
            if (config.npm?.publish !== false && RESUME !== 'true') {
              const hooks = config.hooks ?? {}
              config.hooks = { ...hooks, 'before:npm:release': [hooks['before:npm:release'] ?? []].flat().concat(`bash '${RUNNER_TEMP}/publish.sh' latest`) }
            }
            config.npm = { ...config.npm, publish: false }
          }
          fs.writeFileSync(`${RUNNER_TEMP}/release-it.json`, `${JSON.stringify(config, null, 2)}\n`)
          NODE

      - name: Write the publish script
        if: steps.version.outputs.version != ''
        run: |
          cat > "$RUNNER_TEMP/publish.sh" <<'SCRIPT'
          set -euo pipefail
          manifest=$(mktemp "$RUNNER_TEMP/package.XXXXXX")
          cp package.json "$manifest"
          trap 'cp "$manifest" package.json' EXIT
          GIT_HEAD=$(git rev-parse HEAD) node <<'NODE'
          const fs = require('node:fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          fs.writeFileSync('package.json', `${JSON.stringify({ ...pkg, gitHead: process.env.GIT_HEAD }, null, 2)}\n`)
          NODE
          destination=$(mktemp -d "$RUNNER_TEMP/pack.XXXXXX")
          pnpm pack --pack-destination "$destination" > /dev/null
          tarball=$(find "$destination" -name '*.tgz')
          NPM_PACKAGE_ARG="$(dirname "$(readlink -f "$(command -v npm)")")/../node_modules/npm-package-arg" TARBALL=$tarball node <<'NODE'
          const { execFileSync } = require('node:child_process')
          const npa = require(process.env.NPM_PACKAGE_ARG)
          const pkg = JSON.parse(execFileSync('tar', ['-xOzf', process.env.TARBALL, 'package/package.json'], { encoding: 'utf8' }))
          const installable = new Set(['version', 'range', 'tag', 'alias', 'remote'])
          const resolvesOutside = (name, spec) => {
            try {
              return installable.has(npa.resolve(name, spec).type)
            } catch {
              return false
            }
          }
          const refused = ['dependencies', 'peerDependencies', 'optionalDependencies'].flatMap((field) =>
            Object.entries(pkg[field] ?? {}).filter(([name, spec]) => !resolvesOutside(name, spec)).map(([name, spec]) => `${field} ${name} ${spec}`),
          )
          if (refused.length) {
            console.error(`${pkg.name}@${pkg.version} would ship specs that resolve only inside its repository:\n${refused.join('\n')}`)
            process.exit(1)
          }
          NODE
          npm publish "$tarball" --tag "$1"
          SCRIPT

      - name: Publish preview
        if: steps.mode.outputs.mode == 'preview' && steps.version.outputs.version != ''
        working-directory: ${{ inputs.package-directory }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PINS: ${{ steps.version.outputs.pins }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ANTELOPE_TOKEN }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          const pins = JSON.parse(process.env.PINS || '{}')
          for (const field of ['dependencies', 'peerDependencies', 'optionalDependencies']) {
            for (const [name, spec] of Object.entries(pkg[field] ?? {})) {
              if (spec.startsWith('workspace:') && Object.hasOwn(pins, name)) pkg[field][name] = pins[name]
            }
          }
          fs.writeFileSync('package.json', `${JSON.stringify({ ...pkg, version: process.env.VERSION }, null, 2)}\n`)
          NODE
          bash "$RUNNER_TEMP/publish.sh" next

      - name: Publish stable release
        if: steps.mode.outputs.mode == 'stable'
        working-directory: ${{ inputs.package-directory }}
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ANTELOPE_TOKEN }}
        run: |
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
          trap 'git config --local --unset-all http.https://github.com/.extraheader || true' EXIT

          prerelease_tags='*.*.*-*'
          pnpm exec release-it --config "$RUNNER_TEMP/release-it.json" --ci --verbose "--git.requireBranch=$GITHUB_REF_NAME" "--git.tagExclude=$prerelease_tags" "--increment=$RELEASE_VERSION"
