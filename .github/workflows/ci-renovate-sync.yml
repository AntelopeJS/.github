name: Renovate sync

on:
  workflow_call:

jobs:
  renovate-sync:
    name: Renovate sync
    if: >-
      github.event_name == 'pull_request'
      && startsWith(github.head_ref, 'renovate/')
      && github.event.pull_request.head.repo.full_name == github.repository
    # Our runners when the CALLING repository's variable RUNNER_CI names a scale set (the private
    # repositories: antelope-ci); GitHub's when it is empty or unset, which is the case for every public
    # repository. Set RUNNER_CI per repository, never at organisation level: the runner group refuses
    # public repositories, and their jobs would wait for a runner forever.
    runs-on: ${{ vars.RUNNER_CI || 'ubuntu-latest' }}
    timeout-minutes: 360
    concurrency:
      group: ci-renovate-sync-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      GH_REPO: ${{ github.repository }}
      BASE_REF: ${{ github.base_ref }}
      HEAD_REF: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Detect a tooling-configs bump
        id: bump
        run: |
          if git diff -U0 "origin/${BASE_REF}...HEAD" -- ':(glob)**/package.json' ':(glob)**/pnpm-lock.yaml' | grep -qE '^[+-].*@antelopejs/tooling-configs'; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read the pack property
        id: pack
        if: steps.bump.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pack=$(gh api "repos/${GH_REPO}/properties/values" --jq '.[] | select(.property_name == "pack") | .value')
          echo "pack=${pack}" >> "$GITHUB_OUTPUT"

      - if: steps.bump.outputs.bumped == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - if: steps.bump.outputs.bumped == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        if: steps.bump.outputs.bumped == 'true'
        run: pnpm install --frozen-lockfile --reporter=silent

      - name: Run antelopejs-sync
        id: sync
        if: steps.bump.outputs.bumped == 'true'
        env:
          PACK: ${{ steps.pack.outputs.pack }}
        run: |
          args=()
          if [ "$PACK" = "template" ]; then
            args+=(--profile template)
          fi
          if ! out=$(pnpm exec antelopejs-sync "${args[@]}" 2>&1); then
            echo "$out"
            exit 1
          fi
          if git status --porcelain --untracked-files=all -- .github/workflows .github/actions | grep -q .; then
            {
              echo "### Renovate sync: One-tap"
              echo
              echo "\`antelopejs-sync\` changes \`.github/workflows/**\` or \`.github/actions/**\`. Nothing was pushed: a pull request touching workflow paths needs a human tap."
              echo
              echo "Changed paths:"
              echo
              git status --porcelain --untracked-files=all -- .github/workflows .github/actions | sed 's/^/- /'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::antelopejs-sync changes workflow paths; nothing pushed, this pull request stays One-tap."
            exit 1
          fi
          if ! git diff --quiet -- package.json; then
            pnpm install --lockfile-only --reporter=silent
          fi
          if git status --porcelain --untracked-files=all | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit the sync output and start checks
        id: push
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --no-verify -q -m "chore(deps): apply antelopejs-sync output"
          if ! git push --no-verify -q "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" "HEAD:refs/heads/${HEAD_REF}"; then
            echo "::error::The sync commit could not be pushed. The job that calls ci-renovate-sync.yml must grant contents: write."
            exit 1
          fi
          sha=$(git rev-parse HEAD)
          caller="${GITHUB_WORKFLOW_REF#"${GH_REPO}/"}"
          caller="${caller%%@*}"
          if ! gh workflow run "$caller" --ref "$HEAD_REF" > /dev/null; then
            echo "::error::The sync commit is pushed, but ${caller} could not be dispatched. The caller workflow must declare workflow_dispatch and the job that calls ci-renovate-sync.yml must grant actions: write."
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Report the dispatched checks on the sync commit
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.push.outputs.sha }}
        run: |
          retry() {
            for _ in 1 2 3 4 5; do
              if "$@"; then
                return 0
              fi
              sleep 10
            done
            return 1
          }
          run=""
          for _ in $(seq 1 24); do
            run=$(gh api "repos/${GH_REPO}/actions/runs?head_sha=${SHA}&event=workflow_dispatch" --jq '.workflow_runs[0].id // empty' || true)
            if [ -n "$run" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "$run" ]; then
            echo "::error::No workflow_dispatch run started on the sync commit ${SHA}."
            exit 1
          fi
          until [ "$(gh api "repos/${GH_REPO}/actions/runs/${run}" --jq '.status' || true)" = completed ]; do
            sleep 30
          done
          required=$(retry gh api "repos/${GH_REPO}/rules/branches/${BASE_REF}" --jq '[.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[] | select(.integration_id == null or .integration_id == 15368) | .context] | unique')
          retry gh api --paginate "repos/${GH_REPO}/actions/runs/${run}/jobs" --jq '.jobs[] | {name, conclusion, html_url}' > "$RUNNER_TEMP/jobs.json"
          reports=$(jq -rn --argjson required "$required" --slurpfile jobs "$RUNNER_TEMP/jobs.json" '
            $required[] as $context
            | [$jobs[] | select(.name == $context)] as $matches
            | if ($matches | length) == 1 then [$context, $matches[0].conclusion, $matches[0].html_url] else [$context, "", ""] end
            | @tsv')
          missing=0
          while IFS=$'\t' read -r context conclusion url; do
            if [ -z "$context" ]; then
              continue
            fi
            if [ -z "$url" ]; then
              echo "::error::${BASE_REF} requires ${context}, which is not a single job of the dispatched run ${run}."
              missing=1
              continue
            fi
            case "$conclusion" in
              success | failure) state=$conclusion ;;
              *) state=error ;;
            esac
            if ! retry gh api -X POST "repos/${GH_REPO}/statuses/${SHA}" -f state="$state" -f context="$context" -f target_url="$url" -f description="${conclusion} in the workflow_dispatch run" > /dev/null; then
              echo "::error::The sync commit's checks ran, but ${context} could not be reported on it. The job that calls ci-renovate-sync.yml must grant statuses: write."
              exit 1
            fi
          done <<< "$reports"
          exit "$missing"
