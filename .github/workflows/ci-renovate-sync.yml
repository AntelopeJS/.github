name: Renovate sync

on:
  workflow_call:
    secrets:
      RELEASE_APP_ID:
        description: ID of the GitHub App whose installation token pushes the sync output, workflow files included, so that the push starts the pull request's checks on the new head
        required: false
      RELEASE_APP_PRIVATE_KEY:
        description: Private key of that GitHub App
        required: false

jobs:
  renovate-sync:
    name: Renovate sync
    if: >-
      github.event_name == 'pull_request'
      && startsWith(github.head_ref, 'renovate/')
      && github.event.pull_request.head.repo.full_name == github.repository
    # Blacksmith's 4 vCPU Ubuntu 24.04 runner, unless the CALLING repository's variable RUNNER_CI names
    # another runner label: one variable switches a repository to another runner.
    runs-on: ${{ vars.RUNNER_CI || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 60
    concurrency:
      group: ci-renovate-sync-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Detect a dependency bump
        id: bump
        run: |
          status=0
          git diff --quiet "origin/${BASE_REF}...HEAD" -- ':(glob)**/package.json' ':(glob)**/pnpm-lock.yaml' || status=$?
          if [ "$status" -eq 1 ]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi

      - if: steps.bump.outputs.bumped == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - if: steps.bump.outputs.bumped == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        if: steps.bump.outputs.bumped == 'true'
        run: pnpm install --frozen-lockfile --reporter=silent

      - name: Run antelopejs-sync and the format script
        id: sync
        if: steps.bump.outputs.bumped == 'true'
        run: |
          if ! out=$(pnpm run --silent --if-present sync 2>&1); then
            echo "$out"
            exit 1
          fi
          if ! git diff --quiet -- package.json; then
            pnpm install --lockfile-only --reporter=silent
          fi
          git add -A
          if ! out=$(pnpm run --silent --if-present format 2>&1); then
            echo "$out"
            exit 1
          fi
          unsafe=$(git ls-files --others --exclude-standard)
          unsafe+=$'\n'$(git diff --summary | sed -n 's/^ mode change [0-7]* => [0-7]* //p')
          git diff -z --name-only > "$RUNNER_TEMP/formatted"
          while IFS= read -r -d '' path; do
            if [ ! -f "$path" ] || ! cmp -s <(git show ":$path" | tr -d '[:space:]') <(tr -d '[:space:]' < "$path"); then
              unsafe+=$'\n'"$path"
            fi
          done < "$RUNNER_TEMP/formatted"
          if [ -n "${unsafe//$'\n'/}" ]; then
            {
              echo "### Renovate sync: format script changes more than layout"
              echo
              echo "The \`format\` script changes more than whitespace and line breaks. Nothing was pushed: a lint fix or a rewrite needs a human commit."
              echo
              echo "Changed paths:"
              echo
              grep . <<< "$unsafe" | sed 's/^/- /'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::The format script changes more than whitespace; nothing pushed."
            exit 1
          fi
          git add -A
          if ! git diff --cached --quiet; then
            git diff --cached --binary > "$RUNNER_TEMP/renovate-sync.patch"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.sync.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renovate-sync-patch
          path: ${{ runner.temp }}/renovate-sync.patch
          retention-days: 1
          if-no-files-found: error

  push:
    name: Push the Renovate sync
    needs: renovate-sync
    if: needs.renovate-sync.outputs.changed == 'true'
    runs-on: ${{ vars.RUNNER_CI || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 360
    concurrency:
      group: ci-renovate-sync-push-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      GH_REPO: ${{ github.repository }}
      BASE_REF: ${{ github.base_ref }}
      HEAD_REF: ${{ github.head_ref }}
      AUTHOR: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - name: Pick the push credentials
        id: credentials
        env:
          RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$RELEASE_APP_ID" ] && [ -n "$RELEASE_APP_PRIVATE_KEY" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$RELEASE_APP_ID" ] || [ -n "$RELEASE_APP_PRIVATE_KEY" ]; then
            echo "::error::RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY are passed together or not at all."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: renovate-sync-patch
          path: ${{ runner.temp }}/renovate-sync

      - name: Apply the sync output
        env:
          APP_TOKEN: ${{ steps.credentials.outputs.app }}
          PATCH: ${{ runner.temp }}/renovate-sync/renovate-sync.patch
        run: |
          git apply --index -- "$PATCH"
          workflows=$(git diff --cached --name-only -- .github/workflows .github/actions)
          if [ -z "$workflows" ]; then
            exit 0
          fi
          if [ "$APP_TOKEN" != true ]; then
            {
              echo "### Renovate sync: One-tap"
              echo
              echo "\`antelopejs-sync\` or the \`format\` script changes \`.github/workflows/**\` or \`.github/actions/**\`. Nothing was pushed: GITHUB_TOKEN cannot push workflow files, so this needs a human tap, or the job that calls ci-renovate-sync.yml passes RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY."
              echo
              echo "Changed paths:"
              echo
              sed 's/^/- /' <<< "$workflows"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::The sync output changes workflow paths; nothing pushed, this pull request stays One-tap."
            exit 1
          fi
          if ! git diff -U0 "origin/${BASE_REF}...HEAD" -- ':(glob)**/package.json' | grep -Eq '^\+[[:space:]]*"@antelopejs/tooling-configs"[[:space:]]*:'; then
            while IFS= read -r file; do
              echo "::error::The sync output changes ${file}, and only a bump of @antelopejs/tooling-configs may change workflow paths; nothing pushed."
            done <<< "$workflows"
            exit 1
          fi

      - name: Create the push token
        id: token
        if: steps.credentials.outputs.app == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write

      - name: Commit the sync output and push it with the app token
        if: steps.credentials.outputs.app == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          GIT_AUTHOR_NAME="github-actions[bot]" GIT_AUTHOR_EMAIL="$AUTHOR" GIT_COMMITTER_NAME="github-actions[bot]" GIT_COMMITTER_EMAIL="$AUTHOR" \
            git -c core.hooksPath=/dev/null commit --no-verify -q -m "chore(deps): apply the antelopejs-sync and format output"
          git -c core.hooksPath=/dev/null push --no-verify -q "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" "HEAD:refs/heads/${HEAD_REF}"

      - name: Commit the sync output and start checks
        id: push
        if: steps.credentials.outputs.app != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          GIT_AUTHOR_NAME="github-actions[bot]" GIT_AUTHOR_EMAIL="$AUTHOR" GIT_COMMITTER_NAME="github-actions[bot]" GIT_COMMITTER_EMAIL="$AUTHOR" \
            git -c core.hooksPath=/dev/null commit --no-verify -q -m "chore(deps): apply the antelopejs-sync and format output"
          if ! git push --no-verify -q "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" "HEAD:refs/heads/${HEAD_REF}"; then
            echo "::error::The sync commit could not be pushed. The job that calls ci-renovate-sync.yml must grant contents: write."
            exit 1
          fi
          sha=$(git rev-parse HEAD)
          caller="${GITHUB_WORKFLOW_REF#"${GH_REPO}/"}"
          caller="${caller%%@*}"
          if ! gh workflow run "$caller" --ref "$HEAD_REF" > /dev/null; then
            echo "::error::The sync commit is pushed, but ${caller} could not be dispatched. The caller workflow must declare workflow_dispatch and the job that calls ci-renovate-sync.yml must grant actions: write."
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Report the dispatched checks on the sync commit
        if: steps.credentials.outputs.app != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.push.outputs.sha }}
        run: |
          retry() {
            for _ in 1 2 3 4 5; do
              if "$@"; then
                return 0
              fi
              sleep 10
            done
            return 1
          }
          run=""
          for _ in $(seq 1 24); do
            run=$(gh api "repos/${GH_REPO}/actions/runs?head_sha=${SHA}&event=workflow_dispatch" --jq '.workflow_runs[0].id // empty' || true)
            if [ -n "$run" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "$run" ]; then
            echo "::error::No workflow_dispatch run started on the sync commit ${SHA}."
            exit 1
          fi
          until [ "$(gh api "repos/${GH_REPO}/actions/runs/${run}" --jq '.status' || true)" = completed ]; do
            sleep 30
          done
          required=$(retry gh api "repos/${GH_REPO}/rules/branches/${BASE_REF}" --jq '[.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[] | select(.integration_id == null or .integration_id == 15368) | .context] | unique')
          retry gh api --paginate "repos/${GH_REPO}/actions/runs/${run}/jobs" --jq '.jobs[] | {name, conclusion, html_url}' > "$RUNNER_TEMP/jobs.json"
          reports=$(jq -rn --argjson required "$required" --slurpfile jobs "$RUNNER_TEMP/jobs.json" '
            $required[] as $context
            | [$jobs[] | select(.name == $context)] as $matches
            | if ($matches | length) == 1 then [$context, $matches[0].conclusion, $matches[0].html_url] else [$context, "", ""] end
            | @tsv')
          missing=0
          while IFS=$'\t' read -r context conclusion url; do
            if [ -z "$context" ]; then
              continue
            fi
            if [ -z "$url" ]; then
              echo "::error::${BASE_REF} requires ${context}, which is not a single job of the dispatched run ${run}."
              missing=1
              continue
            fi
            case "$conclusion" in
              success | failure) state=$conclusion ;;
              *) state=error ;;
            esac
            if ! retry gh api -X POST "repos/${GH_REPO}/statuses/${SHA}" -f state="$state" -f context="$context" -f target_url="$url" -f description="${conclusion} in the workflow_dispatch run" > /dev/null; then
              echo "::error::The sync commit's checks ran, but ${context} could not be reported on it. The job that calls ci-renovate-sync.yml must grant statuses: write."
              exit 1
            fi
          done <<< "$reports"
          exit "$missing"
