name: Bot branch cleanup

on:
  workflow_call:

jobs:
  cleanup:
    name: Delete the head branch of a bot pull request closed unmerged
    if: >-
      github.event_name == 'pull_request'
      && github.event.action == 'closed'
      && !github.event.pull_request.merged
      && github.event.pull_request.user.type == 'Bot'
      && github.event.pull_request.head.repo.full_name == github.repository
    # Blacksmith's 4 vCPU Ubuntu 24.04 runner, unless the CALLING repository's variable RUNNER_CI names
    # another runner label: one variable switches a repository to another runner.
    runs-on: ${{ vars.RUNNER_CI || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: bot-branch-cleanup-${{ github.event.pull_request.head.ref }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NUMBER: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE: ${{ github.event.pull_request.base.ref }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Delete the branch when it still points at the closed pull request
        run: |
          left() {
            echo "::notice::${1}"
            echo "${1}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          case "$BRANCH" in
            "" | -* | /* | *[!A-Za-z0-9._/@+-]*) left "Left the head of #${NUMBER} alone: its name holds a character this workflow does not pass to the API." ;;
          esac
          if [ "$BRANCH" = "$DEFAULT_BRANCH" ] || [ "$BRANCH" = "$BASE" ]; then
            left "Left ${BRANCH} alone: it is the default branch or the base of #${NUMBER}."
          fi
          sha=$(gh api "repos/${GH_REPO}/git/matching-refs/heads/${BRANCH}" --jq "map(select(.ref == \"refs/heads/${BRANCH}\")) | .[0].object.sha // empty")
          if [ -z "$sha" ]; then
            left "${BRANCH}, the head of #${NUMBER}, is already gone."
          fi
          if [ "$sha" != "$HEAD_SHA" ]; then
            left "Left ${BRANCH} alone: it moved to ${sha} since #${NUMBER} closed at ${HEAD_SHA}."
          fi
          protected=$(gh api "repos/${GH_REPO}/branches/${BRANCH}" --jq '.protected' || echo unknown)
          if [ "$protected" != false ]; then
            left "Left ${BRANCH} alone: it is protected, or its protection could not be read."
          fi
          rules=$(gh api "repos/${GH_REPO}/rules/branches/${BRANCH}" --jq 'map(select(.type == "deletion")) | length' || echo unknown)
          if [ "$rules" != 0 ]; then
            left "Left ${BRANCH} alone: a ruleset forbids its deletion, or the rules could not be read."
          fi
          open=$(gh api "repos/${GH_REPO}/pulls?state=open&head=${GH_REPO%%/*}:${BRANCH}" --jq 'length' || echo unknown)
          if [ "$open" != 0 ]; then
            left "Left ${BRANCH} alone: another pull request is open from it, or the open pull requests could not be read."
          fi
          if ! gh api -X DELETE "repos/${GH_REPO}/git/refs/heads/${BRANCH}" > /dev/null; then
            echo "::error::${BRANCH}, the head of #${NUMBER}, could not be deleted. The job that calls bot-branch-cleanup.yml must grant contents: write."
            exit 1
          fi
          echo "Deleted ${BRANCH}, the head of #${NUMBER}, closed unmerged." >> "$GITHUB_STEP_SUMMARY"
