name: Probe extra-commands-shards

on:
  pull_request:

permissions:
  contents: read

jobs:
  sharded:
    uses: ./.github/workflows/ci-node.yml
    with:
      windows: false
      extra-commands: echo "shard=${ANTELOPEJS_CI_SHARD-unset}"
      extra-commands-job: true
      extra-commands-shards: 3
