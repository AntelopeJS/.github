name: Renovate sweep

on:
  schedule:
    - cron: "29 * * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: List the moves without making them
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  sweep:
    name: Re-arm dropped and rebase stale-red Renovate pull requests
    runs-on: ${{ vars.RUNNER_CI || 'blacksmith-4vcpu-ubuntu-2404' }}
    permissions:
      contents: read
    timeout-minutes: 15
    concurrency:
      group: renovate-sweep
      cancel-in-progress: false
    env:
      DRY_RUN: ${{ inputs.dry-run == true }}
    steps:
      - name: Create the sweep token
        id: token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-checks: read
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Sweep the open Renovate pull requests
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ORG: ${{ github.repository_owner }}
        run: |
          args=("$ORG")
          if [ "$DRY_RUN" = true ]; then
            args+=(--dry-run)
          fi
          status=0
          node scripts/module-locks/renovate-sweep-main.ts "${args[@]}" > "$RUNNER_TEMP/sweep.md" || status=$?
          {
            if [ "$DRY_RUN" = true ]; then
              echo "## Renovate sweep (dry run: nothing changed)"
            else
              echo "## Renovate sweep"
            fi
            echo
            if [ "$status" -ne 0 ]; then
              echo "The sweep failed; the log names the cause."
              echo
            fi
            if [ -s "$RUNNER_TEMP/sweep.md" ]; then
              cat "$RUNNER_TEMP/sweep.md"
            elif [ "$status" -eq 0 ]; then
              echo "No Renovate pull request to re-arm or rebase."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '^::(error|warning)::' "$RUNNER_TEMP/sweep.md" || true
          exit "$status"
