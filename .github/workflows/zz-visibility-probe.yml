name: Visibility probe

on:
  pull_request:
  push:
    branches: [ci/wbbb30833-201-runner-by-visibility]

permissions: {}

jobs:
  direct:
    name: "probe ${{ github.event_name }} visibility=${{ github.event.repository.visibility || 'absent' }}"
    runs-on: ${{ vars.RUNNER_CI || (github.event.repository.visibility == 'public' && 'ubuntu-latest' || 'blacksmith-4vcpu-ubuntu-2404') }}
    timeout-minutes: 2
    steps:
      - run: echo "$VISIBILITY"
        env:
          VISIBILITY: ${{ github.event.repository.visibility }}
  called:
    uses: ./.github/workflows/zz-visibility-probe-called.yml
