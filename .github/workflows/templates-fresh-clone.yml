name: Templates from a fresh clone

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: templates-fresh-clone-${{ github.ref }}
  cancel-in-progress: false

jobs:
  templates:
    name: Templates
    runs-on: ${{ vars.RUNNER_CI || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      templates: ${{ steps.templates.outputs.templates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Match the table with the templates ajs project init offers
        id: templates
        run: |
          manifest=$(curl -fsSL https://raw.githubusercontent.com/AntelopeJS/interfaces/main/manifest.json)
          offered=$(jq -c '[.templates[], .projectTemplates[] | .name] | sort' <<< "$manifest")
          table=$(jq -c '[.[].name] | sort' .github/templates-fresh-clone/templates.json)
          if [ "$offered" != "$table" ]; then
            echo "::error::.github/templates-fresh-clone/templates.json must list the templates of the AntelopeJS/interfaces manifest. Missing: $(jq -nc --argjson a "$offered" --argjson b "$table" '$a - $b'). Not offered: $(jq -nc --argjson a "$offered" --argjson b "$table" '$b - $a')."
            exit 1
          fi
          echo "templates=$(jq -c . .github/templates-fresh-clone/templates.json)" >> "$GITHUB_OUTPUT"

  start:
    name: ${{ matrix.template.name }}
    needs: templates
    runs-on: ${{ vars.RUNNER_CI || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJSON(needs.templates.outputs.templates) }}
    services:
      mongo:
        image: mongo:9
        ports:
          - 27017:27017
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Create the project with the latest ajs
        env:
          INIT: ${{ matrix.template.init }}
          TEMPLATE: ${{ matrix.template.name }}
        run: |
          corepack enable
          cd "$RUNNER_TEMP"
          npx -y @antelopejs/core@latest "$INIT" init app --template "$TEMPLATE" --pm pnpm --no-git-init --yes

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ runner.temp }}/app/.nvmrc

      - name: Start it until it is ready
        env:
          START: ${{ matrix.template.start }}
          READY: ${{ matrix.template.ready }}
          START_TIMEOUT_SECONDS: "1500"
        run: |
          corepack enable
          .github/templates-fresh-clone/start.sh "$RUNNER_TEMP/app" "$START" "$READY"
