name: Verdict conformance

on:
  schedule:
    - cron: "11 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/ci-verdict/**
      - .github/workflows/verdict-conformance.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conformance:
    runs-on: ${{ vars.RUNNER_CI || 'blacksmith-4vcpu-ubuntu-2404' }}
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Create the read token
        id: token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.23.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Install the YAML parser
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: List the repositories whose merge queue does not wait on the verdict alone
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ORG: ${{ github.repository_owner }}
        run: |
          status=0
          node scripts/ci-verdict/main.ts "$ORG" > "$RUNNER_TEMP/conformance.md" || status=$?
          if [ -s "$RUNNER_TEMP/conformance.md" ]; then
            {
              echo "## Repositories whose merge queue does not wait on the verdict alone"
              echo
              cat "$RUNNER_TEMP/conformance.md"
            } >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/conformance.md"
            echo "::error::$(grep -c '^- ' "$RUNNER_TEMP/conformance.md") repositories do not wait on their verdict alone; the job summary lists them."
          fi
          exit "$status"
