name: Verdict conformance

on:
  schedule:
    - cron: "11 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/ci-verdict/**
      - .github/workflows/verdict-conformance.yml

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Create the read token
        id: token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26

      - name: Install the YAML parser
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: List the repositories whose merge queue does not wait on the verdict alone
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ORG: ${{ github.repository_owner }}
        run: |
          status=0
          node scripts/ci-verdict/main.ts "$ORG" > "$RUNNER_TEMP/conformance.md" || status=$?
          if [ -s "$RUNNER_TEMP/conformance.md" ]; then
            {
              echo "## Repositories whose merge queue does not wait on the verdict alone"
              echo
              cat "$RUNNER_TEMP/conformance.md"
            } >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/conformance.md"
            echo "::error::$(grep -c '^- ' "$RUNNER_TEMP/conformance.md") repositories do not wait on their verdict alone; the job summary lists them."
          fi
          exit "$status"
