name: wbbb-env-probe
on: pull_request
jobs:
  probe:
    strategy:
      matrix:
        runner: [blacksmith-4vcpu-ubuntu-2404, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - run: |
          echo "RUNNER ${{ matrix.runner }}"
          env | grep -E '^(LANG|LC_|LANGUAGE|TERM|CI|NO_COLOR|FORCE_COLOR|COLORTERM|TZ|LS_COLORS)' | sort
          locale -a | head -20
          locale
