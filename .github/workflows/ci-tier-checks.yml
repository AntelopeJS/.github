name: CI tier checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    # Our runners when the CALLING repository's variable RUNNER_CI names a scale set (the private
    # repositories: antelope-ci); GitHub's when it is empty or unset, which is the case for every public
    # repository. Set RUNNER_CI per repository, never at organisation level: the runner group refuses
    # public repositories, and their jobs would wait for a runner forever.
    runs-on: ${{ vars.RUNNER_CI || 'ubuntu-latest' }}
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26

      - name: Install the type checker and pnpm
        run: npm install --no-save --no-audit --no-fund --silent --prefix "$RUNNER_TEMP/tools" typescript@5.9.3 @types/node@24.10.1 pnpm@10.20.0

      - name: Typecheck
        run: |
          "$RUNNER_TEMP/tools/node_modules/.bin/tsc" -p scripts/ci-tier/tsconfig.json --typeRoots "$RUNNER_TEMP/tools/node_modules/@types"

      - name: Test
        env:
          PNPM: ${{ runner.temp }}/tools/node_modules/.bin/pnpm
        run: node --test 'scripts/ci-tier/*.test.ts'

      - name: Lint the Node CI workflow
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --quiet
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -ignore SC2016 .github/workflows/ci-node.yml .github/workflows/ci-tier-checks.yml
