name: Module locks of a Renovate pull request

on:
  workflow_call:
    secrets:
      RELEASE_APP_ID:
        description: ID of the GitHub App whose installation token pushes the locks to the Renovate branch, so that the pull request's checks run again on the new head
        required: true
      RELEASE_APP_PRIVATE_KEY:
        description: Private key of that GitHub App
        required: true

jobs:
  module-locks:
    name: Commit the module locks
    if: >-
      github.event_name == 'pull_request'
      && startsWith(github.head_ref, 'renovate/')
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.RUNNER_CI || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    concurrency:
      group: module-locks-renovate-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    defaults:
      run:
        shell: bash
    env:
      GH_REPO: ${{ github.repository }}
      BASE_REF: ${{ github.base_ref }}
      HEAD_REF: ${{ github.head_ref }}
    steps:
      - name: Find the module locks the checks recorded
        id: recorded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          names=$(gh api --paginate "repos/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[].name')
          if grep -q '^module-locks-' <<< "$names"; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.recorded.outputs.found == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.recorded.outputs.found == 'true'
        with:
          pattern: module-locks-*
          merge-multiple: true
          path: .

      - name: Delete the locks of the versions the bump replaces
        if: steps.recorded.outputs.found == 'true'
        run: |
          work="$RUNNER_TEMP/module-locks-renovate"
          mkdir -p "$work"
          git diff -U0 "origin/${BASE_REF}...HEAD" -- . ':(exclude,glob)**/antelope-lock/**' ':(exclude,glob)**/pnpm-lock.yaml' > "$work/diff"
          sed -n '/^---/d; s/^-//p' "$work/diff" > "$work/removed"
          sed -n '/^+++/d; s/^+//p' "$work/diff" > "$work/added"
          mentions() {
            awk -v version="$2" '
              function edge(char) { return char == "" || char !~ /[0-9A-Za-z.+-]/ }
              {
                line = $0
                offset = 0
                while ((at = index(substr(line, offset + 1), version)) > 0) {
                  start = offset + at
                  if (edge(substr(line, start - 1, 1)) && edge(substr(line, start + length(version), 1))) { found = 1; exit }
                  offset = start
                }
              }
              END { exit !found }' "$1"
          }
          git ls-files -z --others --exclude-standard -- ':(glob)**/antelope-lock/**' | xargs -0 -r -n1 dirname | sort -u > "$work/recorded"
          while IFS= read -r lock; do
            name="${lock%@*}"
            while IFS= read -r committed; do
              version="${committed##*@}"
              if [ "$committed" != "$lock" ] && [ "${committed%@*}" = "$name" ] && mentions "$work/removed" "$version" && ! mentions "$work/added" "$version"; then
                git rm -rq -- "$committed"
                echo "Deleted ${committed}: the bump replaces ${version}."
              fi
            done < <(git ls-tree -d --name-only HEAD -- "$(dirname "$lock")/")
          done < "$work/recorded"

      - name: Create the push token
        id: token
        if: steps.recorded.outputs.found == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Commit the locks to the Renovate branch
        if: steps.recorded.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          git add -A -- ':(glob)**/antelope-lock/**'
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --no-verify -q -m "build(deps): record the module locks of the bumped modules"
          git push --no-verify -q "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" "HEAD:refs/heads/${HEAD_REF}"
