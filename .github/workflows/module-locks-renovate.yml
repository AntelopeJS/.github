name: Module locks of a Renovate pull request

on:
  workflow_call:
    secrets:
      RELEASE_APP_ID:
        description: ID of the GitHub App whose installation token pushes the locks to the Renovate branch, so that the pull request's checks run again on the new head
        required: true
      RELEASE_APP_PRIVATE_KEY:
        description: Private key of that GitHub App
        required: true

jobs:
  module-locks:
    name: Commit the module locks
    if: >-
      github.event_name == 'pull_request'
      && startsWith(github.head_ref, 'renovate/')
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.RUNNER_CI || (github.event.repository.visibility == 'public' && 'ubuntu-latest' || 'blacksmith-4vcpu-ubuntu-2404') }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    concurrency:
      group: module-locks-renovate-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    defaults:
      run:
        shell: bash
    env:
      GH_REPO: ${{ github.repository }}
      BASE_REF: ${{ github.base_ref }}
      HEAD_REF: ${{ github.head_ref }}
    steps:
      - name: Find the module locks the checks recorded
        id: recorded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          names=$(gh api --paginate "repos/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[].name')
          if grep -q '^module-locks-' <<< "$names"; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.recorded.outputs.found == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.recorded.outputs.found == 'true'
        with:
          pattern: module-locks-*
          merge-multiple: true
          path: ${{ runner.temp }}/module-locks-artifacts

      - name: Copy the recorded locks into the checkout
        if: steps.recorded.outputs.found == 'true'
        run: |
          artifacts="$RUNNER_TEMP/module-locks-artifacts"
          lock='^([^/]+/)*antelope-lock/(@[^/]+/)?[^/@]+@[^/]+/[^./][^/]*$'
          while IFS= read -r -d '' file; do
            path="${file#"$artifacts"/}"
            if [ -L "$file" ] || [ ! -f "$file" ] || [[ ! "$path" =~ $lock ]] || [[ "/${path}/" == */.git/* ]] || [[ "/${path}/" == */../* ]]; then
              printf '::error::The module-locks artifacts hold %q, which is not a module lock file. Nothing was committed.\n' "$path"
              exit 1
            fi
            mkdir -p -- "$(dirname -- "$path")"
            cp -- "$file" "$path"
            chmod 644 -- "$path"
          done < <(find "$artifacts" -mindepth 1 ! -type d -print0)

      - name: Delete the locks of the versions the bump replaces
        if: steps.recorded.outputs.found == 'true'
        run: |
          work="$RUNNER_TEMP/module-locks-renovate"
          mkdir -p "$work"
          git diff -U0 "origin/${BASE_REF}...HEAD" -- . ':(exclude,glob)**/antelope-lock/**' ':(exclude,glob)**/pnpm-lock.yaml' > "$work/diff"
          sed -n '/^--- \(a\/\|\/dev\/null$\)/d; s/^-//p' "$work/diff" > "$work/removed"
          sed -n '/^+++ \(b\/\|\/dev\/null$\)/d; s/^+//p' "$work/diff" > "$work/added"
          mentions() {
            awk -v version="$2" '
              function edge(char) { return char == "" || char !~ /[0-9A-Za-z.+-]/ }
              {
                line = $0
                offset = 0
                while ((at = index(substr(line, offset + 1), version)) > 0) {
                  start = offset + at
                  if (edge(substr(line, start - 1, 1)) && edge(substr(line, start + length(version), 1))) { found = 1; exit }
                  offset = start
                }
              }
              END { exit !found }' "$1"
          }
          git ls-files -z --others --exclude-standard -- ':(glob)**/antelope-lock/**' | xargs -0 -r -n1 dirname -- | sort -u > "$work/recorded"
          while IFS= read -r lock; do
            name="${lock%@*}"
            while IFS= read -r committed; do
              version="${committed##*@}"
              if [ "$committed" != "$lock" ] && [ "${committed%@*}" = "$name" ] && mentions "$work/removed" "$version" && ! mentions "$work/added" "$version"; then
                git rm -rq -- "$committed"
                echo "Deleted ${committed}: the bump replaces ${version}."
              fi
            done < <(git ls-tree -d --name-only HEAD -- "$(dirname -- "$lock")/")
          done < "$work/recorded"

      - name: Find whether every other job of the run passed
        id: run
        if: steps.recorded.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          others=$(gh api --paginate "repos/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}/jobs" --jq '
            def lock: IN("Check that the module locks are committed", "Run AntelopeJS/.github/.github/actions/module-locks-committed@v2");
            def aggregator: split(" / ") | last | IN("checks", "verdict", "ubuntu");
            .jobs[]
            | select(.runner_name != env.RUNNER_NAME and (.name | aggregator | not))
            | select(.status != "completed" or (.conclusion | IN("success", "skipped", "neutral") | not))
            | select((.conclusion == "failure" and ([.steps[] | select(.conclusion == "failure") | .name] | length > 0 and all(lock))) | not)
            | "\(.name): \(.conclusion // .status)"')
          if [ -n "$others" ]; then
            printf '%s\n' "$others"
            echo "::notice::The jobs above failed for another reason than the module locks, or still run, so the checks run again in full on the lock commit."
            exit 0
          fi
          echo "passed=true" >> "$GITHUB_OUTPUT"

      - name: Commit the locks
        id: commit
        if: steps.recorded.outputs.found == 'true'
        env:
          AUTHOR: 41898282+github-actions[bot]@users.noreply.github.com
          MESSAGE: "build(deps): record the module locks of the bumped modules"
          PASSED: "${{ steps.run.outputs.passed == 'true' && format('Checks-Passed: {0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) || '' }}"
        run: |
          git add -A -- ':(glob)**/antelope-lock/**'
          if git diff --cached --quiet; then
            exit 0
          fi
          commits=$(git log --format='%ae%x09%s' "origin/${BASE_REF}..HEAD" | grep -cxF "${AUTHOR}"$'\t'"${MESSAGE}" || true)
          if [ "$commits" -ge 2 ]; then
            git diff --cached --stat
            echo "::error::The checks recorded module locks again after ${commits} lock commits on this branch. Nothing was pushed: record and commit these locks by hand."
            exit 1
          fi
          GIT_AUTHOR_NAME="github-actions[bot]" GIT_AUTHOR_EMAIL="$AUTHOR" GIT_COMMITTER_NAME="github-actions[bot]" GIT_COMMITTER_EMAIL="$AUTHOR" \
            git -c core.hooksPath=/dev/null commit --no-verify -q -m "$MESSAGE" ${PASSED:+-m "$PASSED"}
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Create the push token
        id: token
        if: steps.commit.outputs.committed == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Push the locks to the Renovate branch
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: git -c core.hooksPath=/dev/null push --no-verify -q "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" "HEAD:refs/heads/${HEAD_REF}"
