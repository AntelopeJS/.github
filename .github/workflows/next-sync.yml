name: Next sync

on:
  workflow_call:
    inputs:
      branch:
        description: Integration branch that receives the default branch
        default: next
        type: string
    secrets:
      RELEASE_APP_ID:
        description: ID of the GitHub App whose installation token pushes the merge, which the branch's ruleset lets push
        required: false
      RELEASE_APP_PRIVATE_KEY:
        description: Private key of that GitHub App
        required: false
      NOTION_TOKEN:
        description: Unused, kept so that callers which still pass it are accepted
        required: false

permissions: {}

jobs:
  sync:
    name: Merge the default branch into ${{ inputs.branch }}
    # Our runners when the CALLING repository's variable RUNNER_CI names a scale set (the private
    # repositories: antelope-ci); GitHub's when it is empty or unset, which is the case for every public
    # repository. Set RUNNER_CI per repository, never at organisation level: the runner group refuses
    # public repositories, and their jobs would wait for a runner forever.
    runs-on: ${{ vars.RUNNER_CI || 'ubuntu-latest' }}
    timeout-minutes: 10
    concurrency:
      group: next-sync-${{ github.repository }}-${{ inputs.branch }}
      cancel-in-progress: false
    permissions:
      issues: write
    defaults:
      run:
        shell: bash
    env:
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ inputs.branch }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Pick the push credentials
        id: credentials
        env:
          RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$RELEASE_APP_ID" ] && [ -n "$RELEASE_APP_PRIVATE_KEY" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY are not configured."
            exit 1
          fi

      - name: Create the push token
        id: token
        if: steps.credentials.outputs.app == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - name: Merge
        id: merge
        env:
          TOKEN: ${{ steps.token.outputs.token }}
        run: |
          git init -q
          git remote add origin "https://github.com/${GH_REPO}.git"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}" "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
            git checkout -q -B "$BRANCH" "origin/${BRANCH}"
            if git merge-base --is-ancestor "origin/${DEFAULT_BRANCH}" HEAD; then
              exit 0
            fi
            if ! git merge -q --no-ff --no-edit -m "chore: merge ${DEFAULT_BRANCH} into ${BRANCH}" "origin/${DEFAULT_BRANCH}"; then
              conflicts=$(git diff --name-only --diff-filter=U)
              if [ -n "$conflicts" ]; then
                count=$(wc -l <<< "$conflicts")
                files=$(head -n 20 <<< "$conflicts" | paste -sd ',' | sed 's/,/, /g' | cut -c1-1500)
                [ "$count" -le 20 ] || files="${files} and $((count - 20)) more"
                echo "files=${files}" >> "$GITHUB_OUTPUT"
                echo "- Next sync conflict: \`${DEFAULT_BRANCH}\` conflicts with \`${BRANCH}\` in ${files}." >> "$GITHUB_STEP_SUMMARY"
                echo "::error title=Next sync conflict::${DEFAULT_BRANCH} conflicts with ${BRANCH} in ${files}. Merge ${DEFAULT_BRANCH} into ${BRANCH}, resolve the conflicts, and push the merge commit straight to ${BRANCH} with a repository admin's account."
              fi
              exit 1
            fi
            if git push -q origin "HEAD:refs/heads/${BRANCH}"; then
              exit 0
            fi
            [ "$attempt" = 3 ] || sleep 5
          done
          echo "::error::The merge was not pushed to ${BRANCH} after 3 attempts. Either ${BRANCH} moved each time, or the release GitHub App is not a bypass actor of its ruleset."
          exit 1

      - name: Open or update the conflict issue
        if: failure() && steps.merge.outputs.files != ''
        env:
          GH_TOKEN: ${{ github.token }}
          FILES: ${{ steps.merge.outputs.files }}
        run: |
          title="Next sync: merge ${DEFAULT_BRANCH} into ${BRANCH} by hand"
          number=$(gh api --paginate "repos/${GH_REPO}/issues?state=open&creator=github-actions%5Bbot%5D&per_page=100" \
            | jq -s -r --arg title "$title" '[.[][] | select(.title == $title and .user.login == "github-actions[bot]" and (.pull_request | not)) | .number][0] // empty')
          if [ -n "$number" ]; then
            gh api -X POST "repos/${GH_REPO}/issues/${number}/comments" --silent \
              -f "body=Seen again: \`${FILES}\`. Run: ${RUN_URL}"
            exit 0
          fi
          body=$(printf '%s\n\n%s\n\n%s\n' \
            "The Next sync workflow could not merge \`${DEFAULT_BRANCH}\` into \`${BRANCH}\`: they conflict in \`${FILES}\`. Until \`${DEFAULT_BRANCH}\` is merged, the \`${BRANCH}\` to \`${DEFAULT_BRANCH}\` pull request cannot be up to date. Run: ${RUN_URL}" \
            "To resolve it, a repository admin merges \`origin/${DEFAULT_BRANCH}\` into \`${BRANCH}\`, resolves the conflicts, and pushes the merge commit straight to \`${BRANCH}\`. A pull request would squash the merge and lose \`${DEFAULT_BRANCH}\`'s history, so the same conflict would come back." \
            "The next successful sync closes this issue.")
          gh api -X POST "repos/${GH_REPO}/issues" --silent -f "title=${title}" -f "body=${body}"

      - name: Close the conflict issue
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Next sync: merge ${DEFAULT_BRANCH} into ${BRANCH} by hand"
          gh api --paginate "repos/${GH_REPO}/issues?state=open&creator=github-actions%5Bbot%5D&per_page=100" \
            | jq -s -r --arg title "$title" '.[][] | select(.title == $title and .user.login == "github-actions[bot]" and (.pull_request | not)) | .number' \
            | while read -r number; do
                gh api -X POST "repos/${GH_REPO}/issues/${number}/comments" --silent -f "body=${DEFAULT_BRANCH} is merged into ${BRANCH}. Run: ${RUN_URL}"
                gh api -X PATCH "repos/${GH_REPO}/issues/${number}" --silent -f state=closed -f state_reason=completed
              done
