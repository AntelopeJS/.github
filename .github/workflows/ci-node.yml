name: Node CI

on:
  workflow_call:
    inputs:
      node-versions:
        description: JSON array of Node.js versions; empty uses .nvmrc
        default: ""
        type: string
      docs-files:
        description: Newline-separated documentation files to check
        default: ""
        type: string
      docs-typescript-project:
        description: TypeScript project used by the documentation check
        default: ""
        type: string
      services-compose-file:
        description: Path to a docker compose file whose services must run during checks
        default: ""
        type: string
      cache-paths:
        description: Newline-separated paths to cache between runs; empty skips the cache step
        default: ""
        type: string
      cache-key-files:
        description: Newline-separated globs hashed into the cache key
        default: pnpm-lock.yaml
        type: string
      setup-commands:
        description: Multiline shell commands to run after the root pnpm install, before checks, tests and extra-commands
        default: ""
        type: string
      extra-commands:
        description: Multiline shell commands to run after checks
        default: ""
        type: string
      skill-eval-offline:
        description: Run the offline skill evals when the package's skills change
        default: true
        type: boolean
      skill-eval-ref:
        description: Ref of AntelopeJS/agent-skills that supplies the skill evals
        default: main
        type: string
      renovate-sync:
        description: Run the Renovate sync inside this workflow; callers that call ci-renovate-sync.yml from their own job pass false
        default: true
        type: boolean
      test-job:
        description: Run the test step in its own job, in parallel with the other checks
        default: false
        type: boolean
      extra-commands-job:
        description: Run extra-commands in their own job, in parallel with the other checks
        default: false
        type: boolean
      windows:
        description: Also run the node, test and extra jobs on windows-latest, in parallel with ubuntu-latest. Run steps and package scripts use Git Bash there, git checks out with core.autocrlf false and core.symlinks true, and the docker compose services, pull request title check, documentation check and skill evals are skipped, so tests that need the services must not run on Windows
        default: false
        type: boolean

jobs:
  node:
    name: Node ${{ matrix.node-version || '.nvmrc' }}${{ matrix.os == 'windows-latest' && ' on Windows' || '' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.windows && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest"]') }}
        node-version: ${{ fromJSON(inputs.node-versions || '[""]') }}
    defaults:
      run:
        shell: bash
    concurrency:
      group: ci-node-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ matrix.node-version }}-${{ matrix.os }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      START_SERVICES: ${{ inputs.services-compose-file != '' && matrix.os != 'windows-latest' && (!inputs.test-job || (inputs.extra-commands != '' && !inputs.extra-commands-job)) }}
    steps:
      - name: Check pull request title
        if: github.event_name == 'pull_request' && runner.os != 'Windows'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|refactor|perf|docs|test|build|ci|chore)(\([^)]+\))?!?: .+'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "::error::PR title must use Conventional Commits: type(scope): description, with an optional scope and ! for breaking changes. Allowed types: feat, fix, refactor, perf, docs, test, build, ci, chore."
            exit 1
          fi

      - name: Use LF line endings, symlinks and Git Bash for package scripts
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
          bash_path=$(cygpath -w /usr/bin/bash)
          echo "npm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
          echo "pnpm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Fetch pull request base
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          credentials=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 --wrap=0)
          echo "::add-mask::${credentials}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${credentials}" \
            fetch --quiet --no-tags --depth=1 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      - name: Start services in the background
        if: env.START_SERVICES == 'true'
        env:
          SERVICES_COMPOSE_FILE: ${{ inputs.services-compose-file }}
        run: |
          FILE=$(realpath -e -- "$SERVICES_COMPOSE_FILE")
          WORKSPACE=$(realpath -e -- "$GITHUB_WORKSPACE")
          if [[ "$FILE" != "$WORKSPACE/"* || ! -f "$FILE" ]]; then
            echo "::error::services-compose-file must resolve to a regular file inside GITHUB_WORKSPACE."
            exit 1
          fi
          nohup bash -c 'docker compose -f "$1" up -d --wait > "$2" 2>&1; echo "$?" > "$3"' _ \
            "$FILE" "$RUNNER_TEMP/services.log" "$RUNNER_TEMP/services.status" > /dev/null 2>&1 &

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          node-version-file: ${{ matrix.node-version == '' && '.nvmrc' || '' }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run setup commands
        if: inputs.setup-commands != ''
        env:
          SETUP_COMMANDS: ${{ inputs.setup-commands }}
        run: bash -euo pipefail -c "$SETUP_COMMANDS"

      - name: Restore cache
        if: inputs.cache-paths != '' && !inputs.test-job
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.cache-paths }}
          key: ci-node-${{ runner.os }}-${{ matrix.node-version || 'nvmrc' }}-${{ hashFiles(inputs.cache-key-files) }}
          restore-keys: |
            ci-node-${{ runner.os }}-${{ matrix.node-version || 'nvmrc' }}-

      - name: Restore cache again so links extracted before their target become directory links
        if: inputs.cache-paths != '' && !inputs.test-job && runner.os == 'Windows'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.cache-paths }}
          key: ci-node-${{ runner.os }}-${{ matrix.node-version || 'nvmrc' }}-${{ hashFiles(inputs.cache-key-files) }}
          restore-keys: |
            ci-node-${{ runner.os }}-${{ matrix.node-version || 'nvmrc' }}-

      - name: Check documentation
        if: inputs.docs-files != '' && runner.os != 'Windows'
        uses: AntelopeJS/tooling-configs/actions/docs@d4fdcee525bcbf724049c60fc3660e9fc2401136 # v0.5.8
        with:
          files: ${{ inputs.docs-files }}
          typescript-project: ${{ inputs.docs-typescript-project }}

      - name: Start services
        id: services
        if: env.START_SERVICES == 'true'
        run: |
          deadline=$((SECONDS + 900))
          until [ -s "$RUNNER_TEMP/services.status" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              cat "$RUNNER_TEMP/services.log"
              echo "::error::Services did not start within 15 minutes."
              exit 1
            fi
            sleep 0.2
          done
          cat "$RUNNER_TEMP/services.log"
          [ "$(cat "$RUNNER_TEMP/services.status")" = 0 ]

      - name: Run checks
        env:
          ANTELOPEJS_CHECKS_SKIP: ${{ inputs.test-job && 'test' || '' }}
        run: pnpm run checks

      - name: Skill eval, offline
        if: inputs.skill-eval-offline && runner.os != 'Windows'
        env:
          SKILL_EVAL_REF: ${{ inputs.skill-eval-ref }}
        run: |
          mapfile -t dirs < <(git ls-files ':(glob)package.json' ':(glob)**/package.json' | node -e 'const fs = require("fs"); const path = require("path"); for (const file of fs.readFileSync(0, "utf8").split("\n").filter(Boolean)) { const skills = JSON.parse(fs.readFileSync(file, "utf8")).antelopeJs?.skills; for (const dir of Array.isArray(skills) ? skills : []) console.log(path.posix.join(path.posix.dirname(file), dir)); }')
          if [ "${#dirs[@]}" -eq 0 ]; then
            exit 0
          fi
          if [ -z "$(git diff --name-only HEAD^1 HEAD -- "${dirs[@]}")" ]; then
            exit 0
          fi
          args=()
          for dir in "${dirs[@]}"; do
            args+=(--skills "$dir")
          done
          cli="github:AntelopeJS/agent-skills#${SKILL_EVAL_REF}"
          npx -y "$cli" evals check "${args[@]}"
          npx -y "$cli" evals --published "${args[@]}" --min-recall 0.5 --min-precision 0.5

      - name: Run extra commands
        if: inputs.extra-commands != '' && !inputs.extra-commands-job
        env:
          EXTRA_COMMANDS: ${{ inputs.extra-commands }}
        run: bash -euo pipefail -c "$EXTRA_COMMANDS"

      - name: Stop services
        if: always() && steps.services.outcome == 'success'
        env:
          FILE: ${{ inputs.services-compose-file }}
        run: docker compose -f "$FILE" down -v

  test:
    name: Test ${{ matrix.node-version || '.nvmrc' }}${{ matrix.os == 'windows-latest' && ' on Windows' || '' }}
    if: inputs.test-job
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.windows && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest"]') }}
        node-version: ${{ fromJSON(inputs.node-versions || '[""]') }}
    defaults:
      run:
        shell: bash
    concurrency:
      group: ci-node-test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ matrix.node-version }}-${{ matrix.os }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      START_SERVICES: ${{ inputs.services-compose-file != '' && matrix.os != 'windows-latest' }}
    steps:
      - name: Use LF line endings, symlinks and Git Bash for package scripts
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
          bash_path=$(cygpath -w /usr/bin/bash)
          echo "npm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
          echo "pnpm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Fetch pull request base
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          credentials=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 --wrap=0)
          echo "::add-mask::${credentials}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${credentials}" \
            fetch --quiet --no-tags --depth=1 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      - name: Start services in the background
        if: env.START_SERVICES == 'true'
        env:
          SERVICES_COMPOSE_FILE: ${{ inputs.services-compose-file }}
        run: |
          FILE=$(realpath -e -- "$SERVICES_COMPOSE_FILE")
          WORKSPACE=$(realpath -e -- "$GITHUB_WORKSPACE")
          if [[ "$FILE" != "$WORKSPACE/"* || ! -f "$FILE" ]]; then
            echo "::error::services-compose-file must resolve to a regular file inside GITHUB_WORKSPACE."
            exit 1
          fi
          nohup bash -c 'docker compose -f "$1" up -d --wait > "$2" 2>&1; echo "$?" > "$3"' _ \
            "$FILE" "$RUNNER_TEMP/services.log" "$RUNNER_TEMP/services.status" > /dev/null 2>&1 &

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          node-version-file: ${{ matrix.node-version == '' && '.nvmrc' || '' }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run setup commands
        if: inputs.setup-commands != ''
        env:
          SETUP_COMMANDS: ${{ inputs.setup-commands }}
        run: bash -euo pipefail -c "$SETUP_COMMANDS"

      - name: Restore cache
        if: inputs.cache-paths != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.cache-paths }}
          key: ci-node-${{ runner.os }}-${{ matrix.node-version || 'nvmrc' }}-${{ hashFiles(inputs.cache-key-files) }}
          restore-keys: |
            ci-node-${{ runner.os }}-${{ matrix.node-version || 'nvmrc' }}-

      - name: Restore cache again so links extracted before their target become directory links
        if: inputs.cache-paths != '' && runner.os == 'Windows'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.cache-paths }}
          key: ci-node-${{ runner.os }}-${{ matrix.node-version || 'nvmrc' }}-${{ hashFiles(inputs.cache-key-files) }}
          restore-keys: |
            ci-node-${{ runner.os }}-${{ matrix.node-version || 'nvmrc' }}-

      - name: Start services
        id: services
        if: env.START_SERVICES == 'true'
        run: |
          deadline=$((SECONDS + 900))
          until [ -s "$RUNNER_TEMP/services.status" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              cat "$RUNNER_TEMP/services.log"
              echo "::error::Services did not start within 15 minutes."
              exit 1
            fi
            sleep 0.2
          done
          cat "$RUNNER_TEMP/services.log"
          [ "$(cat "$RUNNER_TEMP/services.status")" = 0 ]

      - name: Run tests
        env:
          CI: "1"
        run: pnpm run test

      - name: Stop services
        if: always() && steps.services.outcome == 'success'
        env:
          FILE: ${{ inputs.services-compose-file }}
        run: docker compose -f "$FILE" down -v

  extra:
    name: Extra ${{ matrix.node-version || '.nvmrc' }}${{ matrix.os == 'windows-latest' && ' on Windows' || '' }}
    if: inputs.extra-commands-job && inputs.extra-commands != ''
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.windows && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest"]') }}
        node-version: ${{ fromJSON(inputs.node-versions || '[""]') }}
    defaults:
      run:
        shell: bash
    concurrency:
      group: ci-node-extra-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ matrix.node-version }}-${{ matrix.os }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      START_SERVICES: ${{ inputs.services-compose-file != '' && matrix.os != 'windows-latest' }}
    steps:
      - name: Use LF line endings, symlinks and Git Bash for package scripts
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
          bash_path=$(cygpath -w /usr/bin/bash)
          echo "npm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
          echo "pnpm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Fetch pull request base
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          credentials=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 --wrap=0)
          echo "::add-mask::${credentials}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${credentials}" \
            fetch --quiet --no-tags --depth=1 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      - name: Start services in the background
        if: env.START_SERVICES == 'true'
        env:
          SERVICES_COMPOSE_FILE: ${{ inputs.services-compose-file }}
        run: |
          FILE=$(realpath -e -- "$SERVICES_COMPOSE_FILE")
          WORKSPACE=$(realpath -e -- "$GITHUB_WORKSPACE")
          if [[ "$FILE" != "$WORKSPACE/"* || ! -f "$FILE" ]]; then
            echo "::error::services-compose-file must resolve to a regular file inside GITHUB_WORKSPACE."
            exit 1
          fi
          nohup bash -c 'docker compose -f "$1" up -d --wait > "$2" 2>&1; echo "$?" > "$3"' _ \
            "$FILE" "$RUNNER_TEMP/services.log" "$RUNNER_TEMP/services.status" > /dev/null 2>&1 &

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          node-version-file: ${{ matrix.node-version == '' && '.nvmrc' || '' }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run setup commands
        if: inputs.setup-commands != ''
        env:
          SETUP_COMMANDS: ${{ inputs.setup-commands }}
        run: bash -euo pipefail -c "$SETUP_COMMANDS"

      - name: Start services
        id: services
        if: env.START_SERVICES == 'true'
        run: |
          deadline=$((SECONDS + 900))
          until [ -s "$RUNNER_TEMP/services.status" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              cat "$RUNNER_TEMP/services.log"
              echo "::error::Services did not start within 15 minutes."
              exit 1
            fi
            sleep 0.2
          done
          cat "$RUNNER_TEMP/services.log"
          [ "$(cat "$RUNNER_TEMP/services.status")" = 0 ]

      - name: Run extra commands
        env:
          EXTRA_COMMANDS: ${{ inputs.extra-commands }}
        run: bash -euo pipefail -c "$EXTRA_COMMANDS"

      - name: Stop services
        if: always() && steps.services.outcome == 'success'
        env:
          FILE: ${{ inputs.services-compose-file }}
        run: docker compose -f "$FILE" down -v

  docs-only:
    name: Docs only
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      docs-only: ${{ steps.scope.outputs.docs-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Fetch pull request base
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          credentials=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 --wrap=0)
          echo "::add-mask::${credentials}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${credentials}" \
            fetch --quiet --no-tags --depth=1 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      - name: Report whether the pull request touches only documentation
        id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          docs_only=true
          while IFS= read -r file; do
            case "$file" in
              README.md | docs/* | docs-data/examples.json | packages/*/README.md | packages/*/docs/* | packages/*/docs-data/examples.json | packages/dms/playground/*) ;;
              *) docs_only=false ;;
            esac
          done < <(git diff --name-only "origin/${BASE_REF}" HEAD)
          echo "docs-only=${docs_only}" >> "$GITHUB_OUTPUT"
          echo "docs-only: ${docs_only}" >> "$GITHUB_STEP_SUMMARY"

  renovate-sync:
    if: inputs.renovate-sync
    uses: ./.github/workflows/ci-renovate-sync.yml

  checks:
    if: always()
    needs: [node, test, extra, renovate-sync]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - if: needs.node.result != 'success' || (needs.test.result != 'success' && needs.test.result != 'skipped') || (needs.extra.result != 'success' && needs.extra.result != 'skipped') || needs.renovate-sync.result == 'failure' || needs.renovate-sync.result == 'cancelled'
        run: exit 1
