name: Node CI

on:
  workflow_call:
    inputs:
      node-versions:
        description: JSON array of Node.js versions; empty uses .nvmrc
        default: ""
        type: string
      docs-files:
        description: Newline-separated documentation files to check
        default: ""
        type: string
      docs-typescript-project:
        description: TypeScript project used by the documentation check
        default: ""
        type: string
      services-compose-file:
        description: Path to a docker compose file whose services must run during checks
        default: ""
        type: string
      cache-paths:
        description: Newline-separated paths to cache between runs; empty skips the cache step
        default: ""
        type: string
      cache-key-files:
        description: Newline-separated globs hashed into the cache key
        default: pnpm-lock.yaml
        type: string
      extra-commands:
        description: Multiline shell commands to run after checks
        default: ""
        type: string
      skill-eval-offline:
        description: Run the offline skill evals when the package's skills change
        default: true
        type: boolean
      skill-eval-ref:
        description: Ref of AntelopeJS/agent-skills that supplies the skill evals
        default: main
        type: string

jobs:
  node:
    name: Node ${{ matrix.node-version || '.nvmrc' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJSON(inputs.node-versions || '[""]') }}
    concurrency:
      group: ci-node-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ matrix.node-version }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Check pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|refactor|perf|docs|test|build|ci|chore)(\([^)]+\))?!?: .+'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "::error::PR title must use Conventional Commits: type(scope): description, with an optional scope and ! for breaking changes. Allowed types: feat, fix, refactor, perf, docs, test, build, ci, chore."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Fetch pull request base
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          credentials=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 --wrap=0)
          echo "::add-mask::${credentials}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${credentials}" \
            fetch --quiet --no-tags --depth=1 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          node-version-file: ${{ matrix.node-version == '' && '.nvmrc' || '' }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore cache
        if: inputs.cache-paths != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.cache-paths }}
          key: ci-node-${{ runner.os }}-${{ matrix.node-version || 'nvmrc' }}-${{ hashFiles(inputs.cache-key-files) }}
          restore-keys: |
            ci-node-${{ runner.os }}-${{ matrix.node-version || 'nvmrc' }}-

      - name: Check documentation
        if: inputs.docs-files != ''
        uses: AntelopeJS/tooling-configs/actions/docs@3163630a769f3cd3bd506d194cc5fbf4a276d803 # v0.0.9
        with:
          files: ${{ inputs.docs-files }}
          typescript-project: ${{ inputs.docs-typescript-project }}

      - name: Start services
        id: services
        if: inputs.services-compose-file != ''
        env:
          SERVICES_COMPOSE_FILE: ${{ inputs.services-compose-file }}
        run: |
          FILE=$(realpath -e -- "$SERVICES_COMPOSE_FILE")
          WORKSPACE=$(realpath -e -- "$GITHUB_WORKSPACE")
          if [[ "$FILE" != "$WORKSPACE/"* || ! -f "$FILE" ]]; then
            echo "::error::services-compose-file must resolve to a regular file inside GITHUB_WORKSPACE."
            exit 1
          fi
          docker compose -f "$FILE" up -d --wait

      - name: Run checks
        run: pnpm run checks

      - name: Skill eval, offline
        if: inputs.skill-eval-offline
        env:
          SKILL_EVAL_REF: ${{ inputs.skill-eval-ref }}
        run: |
          mapfile -t dirs < <(git ls-files ':(glob)package.json' ':(glob)**/package.json' | node -e 'const fs = require("fs"); const path = require("path"); for (const file of fs.readFileSync(0, "utf8").split("\n").filter(Boolean)) { const skills = JSON.parse(fs.readFileSync(file, "utf8")).antelopeJs?.skills; for (const dir of Array.isArray(skills) ? skills : []) console.log(path.join(path.dirname(file), dir)); }')
          if [ "${#dirs[@]}" -eq 0 ]; then
            exit 0
          fi
          if ! git diff --name-only HEAD^1 HEAD -- "${dirs[@]}" | grep -q .; then
            exit 0
          fi
          args=()
          for dir in "${dirs[@]}"; do
            args+=(--skills "$dir")
          done
          cli="github:AntelopeJS/agent-skills#${SKILL_EVAL_REF}"
          npx -y "$cli" evals check "${args[@]}"
          npx -y "$cli" evals --published "${args[@]}" --min-recall 0.5 --min-precision 0.5

      - name: Run extra commands
        if: inputs.extra-commands != ''
        env:
          EXTRA_COMMANDS: ${{ inputs.extra-commands }}
        run: bash -euo pipefail -c "$EXTRA_COMMANDS"

      - name: Stop services
        if: always() && steps.services.outcome == 'success'
        env:
          FILE: ${{ inputs.services-compose-file }}
        run: docker compose -f "$FILE" down -v

  renovate-sync:
    name: Renovate sync
    if: >-
      github.event_name == 'pull_request'
      && startsWith(github.head_ref, 'renovate/')
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-node-renovate-sync-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      GH_REPO: ${{ github.repository }}
      BASE_REF: ${{ github.base_ref }}
      HEAD_REF: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Detect a tooling-configs bump
        id: bump
        run: |
          if git diff -U0 "origin/${BASE_REF}...HEAD" -- ':(glob)**/package.json' ':(glob)**/pnpm-lock.yaml' | grep -qE '^[+-].*@antelopejs/tooling-configs'; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read the pack property
        id: pack
        if: steps.bump.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pack=$(gh api "repos/${GH_REPO}/properties/values" --jq '.[] | select(.property_name == "pack") | .value')
          echo "pack=${pack}" >> "$GITHUB_OUTPUT"

      - if: steps.bump.outputs.bumped == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - if: steps.bump.outputs.bumped == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        if: steps.bump.outputs.bumped == 'true'
        run: pnpm install --frozen-lockfile --reporter=silent

      - name: Run antelopejs-sync
        id: sync
        if: steps.bump.outputs.bumped == 'true'
        env:
          PACK: ${{ steps.pack.outputs.pack }}
        run: |
          args=()
          if [ "$PACK" = "template" ]; then
            args+=(--profile template)
          fi
          if ! out=$(pnpm exec antelopejs-sync "${args[@]}" 2>&1); then
            echo "$out"
            exit 1
          fi
          if git status --porcelain --untracked-files=all -- .github/workflows .github/actions | grep -q .; then
            {
              echo "### Renovate sync: One-tap"
              echo
              echo "\`antelopejs-sync\` changes \`.github/workflows/**\` or \`.github/actions/**\`. Nothing was pushed: a pull request touching workflow paths needs a human tap."
              echo
              echo "Changed paths:"
              echo
              git status --porcelain --untracked-files=all -- .github/workflows .github/actions | sed 's/^/- /'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::antelopejs-sync changes workflow paths; nothing pushed, this pull request stays One-tap."
            exit 1
          fi
          if ! git diff --quiet -- package.json; then
            pnpm install --lockfile-only --reporter=silent
          fi
          if git status --porcelain --untracked-files=all | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit the sync output and start checks
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --no-verify -q -m "chore(deps): apply antelopejs-sync output"
          if ! git push --no-verify -q "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" "HEAD:refs/heads/${HEAD_REF}"; then
            echo "::error::The sync commit could not be pushed. The job that calls ci-node.yml must grant contents: write."
            exit 1
          fi
          sha=$(git rev-parse HEAD)
          caller="${GITHUB_WORKFLOW_REF#"${GH_REPO}/"}"
          caller="${caller%%@*}"
          for _ in $(seq 1 12); do
            if [ "$(gh api "repos/${GH_REPO}/actions/runs?head_sha=${sha}&event=pull_request" --jq '.total_count')" != "0" ]; then
              break
            fi
            sleep 5
          done
          if ! gh workflow run "$caller" --ref "$HEAD_REF" > /dev/null; then
            echo "::error::The sync commit is pushed, but ${caller} could not be dispatched. The caller workflow must declare workflow_dispatch and the job that calls ci-node.yml must grant actions: write."
            exit 1
          fi

  checks:
    if: always()
    needs: [node, renovate-sync]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - if: needs.node.result != 'success' || needs.renovate-sync.result == 'failure' || needs.renovate-sync.result == 'cancelled'
        run: exit 1
