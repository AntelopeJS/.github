name: Node CI

on:
  workflow_call:
    inputs:
      node-versions:
        description: JSON array of Node.js versions; empty uses .nvmrc
        default: ""
        type: string
      docs-files:
        description: Newline-separated documentation files to check
        default: ""
        type: string
      docs-typescript-project:
        description: TypeScript project used by the documentation check
        default: ""
        type: string
      services-compose-file:
        description: Path to a docker compose file whose services must run during checks
        default: ""
        type: string
      cache-paths:
        description: Newline-separated paths to cache between runs; empty skips the cache step
        default: ""
        type: string
      cache-key-files:
        description: Newline-separated globs hashed into the cache key
        default: pnpm-lock.yaml
        type: string
      setup-commands:
        description: Multiline shell commands to run after the root pnpm install, before checks, tests and extra-commands
        default: ""
        type: string
      extra-commands:
        description: Multiline shell commands to run after checks
        default: ""
        type: string
      renovate-sync:
        description: Accepted and ignored; every caller passes false and runs the Renovate sync from its own job calling ci-renovate-sync.yml
        default: false
        type: boolean
      test-job:
        description: "Accepted and ignored: tests run as a step of the single job, or in a job of their own with single-job false"
        default: false
        type: boolean
      single-job:
        description: Run checks and tests in one job per runner; a caller whose tests take minutes passes false to run them in a job of their own. Compose services always use separate jobs
        default: true
        type: boolean
      extra-commands-job:
        description: Run extra-commands in their own job, in parallel with the other checks
        default: false
        type: boolean
      windows:
        description: Also run the node jobs on windows-latest, in parallel with ubuntu-latest, in the nightly tier, and in the merge queue and manual runs with windows-merge-queue; callers that cannot run on Windows pass false and say why. Run steps and package scripts use Git Bash there, git checks out with core.autocrlf false and core.symlinks true, and the docker compose services and skill evals are skipped, so tests that need the services must not run on Windows
        default: true
        type: boolean
      windows-merge-queue:
        description: With windows, also run the Windows jobs in the merge queue and on manual runs, not only in the nightly tier
        default: false
        type: boolean
      windows-pull-requests:
        description: Accepted; the former name of windows-merge-queue, same effect
        default: false
        type: boolean
      affected-tests:
        description: "In the fast tier, run only the tests the pull request can affect: in a pnpm workspace, the test script of each package changed since the diff base and of its dependents, or the whole test script when a file outside the packages changes; in a single package whose test script is one vitest or jest command, that command with its changed-file option; otherwise the whole test script"
        default: false
        type: boolean
    secrets:
      NOTION_TOKEN:
        description: Notion integration token allowed to read, insert and update content in the Tasks database; with it, a test that fails then passes on its retry in the merge queue files a task in the Inbox
        required: false

jobs:
  node:
    name: ${{ matrix.part == 'test' && 'Test' || matrix.part == 'extra' && 'Extra' || 'Node' }} ${{ matrix.node-version || '.nvmrc' }}${{ matrix.os == 'windows-latest' && ' on Windows' || '' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.windows && (github.event_name == 'schedule' || ((github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch') && (inputs.windows-merge-queue || inputs.windows-pull-requests))) && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest"]') }}
        node-version: ${{ fromJSON(inputs.node-versions || '[""]') }}
        part: ${{ fromJSON(format('[{0}{1}]', inputs.single-job && inputs.services-compose-file == '' && '"all"' || '"checks","test"', inputs.extra-commands-job && inputs.extra-commands != '' && ',"extra"' || '')) }}
    defaults:
      run:
        shell: bash
    concurrency:
      group: ci-node-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}-${{ matrix.part }}-${{ matrix.node-version }}-${{ matrix.os }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
    env:
      PRIMARY_LEG: ${{ matrix.os == 'ubuntu-latest' && matrix.node-version == fromJSON(inputs.node-versions || '[""]')[0] }}
      START_SERVICES: ${{ inputs.services-compose-file != '' && matrix.os != 'windows-latest' && (matrix.part == 'test' || matrix.part == 'extra' || (matrix.part == 'checks' && inputs.extra-commands != '' && !inputs.extra-commands-job)) }}
      CACHE_PREFIX: ${{ matrix.part == 'extra' && 'ci-node-extra' || 'ci-node' }}
    steps:
      - name: Use LF line endings, symlinks and Git Bash for package scripts
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
          bash_path=$(cygpath -w /usr/bin/bash)
          echo "npm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
          echo "pnpm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Pick the tier
        id: tier
        uses: AntelopeJS/.github/.github/actions/ci-tier@v2
        with:
          selection: ${{ vars.CI_SELECTION }}

      - name: Pick the work of this leg from the tier
        id: leg
        env:
          TIER: ${{ steps.tier.outputs.tier }}
          BASE: ${{ steps.tier.outputs.base }}
          PART: ${{ matrix.part }}
        run: |
          tests=true test_base=""
          case "$TIER" in
            none) tests=false ;;
            fast)
              test_base="$BASE"
              tests=false
              changed=$(git -c core.quotepath=off diff --name-only --no-renames "$BASE" HEAD)
              while IFS= read -r file; do
                case "$file" in
                  packages/*/playground/checks/*) tests=true ;;
                  "" | README.md | docs/* | docs-data/examples.json | packages/*/README.md | packages/*/docs/* | packages/*/docs-data/examples.json | packages/dms/playground/*) ;;
                  *) tests=true ;;
                esac
              done <<< "$changed"
              ;;
          esac
          work=true
          if [[ "$TIER" == none || ( "$PART" == test && "$tests" == false ) ]]; then
            work=false
          fi

          {
            echo "ANTELOPEJS_CI_TIER=${TIER}"
            echo "ANTELOPEJS_TEST_BASE=${test_base}"
          } >> "$GITHUB_ENV"
          {
            echo "tests=${tests}"
            echo "work=${work}"
          } >> "$GITHUB_OUTPUT"
          if [[ "$PRIMARY_LEG" == true ]]; then
            echo "Tier \`${TIER}\`: tests ${tests}, test base ${test_base:-none}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fetch the base branch
        if: steps.leg.outputs.work == 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref }}
        run: |
          branch="${BASE_REF#refs/heads/}"
          credentials=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 --wrap=0)
          echo "::add-mask::${credentials}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${credentials}" \
            fetch --quiet --no-tags --depth=1 origin "+refs/heads/${branch}:refs/remotes/origin/${branch}"

      - name: Start services in the background
        if: steps.leg.outputs.work == 'true' && env.START_SERVICES == 'true'
        env:
          SERVICES_COMPOSE_FILE: ${{ inputs.services-compose-file }}
        run: |
          FILE=$(realpath -e -- "$SERVICES_COMPOSE_FILE")
          WORKSPACE=$(realpath -e -- "$GITHUB_WORKSPACE")
          if [[ "$FILE" != "$WORKSPACE/"* || ! -f "$FILE" ]]; then
            echo "::error::services-compose-file must resolve to a regular file inside GITHUB_WORKSPACE."
            exit 1
          fi
          nohup bash -c 'docker compose -f "$1" up -d --wait > "$2" 2>&1; echo "$?" > "$3"' _ \
            "$FILE" "$RUNNER_TEMP/services.log" "$RUNNER_TEMP/services.status" > /dev/null 2>&1 &

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.leg.outputs.work == 'true'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.leg.outputs.work == 'true'
        with:
          node-version: ${{ matrix.node-version }}
          node-version-file: ${{ matrix.node-version == '' && '.nvmrc' || '' }}
          cache: pnpm

      - name: Install dependencies
        if: steps.leg.outputs.work == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run setup commands
        if: steps.leg.outputs.work == 'true' && inputs.setup-commands != ''
        env:
          SETUP_COMMANDS: ${{ inputs.setup-commands }}
        run: bash -euo pipefail -c "$SETUP_COMMANDS"

      - name: Restore cache
        if: steps.leg.outputs.work == 'true' && inputs.cache-paths != '' && matrix.part != 'checks'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.cache-paths }}
          key: ${{ env.CACHE_PREFIX }}-${{ runner.os }}-${{ matrix.node-version || 'nvmrc' }}-${{ hashFiles(inputs.cache-key-files) }}
          restore-keys: |
            ${{ env.CACHE_PREFIX }}-${{ runner.os }}-${{ matrix.node-version || 'nvmrc' }}-

      - name: Restore cache again so links extracted before their target become directory links
        if: steps.leg.outputs.work == 'true' && inputs.cache-paths != '' && matrix.part != 'checks' && runner.os == 'Windows'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.cache-paths }}
          key: ${{ env.CACHE_PREFIX }}-${{ runner.os }}-${{ matrix.node-version || 'nvmrc' }}-${{ hashFiles(inputs.cache-key-files) }}
          restore-keys: |
            ${{ env.CACHE_PREFIX }}-${{ runner.os }}-${{ matrix.node-version || 'nvmrc' }}-

      - name: Check documentation
        if: steps.leg.outputs.work == 'true' && inputs.docs-files != '' && (matrix.part == 'all' || matrix.part == 'checks')
        uses: AntelopeJS/tooling-configs/actions/docs@0071b4bcf51cda8276c3ad318fbe496f2cef7abe # v0.8.2 + #419, #422 (0.8.3-next.390.g0071b4b)
        with:
          files: ${{ inputs.docs-files }}
          typescript-project: ${{ inputs.docs-typescript-project }}

      - name: Start services
        id: services
        if: steps.leg.outputs.work == 'true' && env.START_SERVICES == 'true'
        run: |
          deadline=$((SECONDS + 900))
          until [ -s "$RUNNER_TEMP/services.status" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              cat "$RUNNER_TEMP/services.log"
              echo "::error::Services did not start within 15 minutes."
              exit 1
            fi
            sleep 0.2
          done
          cat "$RUNNER_TEMP/services.log"
          [ "$(cat "$RUNNER_TEMP/services.status")" = 0 ]

      - name: Run checks
        if: steps.leg.outputs.work == 'true' && (matrix.part == 'all' || matrix.part == 'checks')
        env:
          ANTELOPEJS_CHECKS_SKIP: ${{ env.PRIMARY_LEG == 'true' && 'test' || 'test,lint,typecheck' }}
        run: pnpm run checks

      - name: Skill eval, offline
        if: steps.leg.outputs.work == 'true' && env.PRIMARY_LEG == 'true' && (matrix.part == 'all' || matrix.part == 'checks')
        env:
          ANTELOPEJS_DIFF_BASE: ${{ steps.tier.outputs.base }}
        run: |
          mapfile -t dirs < <(git ls-files ':(glob)package.json' ':(glob)**/package.json' | node -e 'const fs = require("fs"); const path = require("path"); for (const file of fs.readFileSync(0, "utf8").split("\n").filter(Boolean)) { const skills = JSON.parse(fs.readFileSync(file, "utf8")).antelopeJs?.skills; for (const dir of Array.isArray(skills) ? skills : []) console.log(path.posix.join(path.posix.dirname(file), dir)); }')
          if [ "${#dirs[@]}" -eq 0 ]; then
            exit 0
          fi
          if [ -z "$(git diff --name-only "${ANTELOPEJS_DIFF_BASE:-HEAD^1}" HEAD -- "${dirs[@]}")" ]; then
            exit 0
          fi
          args=()
          for dir in "${dirs[@]}"; do
            args+=(--skills "$dir")
          done
          cli="github:AntelopeJS/agent-skills#main"
          npx -y "$cli" evals check "${args[@]}"
          npx -y "$cli" evals --published "${args[@]}" --min-recall 0.5 --min-precision 0.5

      - name: Run tests
        id: tests
        if: steps.leg.outputs.work == 'true' && steps.leg.outputs.tests == 'true' && (matrix.part == 'all' || matrix.part == 'test')
        env:
          CI: "1"
          AFFECTED_TESTS: ${{ inputs.affected-tests }}
        run: |
          log="$RUNNER_TEMP/test-attempt-1.log"
          command=(pnpm run test)
          if [[ "$AFFECTED_TESTS" == true && "$ANTELOPEJS_CI_TIER" == fast ]]; then
            filter="...[$ANTELOPEJS_TEST_BASE]"
            if [[ "$(pnpm ls -r --depth -1 --json | jq length)" -gt 1 ]]; then
              selected="$(pnpm --filter "$filter" --include-workspace-root ls --depth -1 --json)"
              if ! jq -e --arg root "$(pwd -P)" 'any(.[]; .path == $root)' <<< "${selected:-[]}" > /dev/null; then
                command=(pnpm --filter "$filter" --workspace-concurrency=1 run test)
              fi
            else
              declare -A changed_option=([vitest]="--changed=$ANTELOPEJS_TEST_BASE" [jest]="--changedSince=$ANTELOPEJS_TEST_BASE")
              single_runner='^(vitest|jest)( [^;&|<>()$`]*)?$'
              test_script="$(jq -r '.scripts.test // ""' package.json)"
              if [[ "$test_script" =~ $single_runner ]]; then
                command+=("${changed_option[${BASH_REMATCH[1]}]}")
              fi
            fi
            if [[ "$PRIMARY_LEG" == true ]]; then
              echo "Tests: \`${command[*]}\`" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          if "${command[@]}" 2>&1 | tee "$log"; then
            exit 0
          fi
          if [ "$ANTELOPEJS_CI_TIER" != queue ]; then
            exit 1
          fi
          echo "::warning::pnpm run test failed in the merge queue. It runs once more: a pass marks a flaky test, a second failure fails the job."
          "${command[@]}"
          echo "flaky=true" >> "$GITHUB_OUTPUT"
          echo "::warning::pnpm run test failed, then passed on its retry: a test is flaky."
          echo "Flaky test: \`pnpm run test\` failed, then passed on its retry in the merge queue." >> "$GITHUB_STEP_SUMMARY"

      - name: Run extra commands
        if: steps.leg.outputs.work == 'true' && inputs.extra-commands != '' && (matrix.part == 'extra' || (!inputs.extra-commands-job && (matrix.part == 'all' || matrix.part == 'checks')))
        env:
          EXTRA_COMMANDS: ${{ inputs.extra-commands }}
        run: bash -euo pipefail -c "$EXTRA_COMMANDS"

      - name: File the flaky test in the Inbox
        if: ${{ !cancelled() && steps.tests.outputs.flaky == 'true' }}
        continue-on-error: true
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          TASKS: 2f2d36f1-99db-4ff3-b040-f66d7480ac9a
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo "::warning::No task was filed for the flaky test: the caller passes no NOTION_TOKEN secret."
            exit 0
          fi
          repo="${GH_REPO#*/}"
          key="flaky-test:${repo}"
          notion() {
            curl -fsS -X "$1" "https://api.notion.com/v1/$2" \
              -H "Authorization: Bearer ${NOTION_TOKEN}" \
              -H "Notion-Version: 2025-09-03" \
              -H "Content-Type: application/json" \
              --data @-
          }
          page=$(jq -n --arg key "$key" '{page_size: 1, filter: {and: [
            {property: "Key", rich_text: {equals: $key}},
            {property: "Status", status: {does_not_equal: "Done"}},
            {property: "Status", status: {does_not_equal: "Dropped"}}
          ]}}' | notion POST "data_sources/${TASKS}/query" | jq -r '.results[0].id // empty')
          if [ -n "$page" ]; then
            jq -n --arg text "Seen again: pnpm run test failed, then passed on its retry in the merge queue. Run: ${RUN_URL}" \
              '{children: [{paragraph: {rich_text: [{text: {content: $text}}]}}]}' \
              | notion PATCH "blocks/${page}/children" > /dev/null
            exit 0
          fi
          log=$(sed 's/\x1b\[[0-9;]*[A-Za-z]//g' "$RUNNER_TEMP/test-attempt-1.log" | tail -c 1500)
          jq -n \
            --arg tasks "$TASKS" \
            --arg key "$key" \
            --arg repo "$repo" \
            --arg title "${repo}: fix the flaky test" \
            --arg goal "In the merge queue, pnpm run test failed, then passed on its retry: a test of ${repo} passes or fails by chance. The failed attempt's log ends below. Run: ${RUN_URL}" \
            --arg log "$log" \
            --arg done_means "The test that failed passes every time: its cause is found and fixed, not hidden by a retry or a longer timeout." \
            '{
              parent: {type: "data_source_id", data_source_id: $tasks},
              properties: {
                "Task name": {title: [{text: {content: $title}}]},
                Key: {rich_text: [{text: {content: $key}}]},
                Status: {status: {name: "Inbox"}},
                Repos: {multi_select: [{name: $repo}]}
              },
              children: [
                {heading_2: {rich_text: [{text: {content: "Goal"}}]}},
                {paragraph: {rich_text: [{text: {content: $goal}}]}},
                {code: {language: "plain text", rich_text: [{text: {content: $log}}]}},
                {heading_2: {rich_text: [{text: {content: "Done means"}}]}},
                {bulleted_list_item: {rich_text: [{text: {content: $done_means}}]}}
              ]
            }' | notion POST pages > /dev/null

      - name: Stop services
        if: always() && steps.services.outcome == 'success'
        env:
          FILE: ${{ inputs.services-compose-file }}
        run: docker compose -f "$FILE" down -v

  stress:
    name: Stress
    needs: node
    if: ${{ !cancelled() && needs.node.outputs.tier == 'nightly' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      ANTELOPEJS_CI_TIER: nightly
      START_SERVICES: ${{ inputs.services-compose-file != '' }}
      STRESS_RUNS: 3
      STRESS_LOOPS_PER_CPU: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Start services in the background
        if: env.START_SERVICES == 'true'
        env:
          SERVICES_COMPOSE_FILE: ${{ inputs.services-compose-file }}
        run: |
          FILE=$(realpath -e -- "$SERVICES_COMPOSE_FILE")
          WORKSPACE=$(realpath -e -- "$GITHUB_WORKSPACE")
          if [[ "$FILE" != "$WORKSPACE/"* || ! -f "$FILE" ]]; then
            echo "::error::services-compose-file must resolve to a regular file inside GITHUB_WORKSPACE."
            exit 1
          fi
          nohup bash -c 'docker compose -f "$1" up -d --wait > "$2" 2>&1; echo "$?" > "$3"' _ \
            "$FILE" "$RUNNER_TEMP/services.log" "$RUNNER_TEMP/services.status" > /dev/null 2>&1 &

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ fromJSON(inputs.node-versions || '[""]')[0] }}
          node-version-file: ${{ fromJSON(inputs.node-versions || '[""]')[0] == '' && '.nvmrc' || '' }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run setup commands
        if: inputs.setup-commands != ''
        env:
          SETUP_COMMANDS: ${{ inputs.setup-commands }}
        run: bash -euo pipefail -c "$SETUP_COMMANDS"

      - name: Restore cache
        if: inputs.cache-paths != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.cache-paths }}
          key: ci-node-${{ runner.os }}-${{ fromJSON(inputs.node-versions || '[""]')[0] || 'nvmrc' }}-${{ hashFiles(inputs.cache-key-files) }}
          restore-keys: |
            ci-node-${{ runner.os }}-${{ fromJSON(inputs.node-versions || '[""]')[0] || 'nvmrc' }}-

      - name: Build what the tests read
        run: pnpm run --if-present checks:prepare

      - name: Start services
        id: services
        if: env.START_SERVICES == 'true'
        run: |
          deadline=$((SECONDS + 900))
          until [ -s "$RUNNER_TEMP/services.status" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              cat "$RUNNER_TEMP/services.log"
              echo "::error::Services did not start within 15 minutes."
              exit 1
            fi
            sleep 0.2
          done
          cat "$RUNNER_TEMP/services.log"
          [ "$(cat "$RUNNER_TEMP/services.status")" = 0 ]

      - name: Run the tests ${{ env.STRESS_RUNS }} times beside ${{ env.STRESS_LOOPS_PER_CPU }} busy loops per CPU
        env:
          CI: "1"
        run: |
          loops=$((STRESS_LOOPS_PER_CPU * $(nproc)))
          for _ in $(seq "$loops"); do
            (while :; do :; done) &
          done
          trap 'kill $(jobs -p) 2> /dev/null' EXIT
          failed=0
          for run in $(seq "$STRESS_RUNS"); do
            echo "::group::Run ${run} of ${STRESS_RUNS}"
            if ! pnpm run test; then
              failed=$((failed + 1))
              echo "::error::Run ${run} of ${STRESS_RUNS} of pnpm run test failed beside ${loops} busy loops."
            fi
            echo "::endgroup::"
          done
          echo "Stress: ${failed} of ${STRESS_RUNS} runs of \`pnpm run test\` failed beside ${loops} busy loops on $(nproc) CPUs" >> "$GITHUB_STEP_SUMMARY"
          [ "$failed" -eq 0 ]

      - name: Stop services
        if: always() && steps.services.outcome == 'success'
        env:
          FILE: ${{ inputs.services-compose-file }}
        run: docker compose -f "$FILE" down -v

  checks:
    if: always()
    needs: [node, stress]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|refactor|perf|revert|docs|test|build|ci|chore)(\([^)]+\))?!?: .+'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "::error::PR title must use Conventional Commits: type(scope): description, with an optional scope and ! for breaking changes. Allowed types: feat, fix, refactor, perf, revert, docs, test, build, ci, chore."
            exit 1
          fi

      - name: Fail when a job failed, was cancelled or did not run
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || needs.node.result != 'success' || (needs.node.outputs.tier == 'nightly' && needs.stress.result != 'success')
        env:
          TIER: ${{ needs.node.outputs.tier }}
          NODE: ${{ needs.node.result }}
          STRESS: ${{ needs.stress.result }}
        run: |
          echo "::error::Tier ${TIER:-unknown}: node ${NODE}, stress ${STRESS}."
          exit 1
