name: Node CI

on:
  workflow_call:
    inputs:
      node-versions:
        description: JSON array of Node.js versions; empty uses .nvmrc
        default: ""
        type: string
      docs-files:
        description: Newline-separated documentation files to check
        default: ""
        type: string
      docs-typescript-project:
        description: TypeScript project used by the documentation check
        default: ""
        type: string
      services-compose-file:
        description: Path to a docker compose file whose services must run during checks
        default: ""
        type: string
      cache-paths:
        description: Newline-separated paths to cache between runs; empty skips the cache step
        default: ""
        type: string
      cache-key-files:
        description: Newline-separated globs hashed into the cache key
        default: pnpm-lock.yaml
        type: string
      setup-commands:
        description: Multiline shell commands to run after the root pnpm install, before checks, tests and extra-commands
        default: ""
        type: string
      extra-commands:
        description: Multiline shell commands to run after checks
        default: ""
        type: string
      renovate-sync:
        description: Accepted and ignored; every caller passes false and runs the Renovate sync from its own job calling ci-renovate-sync.yml
        default: false
        type: boolean
      test-job:
        description: Run the test step in its own job, in parallel with the other checks
        default: false
        type: boolean
      extra-commands-job:
        description: Run extra-commands in their own job, in parallel with the other checks
        default: false
        type: boolean
      windows:
        description: Also run the node, test and extra jobs on windows-latest, in parallel with ubuntu-latest, in the nightly tier; callers that cannot run on Windows pass false and say why. Run steps and package scripts use Git Bash there, git checks out with core.autocrlf false and core.symlinks true, and the docker compose services and skill evals are skipped, so tests that need the services must not run on Windows
        default: true
        type: boolean
      windows-pull-requests:
        description: With windows, also run the Windows jobs on ready pull requests and manual runs, not only in the nightly tier
        default: false
        type: boolean

jobs:
  tier:
    name: Tier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
      lint: ${{ steps.tier.outputs.lint }}
      checks: ${{ steps.tier.outputs.checks }}
      tests: ${{ steps.tier.outputs.tests }}
      test-base: ${{ steps.tier.outputs.test-base }}
      os: ${{ steps.tier.outputs.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Pick the tier from the event, the target branch and the draft flag
        id: pick
        uses: AntelopeJS/.github/.github/actions/ci-tier@v2

      - name: Pick the jobs and runners from the tier
        id: tier
        env:
          TIER: ${{ steps.pick.outputs.tier }}
          EVENT: ${{ github.event_name }}
          WINDOWS: ${{ inputs.windows }}
          WINDOWS_PULL_REQUESTS: ${{ inputs.windows-pull-requests }}
        run: |
          tier="$TIER"
          lint=true checks=true tests=true test_base=""
          case "$tier" in
            none) lint=false checks=false tests=false ;;
            draft) checks=false tests=false ;;
            fast)
              test_base=$(git rev-parse --verify HEAD^1)
              tests=false
              while IFS= read -r file; do
                case "$file" in
                  packages/*/playground/checks/*) tests=true ;;
                  README.md | docs/* | docs-data/examples.json | packages/*/README.md | packages/*/docs/* | packages/*/docs-data/examples.json | packages/dms/playground/*) ;;
                  *) tests=true ;;
                esac
              done < <(git diff --name-only --no-renames "$test_base" HEAD)
              ;;
          esac

          os='["ubuntu-latest"]'
          if [[ "$WINDOWS" == true && ( "$tier" == nightly || ( "$WINDOWS_PULL_REQUESTS" == true && "$EVENT" != push ) ) ]]; then
            os='["ubuntu-latest","windows-latest"]'
          fi

          {
            echo "tier=${tier}"
            echo "lint=${lint}"
            echo "checks=${checks}"
            echo "tests=${tests}"
            echo "test-base=${test_base}"
            echo "os=${os}"
          } >> "$GITHUB_OUTPUT"
          echo "Tier \`${tier}\`: lint ${lint}, checks ${checks}, tests ${tests}, runners ${os}" >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint and typecheck
    needs: tier
    if: needs.tier.outputs.lint == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    concurrency:
      group: ci-node-lint-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Check pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|refactor|perf|revert|docs|test|build|ci|chore)(\([^)]+\))?!?: .+'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "::error::PR title must use Conventional Commits: type(scope): description, with an optional scope and ! for breaking changes. Allowed types: feat, fix, refactor, perf, revert, docs, test, build, ci, chore."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ fromJSON(inputs.node-versions || '[""]')[0] }}
          node-version-file: ${{ fromJSON(inputs.node-versions || '[""]')[0] == '' && '.nvmrc' || '' }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run setup commands
        if: inputs.setup-commands != ''
        env:
          SETUP_COMMANDS: ${{ inputs.setup-commands }}
        run: bash -euo pipefail -c "$SETUP_COMMANDS"

      - name: Typecheck and lint
        run: |
          pnpm run --if-present checks:prepare
          pnpm run typecheck
          pnpm run lint

  node:
    name: Node ${{ matrix.node-version || '.nvmrc' }}${{ matrix.os == 'windows-latest' && ' on Windows' || '' }}
    needs: [tier, lint]
    if: needs.tier.outputs.checks == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.tier.outputs.os) }}
        node-version: ${{ fromJSON(inputs.node-versions || '[""]') }}
    defaults:
      run:
        shell: bash
    concurrency:
      group: ci-node-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ matrix.node-version }}-${{ matrix.os }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      ANTELOPEJS_CI_TIER: ${{ needs.tier.outputs.tier }}
      ANTELOPEJS_TEST_BASE: ${{ needs.tier.outputs.test-base }}
      START_SERVICES: ${{ inputs.services-compose-file != '' && matrix.os != 'windows-latest' && ((!inputs.test-job && needs.tier.outputs.tests == 'true') || (inputs.extra-commands != '' && !inputs.extra-commands-job)) }}
    steps:
      - name: Use LF line endings, symlinks and Git Bash for package scripts
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
          bash_path=$(cygpath -w /usr/bin/bash)
          echo "npm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
          echo "pnpm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Fetch pull request base
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          credentials=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 --wrap=0)
          echo "::add-mask::${credentials}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${credentials}" \
            fetch --quiet --no-tags --depth=1 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      - name: Start services in the background
        if: env.START_SERVICES == 'true'
        env:
          SERVICES_COMPOSE_FILE: ${{ inputs.services-compose-file }}
        run: |
          FILE=$(realpath -e -- "$SERVICES_COMPOSE_FILE")
          WORKSPACE=$(realpath -e -- "$GITHUB_WORKSPACE")
          if [[ "$FILE" != "$WORKSPACE/"* || ! -f "$FILE" ]]; then
            echo "::error::services-compose-file must resolve to a regular file inside GITHUB_WORKSPACE."
            exit 1
          fi
          nohup bash -c 'docker compose -f "$1" up -d --wait > "$2" 2>&1; echo "$?" > "$3"' _ \
            "$FILE" "$RUNNER_TEMP/services.log" "$RUNNER_TEMP/services.status" > /dev/null 2>&1 &

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          node-version-file: ${{ matrix.node-version == '' && '.nvmrc' || '' }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run setup commands
        if: inputs.setup-commands != ''
        env:
          SETUP_COMMANDS: ${{ inputs.setup-commands }}
        run: bash -euo pipefail -c "$SETUP_COMMANDS"

      - name: Restore cache
        if: inputs.cache-paths != '' && !inputs.test-job
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.cache-paths }}
          key: ci-node-${{ runner.os }}-${{ matrix.node-version || 'nvmrc' }}-${{ hashFiles(inputs.cache-key-files) }}
          restore-keys: |
            ci-node-${{ runner.os }}-${{ matrix.node-version || 'nvmrc' }}-

      - name: Restore cache again so links extracted before their target become directory links
        if: inputs.cache-paths != '' && !inputs.test-job && runner.os == 'Windows'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.cache-paths }}
          key: ci-node-${{ runner.os }}-${{ matrix.node-version || 'nvmrc' }}-${{ hashFiles(inputs.cache-key-files) }}
          restore-keys: |
            ci-node-${{ runner.os }}-${{ matrix.node-version || 'nvmrc' }}-

      - name: Check documentation
        if: inputs.docs-files != ''
        uses: AntelopeJS/tooling-configs/actions/docs@d4fdcee525bcbf724049c60fc3660e9fc2401136 # v0.5.8
        with:
          files: ${{ inputs.docs-files }}
          typescript-project: ${{ inputs.docs-typescript-project }}

      - name: Start services
        id: services
        if: env.START_SERVICES == 'true'
        run: |
          deadline=$((SECONDS + 900))
          until [ -s "$RUNNER_TEMP/services.status" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              cat "$RUNNER_TEMP/services.log"
              echo "::error::Services did not start within 15 minutes."
              exit 1
            fi
            sleep 0.2
          done
          cat "$RUNNER_TEMP/services.log"
          [ "$(cat "$RUNNER_TEMP/services.status")" = 0 ]

      - name: Run checks
        env:
          ANTELOPEJS_CHECKS_SKIP: ${{ (inputs.test-job || needs.tier.outputs.tests != 'true') && 'lint,test' || 'lint' }}
        run: pnpm run checks

      - name: Skill eval, offline
        if: runner.os != 'Windows'
        run: |
          mapfile -t dirs < <(git ls-files ':(glob)package.json' ':(glob)**/package.json' | node -e 'const fs = require("fs"); const path = require("path"); for (const file of fs.readFileSync(0, "utf8").split("\n").filter(Boolean)) { const skills = JSON.parse(fs.readFileSync(file, "utf8")).antelopeJs?.skills; for (const dir of Array.isArray(skills) ? skills : []) console.log(path.posix.join(path.posix.dirname(file), dir)); }')
          if [ "${#dirs[@]}" -eq 0 ]; then
            exit 0
          fi
          if [ -z "$(git diff --name-only HEAD^1 HEAD -- "${dirs[@]}")" ]; then
            exit 0
          fi
          args=()
          for dir in "${dirs[@]}"; do
            args+=(--skills "$dir")
          done
          cli="github:AntelopeJS/agent-skills#main"
          npx -y "$cli" evals check "${args[@]}"
          npx -y "$cli" evals --published "${args[@]}" --min-recall 0.5 --min-precision 0.5

      - name: Run extra commands
        if: inputs.extra-commands != '' && !inputs.extra-commands-job
        env:
          EXTRA_COMMANDS: ${{ inputs.extra-commands }}
        run: bash -euo pipefail -c "$EXTRA_COMMANDS"

      - name: Stop services
        if: always() && steps.services.outcome == 'success'
        env:
          FILE: ${{ inputs.services-compose-file }}
        run: docker compose -f "$FILE" down -v

  test:
    name: Test ${{ matrix.node-version || '.nvmrc' }}${{ matrix.os == 'windows-latest' && ' on Windows' || '' }}
    needs: [tier, lint]
    if: inputs.test-job && needs.tier.outputs.tests == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.tier.outputs.os) }}
        node-version: ${{ fromJSON(inputs.node-versions || '[""]') }}
    defaults:
      run:
        shell: bash
    concurrency:
      group: ci-node-test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ matrix.node-version }}-${{ matrix.os }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      ANTELOPEJS_CI_TIER: ${{ needs.tier.outputs.tier }}
      ANTELOPEJS_TEST_BASE: ${{ needs.tier.outputs.test-base }}
      START_SERVICES: ${{ inputs.services-compose-file != '' && matrix.os != 'windows-latest' }}
    steps:
      - name: Use LF line endings, symlinks and Git Bash for package scripts
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
          bash_path=$(cygpath -w /usr/bin/bash)
          echo "npm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
          echo "pnpm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Fetch pull request base
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          credentials=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 --wrap=0)
          echo "::add-mask::${credentials}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${credentials}" \
            fetch --quiet --no-tags --depth=1 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      - name: Start services in the background
        if: env.START_SERVICES == 'true'
        env:
          SERVICES_COMPOSE_FILE: ${{ inputs.services-compose-file }}
        run: |
          FILE=$(realpath -e -- "$SERVICES_COMPOSE_FILE")
          WORKSPACE=$(realpath -e -- "$GITHUB_WORKSPACE")
          if [[ "$FILE" != "$WORKSPACE/"* || ! -f "$FILE" ]]; then
            echo "::error::services-compose-file must resolve to a regular file inside GITHUB_WORKSPACE."
            exit 1
          fi
          nohup bash -c 'docker compose -f "$1" up -d --wait > "$2" 2>&1; echo "$?" > "$3"' _ \
            "$FILE" "$RUNNER_TEMP/services.log" "$RUNNER_TEMP/services.status" > /dev/null 2>&1 &

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          node-version-file: ${{ matrix.node-version == '' && '.nvmrc' || '' }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run setup commands
        if: inputs.setup-commands != ''
        env:
          SETUP_COMMANDS: ${{ inputs.setup-commands }}
        run: bash -euo pipefail -c "$SETUP_COMMANDS"

      - name: Restore cache
        if: inputs.cache-paths != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.cache-paths }}
          key: ci-node-${{ runner.os }}-${{ matrix.node-version || 'nvmrc' }}-${{ hashFiles(inputs.cache-key-files) }}
          restore-keys: |
            ci-node-${{ runner.os }}-${{ matrix.node-version || 'nvmrc' }}-

      - name: Restore cache again so links extracted before their target become directory links
        if: inputs.cache-paths != '' && runner.os == 'Windows'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.cache-paths }}
          key: ci-node-${{ runner.os }}-${{ matrix.node-version || 'nvmrc' }}-${{ hashFiles(inputs.cache-key-files) }}
          restore-keys: |
            ci-node-${{ runner.os }}-${{ matrix.node-version || 'nvmrc' }}-

      - name: Start services
        id: services
        if: env.START_SERVICES == 'true'
        run: |
          deadline=$((SECONDS + 900))
          until [ -s "$RUNNER_TEMP/services.status" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              cat "$RUNNER_TEMP/services.log"
              echo "::error::Services did not start within 15 minutes."
              exit 1
            fi
            sleep 0.2
          done
          cat "$RUNNER_TEMP/services.log"
          [ "$(cat "$RUNNER_TEMP/services.status")" = 0 ]

      - name: Run tests
        env:
          CI: "1"
        run: pnpm run test

      - name: Stop services
        if: always() && steps.services.outcome == 'success'
        env:
          FILE: ${{ inputs.services-compose-file }}
        run: docker compose -f "$FILE" down -v

  extra:
    name: Extra ${{ matrix.node-version || '.nvmrc' }}${{ matrix.os == 'windows-latest' && ' on Windows' || '' }}
    needs: [tier, lint]
    if: inputs.extra-commands-job && inputs.extra-commands != '' && needs.tier.outputs.checks == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.tier.outputs.os) }}
        node-version: ${{ fromJSON(inputs.node-versions || '[""]') }}
    defaults:
      run:
        shell: bash
    concurrency:
      group: ci-node-extra-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ matrix.node-version }}-${{ matrix.os }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      ANTELOPEJS_CI_TIER: ${{ needs.tier.outputs.tier }}
      ANTELOPEJS_TEST_BASE: ${{ needs.tier.outputs.test-base }}
      START_SERVICES: ${{ inputs.services-compose-file != '' && matrix.os != 'windows-latest' }}
    steps:
      - name: Use LF line endings, symlinks and Git Bash for package scripts
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
          bash_path=$(cygpath -w /usr/bin/bash)
          echo "npm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
          echo "pnpm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Fetch pull request base
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          credentials=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 --wrap=0)
          echo "::add-mask::${credentials}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${credentials}" \
            fetch --quiet --no-tags --depth=1 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      - name: Start services in the background
        if: env.START_SERVICES == 'true'
        env:
          SERVICES_COMPOSE_FILE: ${{ inputs.services-compose-file }}
        run: |
          FILE=$(realpath -e -- "$SERVICES_COMPOSE_FILE")
          WORKSPACE=$(realpath -e -- "$GITHUB_WORKSPACE")
          if [[ "$FILE" != "$WORKSPACE/"* || ! -f "$FILE" ]]; then
            echo "::error::services-compose-file must resolve to a regular file inside GITHUB_WORKSPACE."
            exit 1
          fi
          nohup bash -c 'docker compose -f "$1" up -d --wait > "$2" 2>&1; echo "$?" > "$3"' _ \
            "$FILE" "$RUNNER_TEMP/services.log" "$RUNNER_TEMP/services.status" > /dev/null 2>&1 &

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          node-version-file: ${{ matrix.node-version == '' && '.nvmrc' || '' }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run setup commands
        if: inputs.setup-commands != ''
        env:
          SETUP_COMMANDS: ${{ inputs.setup-commands }}
        run: bash -euo pipefail -c "$SETUP_COMMANDS"

      - name: Restore cache
        if: inputs.cache-paths != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.cache-paths }}
          key: ci-node-extra-${{ runner.os }}-${{ matrix.node-version || 'nvmrc' }}-${{ hashFiles(inputs.cache-key-files) }}
          restore-keys: |
            ci-node-extra-${{ runner.os }}-${{ matrix.node-version || 'nvmrc' }}-

      - name: Restore cache again so links extracted before their target become directory links
        if: inputs.cache-paths != '' && runner.os == 'Windows'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.cache-paths }}
          key: ci-node-extra-${{ runner.os }}-${{ matrix.node-version || 'nvmrc' }}-${{ hashFiles(inputs.cache-key-files) }}
          restore-keys: |
            ci-node-extra-${{ runner.os }}-${{ matrix.node-version || 'nvmrc' }}-

      - name: Start services
        id: services
        if: env.START_SERVICES == 'true'
        run: |
          deadline=$((SECONDS + 900))
          until [ -s "$RUNNER_TEMP/services.status" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              cat "$RUNNER_TEMP/services.log"
              echo "::error::Services did not start within 15 minutes."
              exit 1
            fi
            sleep 0.2
          done
          cat "$RUNNER_TEMP/services.log"
          [ "$(cat "$RUNNER_TEMP/services.status")" = 0 ]

      - name: Run extra commands
        env:
          EXTRA_COMMANDS: ${{ inputs.extra-commands }}
        run: bash -euo pipefail -c "$EXTRA_COMMANDS"

      - name: Stop services
        if: always() && steps.services.outcome == 'success'
        env:
          FILE: ${{ inputs.services-compose-file }}
        run: docker compose -f "$FILE" down -v

  stress:
    name: Stress
    needs: [tier, lint]
    if: needs.tier.outputs.tier == 'nightly'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      ANTELOPEJS_CI_TIER: ${{ needs.tier.outputs.tier }}
      START_SERVICES: ${{ inputs.services-compose-file != '' }}
      STRESS_RUNS: 3
      STRESS_LOOPS_PER_CPU: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Start services in the background
        if: env.START_SERVICES == 'true'
        env:
          SERVICES_COMPOSE_FILE: ${{ inputs.services-compose-file }}
        run: |
          FILE=$(realpath -e -- "$SERVICES_COMPOSE_FILE")
          WORKSPACE=$(realpath -e -- "$GITHUB_WORKSPACE")
          if [[ "$FILE" != "$WORKSPACE/"* || ! -f "$FILE" ]]; then
            echo "::error::services-compose-file must resolve to a regular file inside GITHUB_WORKSPACE."
            exit 1
          fi
          nohup bash -c 'docker compose -f "$1" up -d --wait > "$2" 2>&1; echo "$?" > "$3"' _ \
            "$FILE" "$RUNNER_TEMP/services.log" "$RUNNER_TEMP/services.status" > /dev/null 2>&1 &

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ fromJSON(inputs.node-versions || '[""]')[0] }}
          node-version-file: ${{ fromJSON(inputs.node-versions || '[""]')[0] == '' && '.nvmrc' || '' }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run setup commands
        if: inputs.setup-commands != ''
        env:
          SETUP_COMMANDS: ${{ inputs.setup-commands }}
        run: bash -euo pipefail -c "$SETUP_COMMANDS"

      - name: Restore cache
        if: inputs.cache-paths != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.cache-paths }}
          key: ci-node-${{ runner.os }}-${{ fromJSON(inputs.node-versions || '[""]')[0] || 'nvmrc' }}-${{ hashFiles(inputs.cache-key-files) }}
          restore-keys: |
            ci-node-${{ runner.os }}-${{ fromJSON(inputs.node-versions || '[""]')[0] || 'nvmrc' }}-

      - name: Build what the tests read
        run: |
          pnpm run --if-present checks:prepare
          pnpm run typecheck

      - name: Start services
        id: services
        if: env.START_SERVICES == 'true'
        run: |
          deadline=$((SECONDS + 900))
          until [ -s "$RUNNER_TEMP/services.status" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              cat "$RUNNER_TEMP/services.log"
              echo "::error::Services did not start within 15 minutes."
              exit 1
            fi
            sleep 0.2
          done
          cat "$RUNNER_TEMP/services.log"
          [ "$(cat "$RUNNER_TEMP/services.status")" = 0 ]

      - name: Run the tests ${{ env.STRESS_RUNS }} times beside ${{ env.STRESS_LOOPS_PER_CPU }} busy loops per CPU
        env:
          CI: "1"
        run: |
          loops=$((STRESS_LOOPS_PER_CPU * $(nproc)))
          for _ in $(seq "$loops"); do
            (while :; do :; done) &
          done
          trap 'kill $(jobs -p) 2> /dev/null' EXIT
          failed=0
          for run in $(seq "$STRESS_RUNS"); do
            echo "::group::Run ${run} of ${STRESS_RUNS}"
            if ! pnpm run test; then
              failed=$((failed + 1))
              echo "::error::Run ${run} of ${STRESS_RUNS} of pnpm run test failed beside ${loops} busy loops."
            fi
            echo "::endgroup::"
          done
          echo "Stress: ${failed} of ${STRESS_RUNS} runs of \`pnpm run test\` failed beside ${loops} busy loops on $(nproc) CPUs" >> "$GITHUB_STEP_SUMMARY"
          [ "$failed" -eq 0 ]

      - name: Stop services
        if: always() && steps.services.outcome == 'success'
        env:
          FILE: ${{ inputs.services-compose-file }}
        run: docker compose -f "$FILE" down -v

  gitleaks:
    name: Gitleaks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks 8.30.1 from its checksummed release
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c --quiet -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan the pull request's commits, minus the fingerprints in .gitleaksignore
        run: |
          base=$(git rev-parse --verify HEAD^1)
          head=$(git rev-parse --verify HEAD^2)
          octopus=$(git rev-list --min-parents=3 "${base}..${head}")
          if [ -n "$octopus" ]; then
            echo "::error::The pull request has an octopus merge, whose changes git cannot show to gitleaks. Replace it with two-parent merges."
            exit 1
          fi
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose --exit-code 1 --log-opts="--remerge-diff ${base}..${head}" .

  checks:
    if: always()
    needs: [tier, lint, node, test, extra, stress, gitleaks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - if: needs.tier.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

      - if: needs.tier.outputs.tier == 'draft'
        run: |
          echo "::error::Draft pull request: only lint and typecheck ran. Mark it ready for review to run the tests."
          exit 1
