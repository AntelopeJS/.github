name: Node CI

on:
  workflow_call:
    inputs:
      node-versions:
        description: JSON array of Node.js versions; empty uses .nvmrc
        default: ""
        type: string
      docs-files:
        description: Newline-separated documentation files to check
        default: ""
        type: string
      docs-typescript-project:
        description: TypeScript project used by the documentation check
        default: ""
        type: string
      services-compose-file:
        description: Path to a docker compose file whose services must run during checks
        default: ""
        type: string
      cache-paths:
        description: Newline-separated paths to cache between runs; empty skips the cache step
        default: ""
        type: string
      cache-key-files:
        description: Newline-separated globs hashed into the cache key
        default: pnpm-lock.yaml
        type: string
      setup-commands:
        description: Multiline shell commands to run after the root pnpm install, before checks, tests and extra-commands
        default: ""
        type: string
      extra-commands:
        description: Multiline shell commands to run after checks
        default: ""
        type: string
      renovate-sync:
        description: Accepted and ignored; every caller passes false and runs the Renovate sync from its own job calling ci-renovate-sync.yml
        default: false
        type: boolean
      test-job:
        description: "Accepted and ignored: tests run as a step of the single job, or in a job of their own with single-job false"
        default: false
        type: boolean
      single-job:
        description: Run checks and tests in one job per runner; a caller whose tests take minutes passes false to run them in a job of their own. Compose services always use separate jobs
        default: true
        type: boolean
      extra-commands-job:
        description: Run extra-commands in their own job, in parallel with the other checks
        default: false
        type: boolean
      extra-commands-shards:
        description: With extra-commands-job, split the extra-commands job into this many jobs, each with ANTELOPEJS_CI_SHARD set to its shard, such as 2/3, for the commands to pick their share of the work
        default: 1
        type: number
      windows:
        description: Also run the node jobs on Windows, in parallel with Linux, in the nightly tier, and in the merge queue and manual runs with windows-merge-queue, only when the calling repository is public; private and internal repositories skip Windows. Callers that cannot run on Windows pass false and say why. Run steps and package scripts use Git Bash there, git checks out with core.autocrlf false and core.symlinks true, and the docker compose services and skill evals are skipped, so tests that need the services must not run on Windows
        default: true
        type: boolean
      windows-merge-queue:
        description: With windows, also run the Windows jobs in the merge queue and on manual runs, not only in the nightly tier
        default: false
        type: boolean
      windows-pull-requests:
        description: Accepted; the former name of windows-merge-queue, same effect
        default: false
        type: boolean
      module-locks:
        description: Fail a leg whose install or tests wrote an antelope-lock/ file that is not committed; on a Renovate pull request, upload what it wrote for module-locks-renovate.yml
        default: false
        type: boolean
      affected-tests:
        description: "In the fast tier, run only the tests the pull request can affect: in a pnpm workspace, the test script of each package changed since the diff base and of its dependents, or the whole test script when a file outside the packages changes; in a single package whose test script is one vitest or jest command, that command with its changed-file option; otherwise the whole test script"
        default: false
        type: boolean
      nightly:
        description: On a workflow_dispatch run, run the nightly tier instead of full, with the Windows jobs and Stress, so a fix to a nightly failure can be proven on a branch; the caller forwards the nightly input of its own workflow_dispatch trigger
        default: false
        type: boolean
      formal-checks:
        description: 'JSON array of the formal checks to run, one Formal job each, such as [{"skill": "formal-billing-lease", "paths": ["src/engine.ts"]}]. skill names the folder under .agents/skills, whose check.mjs runs unless run gives the commands. paths lists the git pathspecs the check models: a pull request in the fast tier runs the check only when they or the skill folder changed, and every other tier runs it. Empty runs none'
        default: ""
        type: string
    secrets:
      NOTION_TOKEN:
        description: Deprecated and ignored; kept only because callers still pass it and a reusable workflow rejects a secret it does not declare
        required: false

concurrency:
  group: ci-node-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The three small jobs (windows, shards, gate) run a few seconds of shell and no install. They go to the
  # caller's RUNNER_CI_SMALL label when that variable names one, else to RUNNER_CI like the Node legs, else to
  # Blacksmith's 4 vCPU Ubuntu 24.04 runner. Set the variables per repository.
  windows:
    name: Windows eligibility
    if: inputs.windows && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.nightly) || ((github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch') && (inputs.windows-merge-queue || inputs.windows-pull-requests)))
    runs-on: ${{ vars.RUNNER_CI_SMALL || vars.RUNNER_CI || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      visibility: ${{ steps.visibility.outputs.visibility }}
    steps:
      - name: Read the repository visibility
        id: visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          visibility=$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)
          echo "visibility=$visibility" >> "$GITHUB_OUTPUT"

  shards:
    name: Extra shards
    if: inputs.extra-commands-job && inputs.extra-commands != '' && inputs.extra-commands-shards > 1
    runs-on: ${{ vars.RUNNER_CI_SMALL || vars.RUNNER_CI || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    permissions: {}
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
      exclude: ${{ steps.shards.outputs.exclude }}
    steps:
      - name: List the extra-commands shards
        id: shards
        env:
          SHARDS: ${{ inputs.extra-commands-shards }}
        run: |
          if [[ ! "$SHARDS" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::extra-commands-shards must be a whole number, not ${SHARDS}."
            exit 1
          fi
          shards='""' exclude='{"part":"extra","shard":""}'
          for ((i = 1; i <= SHARDS; i++)); do
            shards+=",\"$i/$SHARDS\""
            for part in all checks test; do
              exclude+=",{\"part\":\"$part\",\"shard\":\"$i/$SHARDS\"}"
            done
          done
          {
            echo "shards=[$shards]"
            echo "exclude=[$exclude]"
          } >> "$GITHUB_OUTPUT"

  node:
    needs: [windows, shards]
    if: ${{ !cancelled() && needs.windows.result != 'failure' && needs.shards.result != 'failure' }}
    name: ${{ needs.windows.result == 'skipped' && inputs.single-job && (inputs.formal-checks == '' || inputs.formal-checks == '[]') && inputs.services-compose-file == '' && !(inputs.extra-commands-job && inputs.extra-commands != '') && !fromJSON(inputs.node-versions || '[""]')[1] && github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.nightly) && 'checks' || format('{0} {1}{2}{3}', matrix.part == 'test' && 'Test' || matrix.part == 'extra' && 'Extra' || 'Node', matrix.node-version || '.nvmrc', matrix.shard && format(' {0}', matrix.shard) || '', matrix.os == 'windows-latest' && ' on Windows' || '') }}
    # Linux legs on Blacksmith's 4 vCPU Ubuntu 24.04 runner, Windows legs on its 4 vCPU Windows Server 2025
    # runner, unless the CALLING repository's variable RUNNER_CI (Linux) or RUNNER_CI_WINDOWS (Windows) names
    # another label. Windows legs run only for a calling repository the API reports public, and a schedule
    # payload carries no repository to read it from.
    runs-on: ${{ matrix.os == 'ubuntu-latest' && (vars.RUNNER_CI || 'blacksmith-4vcpu-ubuntu-2404') || vars.RUNNER_CI_WINDOWS || 'blacksmith-4vcpu-windows-2025' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.windows.outputs.visibility == 'public' && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest"]') }}
        node-version: ${{ fromJSON(inputs.node-versions || '[""]') }}
        part: ${{ fromJSON(format('[{0}{1}]', inputs.single-job && inputs.services-compose-file == '' && '"all"' || '"checks","test"', inputs.extra-commands-job && inputs.extra-commands != '' && ',"extra"' || '')) }}
        shard: ${{ fromJSON(needs.shards.outputs.shards || '[""]') }}
        exclude: ${{ fromJSON(needs.shards.outputs.exclude || '[]') }}
    defaults:
      run:
        shell: bash
    outputs:
      tier: ${{ steps.leg.outputs.tier }}
    env:
      LANG: ${{ matrix.os == 'ubuntu-latest' && 'C.UTF-8' || '' }}
      TERM: ${{ matrix.os == 'ubuntu-latest' && 'xterm-256color' || '' }}
      PRIMARY_LEG: ${{ matrix.os == 'ubuntu-latest' && matrix.node-version == fromJSON(inputs.node-versions || '[""]')[0] }}
      START_SERVICES: ${{ inputs.services-compose-file != '' && matrix.os != 'windows-latest' && (matrix.part == 'test' || matrix.part == 'extra' || (matrix.part == 'checks' && inputs.extra-commands != '' && !inputs.extra-commands-job)) }}
      CACHE_PREFIX: ${{ matrix.part == 'extra' && 'ci-node-extra' || 'ci-node' }}
    steps:
      - name: Use LF line endings, symlinks and Git Bash for package scripts
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
          bash_path=$(cygpath -w /usr/bin/bash)
          echo "npm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
          echo "pnpm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Pick the tier
        id: tier
        uses: AntelopeJS/.github/.github/actions/ci-tier@v2
        with:
          selection: ${{ vars.CI_SELECTION }}

      - name: Pick the work of this leg from the tier
        id: leg
        env:
          TIER: ${{ steps.tier.outputs.tier }}
          BASE: ${{ steps.tier.outputs.base }}
          PART: ${{ matrix.part }}
          EVENT: ${{ github.event_name }}
          NIGHTLY: ${{ inputs.nightly }}
        run: |
          if [[ "$EVENT" == workflow_dispatch && "$NIGHTLY" == true ]]; then
            TIER=nightly
          fi
          tests=true test_base=""
          case "$TIER" in
            none) tests=false ;;
            fast)
              test_base="$BASE"
              tests=false
              changed=$(git -c core.quotepath=off diff --name-only --no-renames "$BASE" HEAD)
              while IFS= read -r file; do
                case "$file" in
                  packages/*/playground/checks/*) tests=true ;;
                  "" | README.md | docs/* | docs-data/examples.json | packages/*/README.md | packages/*/docs/* | packages/*/docs-data/examples.json | packages/dms/playground/*) ;;
                  *) tests=true ;;
                esac
              done <<< "$changed"
              ;;
          esac
          work=true
          if [[ "$TIER" == none || ( "$PART" == test && "$tests" == false ) ]]; then
            work=false
          fi

          {
            echo "ANTELOPEJS_CI_TIER=${TIER}"
            echo "ANTELOPEJS_TEST_BASE=${test_base}"
          } >> "$GITHUB_ENV"
          {
            echo "tier=${TIER}"
            echo "tests=${tests}"
            echo "work=${work}"
          } >> "$GITHUB_OUTPUT"
          if [[ "$PRIMARY_LEG" == true ]]; then
            echo "Tier \`${TIER}\`: tests ${tests}, test base ${test_base:-none}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fetch the base branch
        if: steps.leg.outputs.work == 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref }}
        run: |
          branch="${BASE_REF#refs/heads/}"
          credentials=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 --wrap=0)
          echo "::add-mask::${credentials}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${credentials}" \
            fetch --quiet --no-tags --depth=1 origin "+refs/heads/${branch}:refs/remotes/origin/${branch}"

      - name: Start services in the background
        if: steps.leg.outputs.work == 'true' && env.START_SERVICES == 'true'
        env:
          SERVICES_COMPOSE_FILE: ${{ inputs.services-compose-file }}
        run: |
          FILE=$(realpath -e -- "$SERVICES_COMPOSE_FILE")
          WORKSPACE=$(realpath -e -- "$GITHUB_WORKSPACE")
          if [[ "$FILE" != "$WORKSPACE/"* || ! -f "$FILE" ]]; then
            echo "::error::services-compose-file must resolve to a regular file inside GITHUB_WORKSPACE."
            exit 1
          fi
          nohup bash -c 'docker compose -f "$1" up -d --wait > "$2" 2>&1; echo "$?" > "$3"' _ \
            "$FILE" "$RUNNER_TEMP/services.log" "$RUNNER_TEMP/services.status" > /dev/null 2>&1 &

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.leg.outputs.work == 'true'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.leg.outputs.work == 'true'
        with:
          node-version: ${{ matrix.node-version }}
          node-version-file: ${{ matrix.node-version == '' && '.nvmrc' || '' }}
          cache: pnpm

      - name: Install dependencies
        if: steps.leg.outputs.work == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run setup commands
        if: steps.leg.outputs.work == 'true' && inputs.setup-commands != ''
        env:
          SETUP_COMMANDS: ${{ inputs.setup-commands }}
        run: bash -euo pipefail -c "$SETUP_COMMANDS"

      - name: Restore cache
        if: steps.leg.outputs.work == 'true' && inputs.cache-paths != '' && matrix.part != 'checks'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.cache-paths }}
          key: ${{ env.CACHE_PREFIX }}-${{ runner.os }}-${{ matrix.node-version || 'nvmrc' }}-${{ hashFiles(inputs.cache-key-files) }}
          restore-keys: |
            ${{ env.CACHE_PREFIX }}-${{ runner.os }}-${{ matrix.node-version || 'nvmrc' }}-

      - name: Restore cache again so links extracted before their target become directory links
        if: steps.leg.outputs.work == 'true' && inputs.cache-paths != '' && matrix.part != 'checks' && runner.os == 'Windows'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.cache-paths }}
          key: ${{ env.CACHE_PREFIX }}-${{ runner.os }}-${{ matrix.node-version || 'nvmrc' }}-${{ hashFiles(inputs.cache-key-files) }}
          restore-keys: |
            ${{ env.CACHE_PREFIX }}-${{ runner.os }}-${{ matrix.node-version || 'nvmrc' }}-

      - name: Check documentation
        if: steps.leg.outputs.work == 'true' && inputs.docs-files != '' && (matrix.part == 'all' || matrix.part == 'checks')
        uses: AntelopeJS/tooling-configs/actions/docs@e31be133d368451dd440fbd0b87b94e436998d36 # v0.10.7 + #419, #422 (0.8.3-next.390.g0071b4b)
        with:
          files: ${{ inputs.docs-files }}
          typescript-project: ${{ inputs.docs-typescript-project }}

      - name: Start services
        id: services
        if: steps.leg.outputs.work == 'true' && env.START_SERVICES == 'true'
        run: |
          deadline=$((SECONDS + 900))
          until [ -s "$RUNNER_TEMP/services.status" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              cat "$RUNNER_TEMP/services.log"
              echo "::error::Services did not start within 15 minutes."
              exit 1
            fi
            sleep 0.2
          done
          cat "$RUNNER_TEMP/services.log"
          [ "$(cat "$RUNNER_TEMP/services.status")" = 0 ]

      - name: Run checks
        if: steps.leg.outputs.work == 'true' && (matrix.part == 'all' || matrix.part == 'checks')
        env:
          ANTELOPEJS_CHECKS_SKIP: ${{ env.PRIMARY_LEG == 'true' && 'test' || 'test,lint,typecheck' }}
        run: pnpm run checks

      - name: Skill eval, offline
        if: steps.leg.outputs.work == 'true' && env.PRIMARY_LEG == 'true' && (matrix.part == 'all' || matrix.part == 'checks')
        env:
          ANTELOPEJS_DIFF_BASE: ${{ steps.tier.outputs.base }}
        run: |
          mapfile -t dirs < <(git ls-files ':(glob)package.json' ':(glob)**/package.json' | node -e 'const fs = require("fs"); const path = require("path"); for (const file of fs.readFileSync(0, "utf8").split("\n").filter(Boolean)) { const skills = JSON.parse(fs.readFileSync(file, "utf8")).antelopeJs?.skills; for (const dir of Array.isArray(skills) ? skills : []) console.log(path.posix.join(path.posix.dirname(file), dir)); }')
          if [ "${#dirs[@]}" -eq 0 ]; then
            exit 0
          fi
          if [ -z "$(git diff --name-only "${ANTELOPEJS_DIFF_BASE:-HEAD^1}" HEAD -- "${dirs[@]}")" ]; then
            exit 0
          fi
          args=()
          for dir in "${dirs[@]}"; do
            args+=(--skills "$dir")
          done
          cli="github:AntelopeJS/agent-skills#main"
          npx -y "$cli" evals check "${args[@]}"
          npx -y "$cli" evals --published "${args[@]}" --min-recall 0.5 --min-precision 0.5

      - name: Run tests
        id: tests
        if: steps.leg.outputs.work == 'true' && steps.leg.outputs.tests == 'true' && (matrix.part == 'all' || matrix.part == 'test')
        env:
          CI: "1"
          AFFECTED_TESTS: ${{ inputs.affected-tests }}
        run: |
          log="$RUNNER_TEMP/test-attempt-1.log"
          command=(pnpm run test)
          if [[ "$AFFECTED_TESTS" == true && "$ANTELOPEJS_CI_TIER" == fast ]]; then
            filter="...[$ANTELOPEJS_TEST_BASE]"
            if [[ "$(pnpm ls -r --depth -1 --json | jq length)" -gt 1 ]]; then
              selected="$(pnpm --filter "$filter" --include-workspace-root ls --depth -1 --json)"
              if ! jq -e --arg root "$(pwd -P)" 'any(.[]; .path == $root)' <<< "${selected:-[]}" > /dev/null; then
                command=(pnpm --filter "$filter" --workspace-concurrency=1 run test)
              fi
            else
              declare -A changed_option=([vitest]="--changed=$ANTELOPEJS_TEST_BASE" [jest]="--changedSince=$ANTELOPEJS_TEST_BASE")
              single_runner='^(vitest|jest)( [^;&|<>()$`]*)?$'
              test_script="$(jq -r '.scripts.test // ""' package.json)"
              if [[ "$test_script" =~ $single_runner ]]; then
                command+=("${changed_option[${BASH_REMATCH[1]}]}")
              fi
            fi
            if [[ "$PRIMARY_LEG" == true ]]; then
              echo "Tests: \`${command[*]}\`" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          if "${command[@]}" 2>&1 | tee "$log"; then
            exit 0
          fi
          if [ "$ANTELOPEJS_CI_TIER" != queue ]; then
            exit 1
          fi
          echo "::warning::pnpm run test failed in the merge queue. It runs once more: a pass marks a flaky test, a second failure fails the job."
          "${command[@]}"
          echo "flaky=true" >> "$GITHUB_OUTPUT"

      - name: Run extra commands
        id: extra
        if: steps.leg.outputs.work == 'true' && inputs.extra-commands != '' && (matrix.part == 'extra' || (!inputs.extra-commands-job && (matrix.part == 'all' || matrix.part == 'checks')))
        env:
          EXTRA_COMMANDS: ${{ inputs.extra-commands }}
          ANTELOPEJS_CI_SHARD: ${{ matrix.shard }}
        run: |
          [ -n "$ANTELOPEJS_CI_SHARD" ] || unset ANTELOPEJS_CI_SHARD
          if [ "$ANTELOPEJS_CI_TIER" != queue ]; then
            exec bash -euo pipefail -c "$EXTRA_COMMANDS"
          fi
          log="$RUNNER_TEMP/extra-attempt-1.log"
          if bash -euo pipefail -c "$EXTRA_COMMANDS" 2>&1 | tee "$log"; then
            exit 0
          fi
          echo "::warning::extra-commands failed in the merge queue. They run once more: a pass marks a flaky test, a second failure fails the job."
          bash -euo pipefail -c "$EXTRA_COMMANDS"
          echo "flaky=true" >> "$GITHUB_OUTPUT"

      - name: Check that the module locks are committed
        if: ${{ !cancelled() && steps.leg.outputs.work == 'true' && inputs.module-locks }}
        uses: AntelopeJS/.github/.github/actions/module-locks-committed@v2

      - name: Annotate the flaky tests
        if: ${{ !cancelled() && (steps.tests.outputs.flaky == 'true' || steps.extra.outputs.flaky == 'true') }}
        continue-on-error: true
        env:
          GH_REPO: ${{ github.repository }}
          TESTS_FLAKY: ${{ steps.tests.outputs.flaky }}
          EXTRA_FLAKY: ${{ steps.extra.outputs.flaky }}
        run: |
          node --input-type=module - <<'JS'
          import { appendFileSync, readFileSync } from "node:fs";
          import { isAbsolute, join, relative, sep } from "node:path";
          import { fileURLToPath } from "node:url";

          const MAX_ANNOTATIONS = 10;
          const DURATION = / \([\d.]+m?s\)$/;
          const MOCHA_TALLY = /^\s*(\d+) (passing|failing|pending)\b/;

          const SOURCES = [
            { flaky: process.env.TESTS_FLAKY, log: "test-attempt-1.log", fallback: "pnpm run test" },
            { flaky: process.env.EXTRA_FLAKY, log: "extra-attempt-1.log", fallback: "extra-commands" },
          ];

          const locate = (raw) => {
            const path = raw.startsWith("file://") ? fileURLToPath(raw) : raw;
            return (isAbsolute(path) ? relative(process.cwd(), path) : path).split(sep).join("/");
          };
          const isTestFile = (path) => !path.includes("node_modules") && /(^|\/)(tests?|__tests__|specs?)\/|\.(test|spec)\.\w+$/.test(path);

          const parse = (text, fallback) => {
            const lines = text.replace(/\u001b\[[0-9;?]*[ -\/]*[@-~]/g, "").split(/\r?\n/);

            const vitest = () =>
              lines.flatMap((line) => {
                const match = /^\s*FAIL\s+(?:\|[^|]*\|\s+)?(.+?)(?: > (.+?)| \[ .+ \])\s*$/.exec(line);
                return match ? [{ where: match[1], name: match[2] }] : [];
              });

            const jest = () => {
              const entries = [];
              let file;
              for (const line of lines) {
                const verdict = /^\s*(FAIL|PASS)\s+(?:\S+\s+)?(\S+)(?:\s+\([\d.]+ m?s\))?\s*$/.exec(line);
                if (verdict) file = verdict[1] === "FAIL" ? verdict[2] : undefined;
                const bullet = /^ {2}● (\S.*?)\s*$/.exec(line);
                if (!bullet || !file || bullet[1].startsWith("Console")) continue;
                entries.push(bullet[1] === "Test suite failed to run" ? { where: file } : { where: file, name: bullet[1].split(" › ").join(" > ") });
              }
              return entries;
            };

            const mochaFailure = (from, to) => {
              const titles = [lines[from].replace(/^ {2}\d+\) /, "")];
              for (let next = from + 1; next < to && lines[next].length - lines[next].trimStart().length === 5 + 2 * titles.length && lines[next].trim(); next += 1) titles.push(lines[next].trim());
              const files = lines.slice(from, to).flatMap((line) => {
                const location = /Timeout of \d+ms exceeded.*\(([^()]+)\)\s*$/.exec(line) ?? /^\s+at .*?\(?([^\s()]+):\d+:\d+\)?$/.exec(line);
                return location ? [locate(location[1])] : [];
              });
              return { where: files.find(isTestFile) ?? fallback, name: titles.join(" > ").replace(/:$/, "") };
            };

            const mocha = () =>
              lines.flatMap((line, start) => {
                const tally = MOCHA_TALLY.exec(line);
                if (tally?.[2] !== "failing") return [];
                const end = lines.findIndex((candidate, index) => index > start && MOCHA_TALLY.test(candidate));
                const stop = end === -1 ? lines.length : end;
                const heads = [];
                for (let index = start + 1; index < stop && heads.length < Number(tally[1]); index += 1) {
                  if (lines[index].startsWith(`  ${heads.length + 1}) `)) heads.push(index);
                }
                return heads.map((head, position) => mochaFailure(head, heads[position + 1] ?? stop));
              });

            const nodeTest = () => {
              const end = lines.findIndex((line) => /^ℹ tests \d+/.test(line));
              const leaves = [];
              const open = [];
              for (const line of lines.slice(0, end === -1 ? undefined : end)) {
                const mark = /^(\s*)([▶✔✖﹣]) (.+?)(?: # .*)?$/.exec(line);
                if (!mark) continue;
                const [, pad, symbol, title] = mark;
                const name = title.replace(DURATION, "");
                if (symbol === "▶") open.push({ depth: pad.length, name });
                else if (open.at(-1)?.depth === pad.length && open.at(-1).name === name) open.pop();
                else if (symbol === "✖") leaves.push({ name, title: [...open.map((suite) => suite.name), name].join(" > ") });
              }
              const entries = [];
              const failing = lines.findIndex((line) => /^✖ failing tests:\s*$/.test(line));
              for (let index = failing + 1; failing !== -1 && index < lines.length; index += 1) {
                const location = /^test at (.+):\d+:\d+$/.exec(lines[index]);
                const failed = location && /^✖ (.+)$/.exec(lines[index + 1] ?? "");
                if (!failed) continue;
                const where = locate(location[1]);
                const name = failed[1].replace(DURATION, "");
                const leaf = leaves.find((candidate) => candidate.name === name);
                if (leaf) leaves.splice(leaves.indexOf(leaf), 1);
                entries.push(locate(name) === where ? { where } : { where, name: leaf?.title ?? name });
              }
              return entries;
            };

            return Object.values({ vitest, jest, mocha, nodeTest }).flatMap((parser) => parser());
          };

          const distinct = (entries) => [...new Map(entries.map((entry) => [JSON.stringify(entry), entry])).values()];
          const named = (entries, fallback) => (entries.length === 0 ? [{ where: fallback }] : entries);
          const levels = [
            named,
            (entries, fallback) => named(entries, fallback).map(({ where }) => ({ where })),
            (_entries, fallback) => [{ where: fallback }],
          ];

          const sources = SOURCES.filter(({ flaky }) => flaky === "true").map(({ log, fallback }) => {
            const text = readFileSync(join(process.env.RUNNER_TEMP, log), "utf8");
            try {
              return { fallback, entries: distinct(parse(text, fallback)) };
            } catch {
              return { fallback, entries: [] };
            }
          });
          const annotations = levels
            .map((level) => distinct(sources.flatMap(({ entries, fallback }) => level(entries, fallback))))
            .find((candidate) => candidate.length <= MAX_ANNOTATIONS);

          const escape = (message) => message.replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A");
          const messages = annotations.map(({ where, name }) => `${process.env.GH_REPO}: ${name === undefined ? where : `${where} > ${name}`} passed only on its merge-queue retry.`);
          for (const message of messages) console.log(`::warning title=Flaky test::${escape(message)}`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, messages.map((message) => `- Flaky test: \`\` ${message} \`\`\n`).join(""));
          JS

      - name: Stop services
        if: always() && steps.services.outcome == 'success'
        env:
          FILE: ${{ inputs.services-compose-file }}
        run: docker compose -f "$FILE" down -v

      - name: Check pull request title
        if: ${{ !cancelled() && github.event_name == 'pull_request' && env.PRIMARY_LEG == 'true' && (matrix.part == 'all' || matrix.part == 'checks') }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|refactor|perf|revert|docs|test|build|ci|chore)(\([^)]+\))?!?: .+'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "::error::PR title must use Conventional Commits: type(scope): description, with an optional scope and ! for breaking changes. Allowed types: feat, fix, refactor, perf, revert, docs, test, build, ci, chore."
            exit 1
          fi

  stress:
    name: Stress
    needs: node
    if: ${{ !cancelled() && needs.node.outputs.tier == 'nightly' }}
    runs-on: ${{ vars.RUNNER_CI || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 120
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      LANG: C.UTF-8
      TERM: xterm-256color
      ANTELOPEJS_CI_TIER: nightly
      START_SERVICES: ${{ inputs.services-compose-file != '' }}
      STRESS_RUNS: 3
      STRESS_LOOPS_PER_CPU: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Start services in the background
        if: env.START_SERVICES == 'true'
        env:
          SERVICES_COMPOSE_FILE: ${{ inputs.services-compose-file }}
        run: |
          FILE=$(realpath -e -- "$SERVICES_COMPOSE_FILE")
          WORKSPACE=$(realpath -e -- "$GITHUB_WORKSPACE")
          if [[ "$FILE" != "$WORKSPACE/"* || ! -f "$FILE" ]]; then
            echo "::error::services-compose-file must resolve to a regular file inside GITHUB_WORKSPACE."
            exit 1
          fi
          nohup bash -c 'docker compose -f "$1" up -d --wait > "$2" 2>&1; echo "$?" > "$3"' _ \
            "$FILE" "$RUNNER_TEMP/services.log" "$RUNNER_TEMP/services.status" > /dev/null 2>&1 &

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ fromJSON(inputs.node-versions || '[""]')[0] }}
          node-version-file: ${{ fromJSON(inputs.node-versions || '[""]')[0] == '' && '.nvmrc' || '' }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run setup commands
        if: inputs.setup-commands != ''
        env:
          SETUP_COMMANDS: ${{ inputs.setup-commands }}
        run: bash -euo pipefail -c "$SETUP_COMMANDS"

      - name: Restore cache
        if: inputs.cache-paths != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.cache-paths }}
          key: ci-node-${{ runner.os }}-${{ fromJSON(inputs.node-versions || '[""]')[0] || 'nvmrc' }}-${{ hashFiles(inputs.cache-key-files) }}
          restore-keys: |
            ci-node-${{ runner.os }}-${{ fromJSON(inputs.node-versions || '[""]')[0] || 'nvmrc' }}-

      - name: Build what the tests read
        run: |
          pnpm run --if-present checks:prepare
          pnpm run --if-present typecheck

      - name: Start services
        id: services
        if: env.START_SERVICES == 'true'
        run: |
          deadline=$((SECONDS + 900))
          until [ -s "$RUNNER_TEMP/services.status" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              cat "$RUNNER_TEMP/services.log"
              echo "::error::Services did not start within 15 minutes."
              exit 1
            fi
            sleep 0.2
          done
          cat "$RUNNER_TEMP/services.log"
          [ "$(cat "$RUNNER_TEMP/services.status")" = 0 ]

      - name: Run the tests ${{ env.STRESS_RUNS }} times beside ${{ env.STRESS_LOOPS_PER_CPU }} busy loops per CPU
        env:
          CI: "1"
        run: |
          cpus=$(nproc)
          quota=max
          if [ -r /sys/fs/cgroup/cpu.max ]; then
            read -r quota period < /sys/fs/cgroup/cpu.max
          elif [ -r /sys/fs/cgroup/cpu/cpu.cfs_quota_us ]; then
            quota=$(cat /sys/fs/cgroup/cpu/cpu.cfs_quota_us)
            period=$(cat /sys/fs/cgroup/cpu/cpu.cfs_period_us)
          fi
          if [[ "$quota" =~ ^[0-9]+$ && "$quota" -gt 0 ]]; then
            quota_cpus=$(((quota + period - 1) / period))
            if [ "$quota_cpus" -lt "$cpus" ]; then cpus=$quota_cpus; fi
          fi
          loops=$((STRESS_LOOPS_PER_CPU * cpus))
          echo "Stress: ${loops} busy loops on ${cpus} CPUs (nproc $(nproc), CPU quota ${quota} per ${period:-none})"
          for _ in $(seq "$loops"); do
            (while :; do :; done) &
          done
          trap 'kill $(jobs -p) 2> /dev/null' EXIT
          failed=0
          for run in $(seq "$STRESS_RUNS"); do
            echo "::group::Run ${run} of ${STRESS_RUNS}"
            if ! pnpm run test; then
              failed=$((failed + 1))
              echo "::error::Run ${run} of ${STRESS_RUNS} of pnpm run test failed beside ${loops} busy loops."
            fi
            echo "::endgroup::"
          done
          echo "Stress: ${failed} of ${STRESS_RUNS} runs of \`pnpm run test\` failed beside ${loops} busy loops on ${cpus} CPUs" >> "$GITHUB_STEP_SUMMARY"
          [ "$failed" -eq 0 ]

      - name: Stop services
        if: always() && steps.services.outcome == 'success'
        env:
          FILE: ${{ inputs.services-compose-file }}
        run: docker compose -f "$FILE" down -v

  formal:
    name: Formal ${{ matrix.skill }}
    if: inputs.formal-checks != ''
    runs-on: ${{ vars.RUNNER_CI || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.formal-checks) }}
    defaults:
      run:
        shell: bash
    env:
      LANG: C.UTF-8
      TERM: xterm-256color
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Pick the tier
        id: tier
        uses: AntelopeJS/.github/.github/actions/ci-tier@v2
        with:
          selection: ${{ vars.CI_SELECTION }}

      - name: Pick the work of this check from the tier and the files it models
        id: check
        env:
          TIER: ${{ steps.tier.outputs.tier }}
          BASE: ${{ steps.tier.outputs.base }}
          SKILL: ${{ matrix.skill }}
          PATHS: ${{ toJSON(matrix.paths) }}
        run: |
          if [[ ! "$SKILL" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::Each formal-checks entry needs a skill, the name of a folder under .agents/skills, not '${SKILL}'."
            exit 1
          fi
          if ! specs=$(jq -r 'if . == null then empty elif type == "array" and length > 0 and all(type == "string") then .[] else error("") end' <<< "$PATHS" 2> /dev/null); then
            echo "::error::The paths of formal check ${SKILL} must be a non-empty list of git pathspecs."
            exit 1
          fi
          work=true
          if [[ "$TIER" == none ]]; then
            work=false
          elif [[ "$TIER" == fast && -n "$specs" ]]; then
            mapfile -t pathspecs <<< "$specs"
            changed=$(git -c core.quotepath=off diff --name-only --no-renames "$BASE" HEAD -- ".agents/skills/${SKILL}" "${pathspecs[@]}")
            if [[ -z "$changed" ]]; then
              work=false
              echo "\`${SKILL}\`: skipped, the pull request changes no file it models" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "work=${work}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.check.outputs.work == 'true'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.check.outputs.work == 'true'
        with:
          node-version: ${{ fromJSON(inputs.node-versions || '[""]')[0] }}
          node-version-file: ${{ fromJSON(inputs.node-versions || '[""]')[0] == '' && '.nvmrc' || '' }}
          cache: pnpm

      - name: Install dependencies
        if: steps.check.outputs.work == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        if: steps.check.outputs.work == 'true'
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore the model checker
        if: steps.check.outputs.work == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/antelopejs-formal
          key: antelopejs-formal-${{ runner.os }}-${{ matrix.skill }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            antelopejs-formal-${{ runner.os }}-

      - name: Run the formal check
        if: steps.check.outputs.work == 'true'
        env:
          SKILL: ${{ matrix.skill }}
          COMMANDS: ${{ matrix.run || format('node .agents/skills/{0}/check.mjs', matrix.skill) }}
        run: |
          start=$SECONDS
          status=0
          bash -euo pipefail -c "$COMMANDS" || status=$?
          echo "\`${SKILL}\`: exit ${status} in $((SECONDS - start)) s" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  gate:
    name: ${{ needs.windows.result == 'skipped' && inputs.single-job && (inputs.formal-checks == '' || inputs.formal-checks == '[]') && inputs.services-compose-file == '' && !(inputs.extra-commands-job && inputs.extra-commands != '') && !fromJSON(inputs.node-versions || '[""]')[1] && github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.nightly) && 'gate' || 'checks' }}
    if: ${{ !cancelled() && !(needs.windows.result == 'skipped' && inputs.single-job && (inputs.formal-checks == '' || inputs.formal-checks == '[]') && inputs.services-compose-file == '' && !(inputs.extra-commands-job && inputs.extra-commands != '') && !fromJSON(inputs.node-versions || '[""]')[1] && github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.nightly)) }}
    needs: [windows, shards, node, stress, formal]
    runs-on: ${{ vars.RUNNER_CI_SMALL || vars.RUNNER_CI || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    permissions: {}
    defaults:
      run:
        shell: bash
    steps:
      - name: Fail when a job failed, was cancelled or did not run
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || needs.node.result != 'success' || (needs.node.outputs.tier == 'nightly' && needs.stress.result != 'success')
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | "\(.key): \(.value.result)"' <<< "$NEEDS"
          tier=$(jq -r '.node.outputs.tier // ""' <<< "$NEEDS")
          echo "::error::Tier ${tier:-unknown}: node $(jq -r .node.result <<< "$NEEDS"), stress $(jq -r .stress.result <<< "$NEEDS")."
          exit 1
