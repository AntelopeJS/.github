name: Release public npm package

on:
  workflow_call:
    inputs:
      release-version:
        description: Stable version a workflow_dispatch run releases; a preview ignores it
        default: ""
        type: string
      release-commit:
        description: Commit SHA a workflow_dispatch run releases; the run fails when the branch moved past it
        default: ""
        type: string
      dependency-ranges:
        description: JSON object mapping each dependency name to the stable range that replaces its preview pin
        default: "{}"
        type: string
      install-core:
        description: Install the AntelopeJS CLI before releasing
        default: false
        type: boolean
      package-directory:
        description: Relative path to the package directory to release
        default: .
        type: string
      integration-branch:
        description: Unused. Kept so that a caller that passes it keeps working
        type: string
    secrets:
      RELEASE_APP_ID:
        description: ID of the GitHub App whose installation token creates the release commit, tag, and GitHub release
        required: false
      RELEASE_APP_PRIVATE_KEY:
        description: Private key of that GitHub App
        required: false

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/release-npm.yml
    with:
      registry: public
      release-version: ${{ inputs.release-version }}
      release-commit: ${{ inputs.release-commit }}
      dependency-ranges: ${{ inputs.dependency-ranges }}
      install-core: ${{ inputs.install-core }}
      package-directory: ${{ inputs.package-directory }}
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
