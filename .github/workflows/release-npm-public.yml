name: Release public npm package

on:
  workflow_call:
    inputs:
      channel:
        description: npm distribution channel
        required: true
        type: string
      install-core:
        description: Install the AntelopeJS CLI before releasing
        default: false
        type: boolean
      package-directory:
        description: Relative path to the package directory to release
        default: .
        type: string
    secrets:
      RELEASE_GITHUB_TOKEN:
        description: Token allowed to create the release commit, tag, and GitHub release
        required: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: npm-release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Validate release source and channel
        env:
          CHANNEL: ${{ inputs.channel }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" || {
            echo "Releases must run from the default branch ($DEFAULT_BRANCH)." >&2
            exit 1
          }
          case "$CHANNEL" in
            latest|next) ;;
            *) echo "Unsupported npm channel: $CHANNEL" >&2; exit 1 ;;
          esac

      - name: Validate release credential
        env:
          RELEASE_GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        run: |
          test -n "$RELEASE_GITHUB_TOKEN" || {
            echo "RELEASE_GITHUB_TOKEN is not configured." >&2
            exit 1
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate package directory
        env:
          PACKAGE_DIRECTORY: ${{ inputs.package-directory }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')

          const workspace = fs.realpathSync(process.env.GITHUB_WORKSPACE)
          const input = process.env.PACKAGE_DIRECTORY
          if (!input || path.isAbsolute(input)) {
            console.error('package-directory must be a relative directory inside the repository')
            process.exit(1)
          }

          const directory = path.resolve(workspace, input)
          const relativeDirectory = path.relative(workspace, directory)
          if (relativeDirectory === '..' || relativeDirectory.startsWith(`..${path.sep}`) || path.isAbsolute(relativeDirectory)) {
            console.error('package-directory must stay inside the repository')
            process.exit(1)
          }

          let realDirectory
          try {
            realDirectory = fs.realpathSync(directory)
          } catch {
            console.error(`package-directory does not exist: ${input}`)
            process.exit(1)
          }
          const realRelativeDirectory = path.relative(workspace, realDirectory)
          if (realRelativeDirectory === '..' || realRelativeDirectory.startsWith(`..${path.sep}`) || path.isAbsolute(realRelativeDirectory)) {
            console.error('package-directory must resolve inside the repository')
            process.exit(1)
          }
          if (!fs.statSync(realDirectory).isDirectory()) {
            console.error(`package-directory is not a directory: ${input}`)
            process.exit(1)
          }

          const packageJson = path.join(realDirectory, 'package.json')
          if (!fs.statSync(packageJson, { throwIfNoEntry: false })?.isFile()) {
            console.error(`package.json was not found in package-directory: ${input}`)
            process.exit(1)
          }
          NODE

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: ${{ inputs.package-directory }}/pnpm-lock.yaml

      - name: Validate package publication metadata
        working-directory: ${{ inputs.package-directory }}
        run: |
          node <<'NODE'
          const pkg = require('./package.json')
          const errors = []
          if (!pkg.name?.startsWith('@antelopejs/')) errors.push('name must use the @antelopejs scope')
          if (pkg.private === true) errors.push('private must not be true')
          if (pkg.license !== 'Apache-2.0') errors.push('license must be Apache-2.0')
          if (pkg.publishConfig?.access !== 'public') errors.push('publishConfig.access must be public')
          if (pkg.publishConfig?.provenance !== true) errors.push('publishConfig.provenance must be true')
          if (errors.length) {
            console.error(errors.join('\n'))
            process.exit(1)
          }
          NODE

      - name: Install dependencies
        working-directory: ${{ inputs.package-directory }}
        run: pnpm install --frozen-lockfile

      - name: Install AntelopeJS CLI
        if: inputs.install-core
        run: pnpm add --global @antelopejs/core

      - name: Configure release identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish release
        env:
          CHANNEL: ${{ inputs.channel }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        run: |
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
          trap 'git config --local --unset-all http.https://github.com/.extraheader || true' EXIT

          if [ "$CHANNEL" = latest ]; then
            pnpm release --ci
          else
            pnpm release --ci --preRelease=next
          fi
        working-directory: ${{ inputs.package-directory }}
