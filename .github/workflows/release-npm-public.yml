name: Release public npm package

on:
  workflow_call:
    inputs:
      release-version:
        description: Stable version a workflow_dispatch run releases; a preview ignores it
        default: ""
        type: string
      release-commit:
        description: Commit SHA a workflow_dispatch run releases; the run fails when the branch moved past it
        default: ""
        type: string
      dependency-ranges:
        description: JSON object mapping each dependency name to the stable range that replaces its preview pin
        default: "{}"
        type: string
      install-core:
        description: Install the AntelopeJS CLI before releasing
        default: false
        type: boolean
      package-directory:
        description: Relative path to the package directory to release
        default: .
        type: string
      integration-branch:
        description: Branch that receives the stable ranges a stable run writes, so that the Next sync merge does not conflict
        default: next
        type: string
    secrets:
      RELEASE_GITHUB_TOKEN:
        description: Token allowed to create the release commit, tag, and GitHub release
        required: false

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/release-npm.yml
    with:
      registry: public
      release-version: ${{ inputs.release-version }}
      release-commit: ${{ inputs.release-commit }}
      dependency-ranges: ${{ inputs.dependency-ranges }}
      install-core: ${{ inputs.install-core }}
      package-directory: ${{ inputs.package-directory }}
      integration-branch: ${{ inputs.integration-branch }}
    secrets:
      RELEASE_GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
