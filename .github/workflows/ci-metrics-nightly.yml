name: Nightly failures the merge queue missed

on:
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/ci-metrics/nightly*.ts
      - scripts/ci-metrics/github.ts
      - .github/workflows/ci-metrics-nightly.yml

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Report the nightly failures of the last 30 days
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/ci-metrics/nightly-main.ts --days 30 \
            --save "$RUNNER_TEMP/nightly-dataset.json" --json "$RUNNER_TEMP/nightly-report.json" \
            > "$RUNNER_TEMP/nightly-report.md"
          cat "$RUNNER_TEMP/nightly-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-report
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/nightly-report.md
            ${{ runner.temp }}/nightly-report.json
            ${{ runner.temp }}/nightly-dataset.json
          retention-days: 90
