name: Release private npm package

on:
  workflow_call:
    inputs:
      channel:
        description: npm distribution channel
        required: true
        type: string
      install-core:
        description: Install the AntelopeJS CLI before releasing
        default: true
        type: boolean
      package-directory:
        description: Relative path to the package directory to release
        default: .
        type: string
      services-compose-file:
        description: Relative path to a docker compose file whose services must run during the release
        default: ""
        type: string
    secrets:
      RELEASE_GITHUB_TOKEN:
        description: Token allowed to create the release commit, tag, and GitHub release
        required: false
      NPM_ANTELOPE_TOKEN:
        description: Token allowed to install and publish private packages
        required: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
    concurrency:
      group: npm-release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Validate release source and channel
        env:
          CHANNEL: ${{ inputs.channel }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          case "$CHANNEL" in
            latest) release_branch=$DEFAULT_BRANCH ;;
            next) release_branch=next ;;
            *) echo "Unsupported npm channel: $CHANNEL" >&2; exit 1 ;;
          esac
          test "$GITHUB_REF" = "refs/heads/$release_branch" || {
            echo "The $CHANNEL channel must be released from the $release_branch branch, not $GITHUB_REF." >&2
            exit 1
          }

      - name: Validate release credentials
        env:
          RELEASE_GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          NPM_ANTELOPE_TOKEN: ${{ secrets.NPM_ANTELOPE_TOKEN }}
        run: |
          test -n "$RELEASE_GITHUB_TOKEN" || {
            echo "RELEASE_GITHUB_TOKEN is not configured." >&2
            exit 1
          }
          test -n "$NPM_ANTELOPE_TOKEN" || {
            echo "NPM_ANTELOPE_TOKEN is not configured." >&2
            exit 1
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate package directory
        env:
          PACKAGE_DIRECTORY: ${{ inputs.package-directory }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')

          const workspace = fs.realpathSync(process.env.GITHUB_WORKSPACE)
          const input = process.env.PACKAGE_DIRECTORY
          if (!input || path.isAbsolute(input)) {
            console.error('package-directory must be a relative directory inside the repository')
            process.exit(1)
          }

          const directory = path.resolve(workspace, input)
          const relativeDirectory = path.relative(workspace, directory)
          if (relativeDirectory === '..' || relativeDirectory.startsWith(`..${path.sep}`) || path.isAbsolute(relativeDirectory)) {
            console.error('package-directory must stay inside the repository')
            process.exit(1)
          }

          let realDirectory
          try {
            realDirectory = fs.realpathSync(directory)
          } catch {
            console.error(`package-directory does not exist: ${input}`)
            process.exit(1)
          }
          const realRelativeDirectory = path.relative(workspace, realDirectory)
          if (realRelativeDirectory === '..' || realRelativeDirectory.startsWith(`..${path.sep}`) || path.isAbsolute(realRelativeDirectory)) {
            console.error('package-directory must resolve inside the repository')
            process.exit(1)
          }
          if (!fs.statSync(realDirectory).isDirectory()) {
            console.error(`package-directory is not a directory: ${input}`)
            process.exit(1)
          }

          const packageJson = path.join(realDirectory, 'package.json')
          if (!fs.statSync(packageJson, { throwIfNoEntry: false })?.isFile()) {
            console.error(`package.json was not found in package-directory: ${input}`)
            process.exit(1)
          }
          NODE

      - name: Validate services compose file
        id: services
        if: inputs.services-compose-file != ''
        env:
          SERVICES_COMPOSE_FILE: ${{ inputs.services-compose-file }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')

          const workspace = fs.realpathSync(process.env.GITHUB_WORKSPACE)
          const input = process.env.SERVICES_COMPOSE_FILE
          if (path.isAbsolute(input)) {
            console.error('services-compose-file must be a relative file path inside the repository')
            process.exit(1)
          }

          const file = path.resolve(workspace, input)
          const relativeFile = path.relative(workspace, file)
          if (relativeFile === '..' || relativeFile.startsWith(`..${path.sep}`) || path.isAbsolute(relativeFile)) {
            console.error('services-compose-file must stay inside the repository')
            process.exit(1)
          }

          let realFile
          try {
            realFile = fs.realpathSync(file)
          } catch {
            console.error(`services-compose-file does not exist: ${input}`)
            process.exit(1)
          }
          const realRelativeFile = path.relative(workspace, realFile)
          if (realRelativeFile === '..' || realRelativeFile.startsWith(`..${path.sep}`) || path.isAbsolute(realRelativeFile)) {
            console.error('services-compose-file must resolve inside the repository')
            process.exit(1)
          }
          if (!fs.statSync(realFile).isFile()) {
            console.error(`services-compose-file is not a regular file: ${input}`)
            process.exit(1)
          }

          NODE

      - name: Resolve pnpm lockfile
        id: lockfile
        env:
          PACKAGE_DIRECTORY: ${{ inputs.package-directory }}
        run: |
          set -euo pipefail
          root=$(pwd -P)
          directory=$(cd "$PACKAGE_DIRECTORY" && pwd -P)
          lockfile=""
          current="$directory"
          while [ "$current" = "$root" ] || [ "${current#"$root"/}" != "$current" ]; do
            if [ -f "$current/pnpm-lock.yaml" ]; then
              if [ "$current" = "$root" ]; then
                lockfile=pnpm-lock.yaml
              else
                lockfile="${current#"$root"/}/pnpm-lock.yaml"
              fi
              break
            fi
            if [ "$current" = "$root" ]; then
              break
            fi
            current=$(dirname "$current")
          done
          if [ -z "$lockfile" ]; then
            echo "No pnpm-lock.yaml found in $PACKAGE_DIRECTORY or any parent directory up to the repository root." >&2
            exit 1
          fi
          echo "Using lockfile $lockfile"
          echo "path=$lockfile" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          registry-url: https://npm.antelopejs.cloud/
          scope: "@antelopejs-private"
          cache: pnpm
          cache-dependency-path: ${{ steps.lockfile.outputs.path }}

      - name: Validate package publication metadata
        working-directory: ${{ inputs.package-directory }}
        run: |
          node <<'NODE'
          const pkg = require('./package.json')
          const errors = []
          if (!pkg.name?.startsWith('@antelopejs-private/')) errors.push('name must use the @antelopejs-private scope')
          if (pkg.private === true) errors.push('private must not be true for a published package')
          if (pkg.license !== 'Apache-2.0') errors.push('license must be Apache-2.0')
          if (pkg.publishConfig?.registry !== 'https://npm.antelopejs.cloud/') {
            errors.push('publishConfig.registry must be https://npm.antelopejs.cloud/')
          }
          if (errors.length) {
            console.error(errors.join('\n'))
            process.exit(1)
          }
          NODE

      - name: Install dependencies
        working-directory: ${{ inputs.package-directory }}
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ANTELOPE_TOKEN }}

      - name: Install AntelopeJS CLI
        if: inputs.install-core
        run: pnpm add --global @antelopejs/core

      - name: Configure release identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Start services
        if: steps.services.outcome == 'success'
        env:
          SERVICES_COMPOSE_FILE: ${{ inputs.services-compose-file }}
        run: docker compose -f "$SERVICES_COMPOSE_FILE" up -d --wait

      - name: Publish release
        env:
          CHANNEL: ${{ inputs.channel }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ANTELOPE_TOKEN }}
        run: |
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
          trap 'git config --local --unset-all http.https://github.com/.extraheader || true' EXIT

          args=(--ci "--git.requireBranch=$GITHUB_REF_NAME")
          if [ "$CHANNEL" = latest ]; then
            # Stable releases ignore prerelease tags, so requireCommits and the
            # changelog compare against the last stable release.
            prerelease_tags='*.*.*-*'
            args+=("--git.tagExclude=$prerelease_tags")
            tag_match=$(node <<'NODE'
          const fs = require('node:fs')
          const config = fs.existsSync('.release-it.json') ? JSON.parse(fs.readFileSync('.release-it.json', 'utf8')) : {}
          const git = config.git ?? {}
          console.log((git.tagMatch || git.tagName || 'v${version}').replace('${version}', '*'))
          NODE
            )
            stable_tag=$(git describe --tags --abbrev=0 --match "$tag_match" --exclude "$prerelease_tags" 2>/dev/null || true)
            if [ -n "$stable_tag" ]; then
              args+=("--plugins.release-it-changelogen.from=$stable_tag")
            fi
            # Promoting a prerelease ships its base version (1.9.0-next.4 -> 1.9.0).
            version=$(node -p "require('./package.json').version")
            case "$version" in
              *-*) args+=("--increment=${version%%-*}") ;;
            esac
          else
            # Prerelease commits use a type that changelogen ignores, so they
            # stay out of the next stable changelog.
            # shellcheck disable=SC2016 # ${version} is expanded by release-it.
            args+=(--preRelease=next '--git.commitMessage=release: v${version}')
          fi
          pnpm release "${args[@]}"
        working-directory: ${{ inputs.package-directory }}

      - name: Stop services
        if: always() && steps.services.outcome == 'success'
        env:
          SERVICES_COMPOSE_FILE: ${{ inputs.services-compose-file }}
        run: docker compose -f "$SERVICES_COMPOSE_FILE" down -v
