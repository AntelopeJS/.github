name: Visibility probe called

on:
  workflow_call:

permissions: {}

jobs:
  called:
    name: "probe workflow_call from ${{ github.event_name }} visibility=${{ github.event.repository.visibility || 'absent' }}"
    runs-on: ${{ vars.RUNNER_CI || (github.event.repository.visibility == 'public' && 'ubuntu-latest' || 'blacksmith-4vcpu-ubuntu-2404') }}
    timeout-minutes: 2
    steps:
      - run: echo "$VISIBILITY"
        env:
          VISIBILITY: ${{ github.event.repository.visibility }}
